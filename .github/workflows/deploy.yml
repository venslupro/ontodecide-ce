# Deploy: main → prod, staging → staging. Renders Wrangler configs from
# Terraform outputs, applies D1 migrations, deploys the 7 Workers leaf → root
# with their secrets, then publishes the Pages project (Direct Upload).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'staging' && 'staging' || 'production' }}
    env:
      ENV: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'staging' && 'staging' || 'prod' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID || secrets.B2_MASTER_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_KEY || secrets.B2_MASTER_KEY }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
      WRITEBACK_SECRET: ${{ secrets.WRITEBACK_SECRET }}
      CONNECTOR_ENC_KEY: ${{ secrets.CONNECTOR_ENC_KEY }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Read Terraform outputs
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="key=${ENV}/terraform.tfstate" > /dev/null
          terraform output -json > ../tf-output.json
          # Sensitive outputs → masked env for secret upload.
          node -e '
            const o = require("../tf-output.json");
            const put = (k, v) => { if (!v) return; console.log(`::add-mask::${v}`); require("fs").appendFileSync(process.env.GITHUB_ENV, `${k}<<__EOF__\n${v}\n__EOF__\n`); };
            put("B2_KEY_ID", o.b2_integration_key?.value?.key_id);
            put("B2_APP_KEY", o.b2_integration_key?.value?.key);
            put("NEO4J_URL", o.neo4j?.value?.url);
            put("NEO4J_USER", o.neo4j?.value?.username);
            put("NEO4J_PASSWORD", o.neo4j_password?.value);
          '
      - run: node scripts/gen_wrangler.mjs --env "$ENV" --tf-output tf-output.json
      - run: rm tf-output.json
      - run: ENV="$ENV" bash scripts/bootstrap.sh
      - run: pnpm build:web
      - run: bash scripts/deploy.sh
