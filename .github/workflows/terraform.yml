# Terraform (production only). Stages, one job each:
#
#   Format → Validate → Lint → Plan → Apply
#
# Format, Validate, Lint and Plan run for every pull request and on main. Apply
# runs only on main (github.ref and a first-step check of GITHUB_REF), only
# from a green push-CI on main (workflow_run) or a manual run on main, only
# when Plan found changes, and only after a reviewer approves the
# `production` environment. Nothing else ever applies.
#
# Triggers (one run per change, no duplicates):
#   pull_request      → Format … Plan for every PR (plan -lock=false, never
#                       applies). Fork PRs get no secrets and stop after
#                       Lint. Branch pushes do not trigger Terraform, so a
#                       branch with a PR shows only its pull-request run;
#   workflow_dispatch → on main: up to Apply; on any other ref (e.g. a
#                       branch without a PR): stops after Plan;
#   workflow_run      → the release chain on main (CI on main succeeded);
#   schedule          → nightly drift check on main (Plan).
#
# Concurrency: runs on main share one serialized group (the B2 backend has
# no verified locking); every other ref has its own group in which a newer
# run cancels the older one.
#
# On main it is the middle link of the release chain
#
#   push to main → CI → Terraform → Deploy
#
# so Deploy always follows Terraform for the same commit. A nightly run on
# main goes up to Plan as a drift check.
name: Terraform

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The B2 backend has no verified locking; serialize runs on main. Other
  # refs only plan (no lock) and supersede their own older runs.
  group: terraform-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
  # Custom domain (empty: pages.dev fallback) and its mail / DMARC records.
  TF_VAR_domain: ${{ vars.APP_DOMAIN }}
  TF_VAR_dmarc_policy: ${{ vars.DMARC_POLICY || 'none' }}
  TF_VAR_mail_dns_records: ${{ vars.MAIL_DNS_RECORDS || '[]' }}
  # Archive signing key slot (a | b), switched monthly (infra/variables.tf).
  TF_VAR_archive_sign_active: ${{ vars.ARCHIVE_SIGN_SLOT || 'a' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID || secrets.B2_MASTER_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_KEY || secrets.B2_MASTER_KEY }}
  B2_APPLICATION_KEY_ID: ${{ secrets.B2_MASTER_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_MASTER_KEY }}
  # Legacy: the neo4jaura provider reads the forgotten V1.3 instance
  # (infra/legacy.tf); drop with it.
  AURA_CLIENT_ID: ${{ secrets.NEO4J_AURA_CLIENT_ID }}
  AURA_CLIENT_SECRET: ${{ secrets.NEO4J_AURA_CLIENT_SECRET }}

defaults:
  run:
    working-directory: infra

jobs:
  fmt:
    name: Format
    # From CI only when it was a green push to main. Later stages are
    # skipped with it.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
      - run: terraform init -backend=false
      - run: terraform validate

  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0
      - run: tflint --format compact

  plan:
    name: Plan
    needs: lint
    # Fork PRs get no secrets, so they stop after the static checks. Plans
    # never take the state lock except on main (apply job).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-changes: ${{ steps.plan.outputs.exitcode == '2' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode > plan.txt
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          { echo '### terraform plan'; echo '```'; tail -n 80 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [[ ${code} -ne 1 ]]
      - name: Drift detected
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: echo "::error::Infrastructure drift detected" && exit 1

  apply:
    name: Apply (production)
    needs: plan
    # Defensive guard: main only, from a green push-CI on main or a manual
    # run on main, and only when Plan found changes.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.plan.outputs.has-changes == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for a required reviewer to approve the plan above.
    environment: production
    steps:
      - name: Refuse to apply outside main
        # Runs before checkout: infra/ (defaults.run) does not exist yet.
        working-directory: .
        run: |
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "::error::terraform apply runs only on refs/heads/main (got ${GITHUB_REF})"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -auto-approve tfplan
