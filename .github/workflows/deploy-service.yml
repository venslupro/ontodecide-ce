# ============================================================
# Deploy Cloudflare Workers — Application Logic Layer
#
# The APPLICATION pillar of the hybrid "Shift Left" architecture.
# Resource bindings (D1 / KV / Queue / Service Bindings / Cron /
# Domains) are LOCKED by Terraform (terraform.yml) — this workflow
# only ships CODE + RUNTIME SECRETS, fast and incrementally.
#
# ORDERED MULTI-LAYER DEPLOY (dependency-aware, new):
#   The 6 services form a Service-Binding DAG. To guarantee that
#   every binding target exists before its caller is shipped,
#   deploys run in 3 ordered layers (each layer is a parallel
#   matrix):
#
#     Layer 1 (leaves)    : user, graph, ai, cleanup
#                          — no outgoing Service Bindings.
#     Layer 2 (ingestion) : ingestion → depends on graph (Layer 1)
#     Layer 3 (gateway)   : gateway   → depends on all 5 downstream
#
#   Layer N only starts after Layer N-1 finished (success) or had
#   no work this run (skipped). A FAILED layer halts all downstream
#   layers AND the migrate-d1 job (fail-fast across layers), while
#   `fail-fast: false` keeps siblings within a layer independent.
#
#   Service → layer assignment is data-driven: see the `layer`
#   field on each entry of DEFAULTS_MATRIX_JSON below.
#
# CHANGE-AWARE DEPLOY:
#   A "detect-changes" job uses `dorny/paths-filter` to compute
#   WHICH services actually have source changes vs the last main
#   commit. Only those services enter their layer's deploy matrix.
#   If nothing changed, the workflow short-circuits.
#
# EXPLICIT SERVICE OVERRIDE:
#   `workflow_dispatch` accepts an optional comma-separated list
#   of service names to force-deploy regardless of diff. The
#   forced set is still routed through the correct layer, so the
#   Service Binding order (graph before ingestion before gateway)
#   is never violated.
#
# MANUAL-ONLY TRIGGER (no push / no PR auto-run):
#   Worker deployments touch production Cloudflare accounts (script
#   uploads + secret writes + D1 migrations). To guarantee zero
#   accidental deployments, this workflow has ZERO automatic
#   triggers. Every run is a human action:
#     Repo → Actions → Deploy Cloudflare Workers → Run workflow →
#     choose branch + (optionally) override services and/or env.
#
# QUALITY GATES (per-service, inside each layer — see
#   .github/actions/deploy-service/action.yml):
#   1. typecheck  — `pnpm turbo run typecheck --filter=<pkg>`
#   2. lint       — `pnpm turbo run lint --filter=<pkg>`
#   3. test       — `pnpm turbo run test --filter=<pkg>`
#   4. wrangler types — regenerate binding types & validate that
#                       wrangler.toml bindings match code-side
#                       TypeScript declarations at compile time
#                       (catches Terraform ↔ code drift EARLY).
#   5. build      — emits worker bundle for wrangler.
#
# SECRET DISTRIBUTION (unchanged per DDD boundary rule):
#   JWT_SECRET → Gateway + User only. Downstream services read
#   x-tenant-id / x-user-role / x-internal-call from Gateway.
#
# REQUIRED GITHUB SECRETS (unchanged):
#   CF_API_TOKEN      — Workers Scripts Edit + D1 Edit
#   CF_ACCOUNT_ID     — Cloudflare Account ID (32 hex)
#   JWT_SECRET        — gateway + user
#   EMAIL_API_KEY     — user
#   NEO4J_PASSWORD    — graph + cleanup
#   B2_KEY_ID / B2_KEY — ingestion + cleanup
#   OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY /
#     OPENROUTER_API_KEY / AI_GATEWAY_TOKEN — ai (all optional)
# ============================================================

name: Deploy Cloudflare Workers

# MANUAL-ONLY TRIGGER (no push / no PR auto-run).
# The only way to execute this workflow is:
#   Repo → Actions → Deploy Cloudflare Workers → Run workflow →
#   choose branch + (optionally) override services and/or env.
on:
  workflow_dispatch:
    inputs:
      services:
        description: |
          Comma-separated services to force-deploy (ignores diff).
          Leave empty for auto-detect.  Example: gateway,user,ai
        required: false
        default: ''
      environment:
        description: 'Target environment (passed to wrangler as TAG info only; resources are Terraform-managed)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-service-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------------
# DEFAULTS_MATRIX_JSON — single source of truth for the 6 API
# services. The `layer` field encodes the Service Binding DAG
# (topological sort):
#   1 = leaf   — no outgoing Service Bindings (user/graph/ai/cleanup)
#   2 = mid    — depends on a Layer 1 service (ingestion → graph)
#   3 = root   — depends on every downstream service (gateway)
# Add new services HERE ONLY; the rest of the workflow reads this
# list dynamically (including layer routing).
# ------------------------------------------------------------------
env:
  DEFAULTS_MATRIX_JSON: >-
    [
      {"name":"gateway",   "config":"apps/api/gateway/wrangler.toml",     "package":"@ontodecide/gateway",   "layer":3},
      {"name":"user",      "config":"apps/api/user/wrangler.toml",        "package":"@ontodecide/user",      "layer":1},
      {"name":"graph",     "config":"apps/api/graph/wrangler.toml",       "package":"@ontodecide/graph",     "layer":1},
      {"name":"ingestion", "config":"apps/api/ingestion/wrangler.toml",   "package":"@ontodecide/ingestion", "layer":2},
      {"name":"ai",        "config":"apps/api/ai/wrangler.toml",          "package":"@ontodecide/ai",        "layer":1},
      {"name":"cleanup",   "config":"apps/api/cleanup/wrangler.toml",     "package":"@ontodecide/cleanup",   "layer":1}
    ]

jobs:
  # ----------------------------------------------------------------
  # Job 0 — Compute deploy set (change-detect OR explicit override)
  #         then split it into 3 layer matrices (topological order).
  # ----------------------------------------------------------------
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      layer1_matrix_json: ${{ steps.compute.outputs.layer1_matrix_json }}
      layer2_matrix_json: ${{ steps.compute.outputs.layer2_matrix_json }}
      layer3_matrix_json: ${{ steps.compute.outputs.layer3_matrix_json }}
      has_layer1:        ${{ steps.compute.outputs.has_layer1 }}
      has_layer2:        ${{ steps.compute.outputs.has_layer2 }}
      has_layer3:        ${{ steps.compute.outputs.has_layer3 }}
      has_changes:       ${{ steps.compute.outputs.has_changes }}
    steps:
      - name: Checkout (full history for paths-filter)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Expand DEFAULTS_MATRIX_JSON into a list of `paths-filter`
      # rules, one per service. Each rule uses the service's
      # declared src_paths (includes transitive shared/ dep).
      - name: Build paths-filter ruleset + run detection
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: 'none'
          filters: |
            gateway:
              - 'apps/api/gateway/**'
              - 'apps/shared/**'
            user:
              - 'apps/api/user/**'
              - 'apps/shared/**'
            graph:
              - 'apps/api/graph/**'
              - 'apps/shared/**'
            ingestion:
              - 'apps/api/ingestion/**'
              - 'apps/shared/**'
            ai:
              - 'apps/api/ai/**'
              - 'apps/shared/**'
            cleanup:
              - 'apps/api/cleanup/**'
              - 'apps/shared/**'
            workflow:
              - '.github/workflows/deploy-service.yml'

      # Build the final per-layer matrices:
      #   • If user provided workflow_dispatch `services` → parse CSV
      #     and use those (force-deploy mode).
      #   • Else if `workflow` file changed → deploy ALL services
      #     (pipeline change needs re-verify across fleet).
      #   • Else → deploy only services paths-filter flagged as true.
      #
      # The selected set is then grouped by the `layer` field on
      # each DEFAULTS_MATRIX_JSON entry, emitting 3 matrices:
      #   layer1_matrix_json (leaves)      → user / graph / ai / cleanup
      #   layer2_matrix_json (ingestion)   → ingestion
      #   layer3_matrix_json (gateway)     → gateway
      # Each layer job reads its own matrix; empty layers are skipped.
      - name: Compute final deploy matrices (per layer)
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          ALL="$DEFAULTS_MATRIX_JSON"

          FORCE_SVC="${{ github.event.inputs.services }}"
          WORKFLOW_CHANGED="${{ steps.filter.outputs.workflow }}"

          if [ -n "$FORCE_SVC" ]; then
            echo ">>> workflow_dispatch: force-deploy list = [$FORCE_SVC]"
            # Split CSV, trim spaces, dedupe
            IFS=',' read -ra ARR <<< "$FORCE_SVC"
            NAMES=()
            for raw in "${ARR[@]}"; do
              clean="$(echo "$raw" | xargs)"
              [ -n "$clean" ] && NAMES+=("$clean")
            done
          elif [ "$WORKFLOW_CHANGED" = "true" ]; then
            echo ">>> deploy-service.yml itself changed — deploying ALL 6 services"
            NAMES=(gateway user graph ingestion ai cleanup)
          else
            echo ">>> Using paths-filter diff results"
            NAMES=()
            for svc in gateway user graph ingestion ai cleanup; do
              val="$(echo '${{ toJSON(steps.filter.outputs) }}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('$svc','false'))" 2>/dev/null || echo "false")"
              if [ "$val" = "true" ]; then
                NAMES+=("$svc")
              fi
            done
          fi

          echo "Services selected for deploy: ${NAMES[*]:-(none)}"

          if [ ${#NAMES[@]} -eq 0 ]; then
            {
              echo "layer1_matrix_json=[]"
              echo "layer2_matrix_json=[]"
              echo "layer3_matrix_json=[]"
              echo "has_layer1=false"
              echo "has_layer2=false"
              echo "has_layer3=false"
              echo "has_changes=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Group selected services by their `layer` field and emit
          # one matrix per layer (preserve DEFAULTS_MATRIX_JSON order).
          python3 -c "
          import sys, json
          all_items = json.loads('''$ALL''')
          wanted = set(sys.argv[1:])
          selected = [it for it in all_items if it['name'] in wanted]
          by_layer = {}
          for it in selected:
              by_layer.setdefault(it['layer'], []).append(it)
          lines = []
          for layer in (1, 2, 3):
              arr = by_layer.get(layer, [])
              lines.append('layer{}_matrix_json={}'.format(layer, json.dumps(arr, separators=(',', ':'))))
              lines.append('has_layer{}={}'.format(layer, str(len(arr) > 0).lower()))
          lines.append('has_changes=true')
          print('\n'.join(lines))
          " "${NAMES[@]}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Job 1 — Layer 1 deploy (leaves: user / graph / ai / cleanup).
  #         Parallel matrix, fail-fast=false. No outgoing Service
  #         Bindings → safe to ship first.
  #         Per-service steps live in the composite action:
  #           .github/actions/deploy-service
  # ----------------------------------------------------------------
  deploy-layer-1:
    name: Deploy Layer 1 · ${{ matrix.service.name }}
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.detect-changes.outputs.has_layer1 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.layer1_matrix_json) }}
    # Map ALL GitHub Secrets → env vars (secrets context is NOT
    # available inside strategy.matrix nor inside the composite
    # action, so we inject at job level and read from env).
    env:
      CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
      JWT_SECRET:         ${{ secrets.JWT_SECRET }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      EMAIL_API_KEY:      ${{ secrets.EMAIL_API_KEY }}
      B2_KEY_ID:          ${{ secrets.B2_KEY_ID }}
      B2_KEY:             ${{ secrets.B2_KEY }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_TOKEN:   ${{ secrets.AI_GATEWAY_TOKEN }}
    steps:
      - name: Deploy ${{ matrix.service.name }} (gates + wrangler)
        uses: ./.github/actions/deploy-service
        with:
          service_name:    ${{ matrix.service.name }}
          service_config:  ${{ matrix.service.config }}
          service_package: ${{ matrix.service.package }}

  # ----------------------------------------------------------------
  # Job 2 — Layer 2 deploy (ingestion).
  #         Depends on graph (Layer 1) via the GRAPH_SERVICE
  #         Service Binding. Runs only if Layer 1 succeeded OR had
  #         no work this run (skipped). A Layer 1 failure halts this.
  # ----------------------------------------------------------------
  deploy-layer-2:
    name: Deploy Layer 2 · ${{ matrix.service.name }}
    needs: [detect-changes, deploy-layer-1]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.detect-changes.outputs.has_layer2 == 'true' &&
      always() &&
      (needs.deploy-layer-1.result == 'success' || needs.deploy-layer-1.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.layer2_matrix_json) }}
    env:
      CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
      JWT_SECRET:         ${{ secrets.JWT_SECRET }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      EMAIL_API_KEY:      ${{ secrets.EMAIL_API_KEY }}
      B2_KEY_ID:          ${{ secrets.B2_KEY_ID }}
      B2_KEY:             ${{ secrets.B2_KEY }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_TOKEN:   ${{ secrets.AI_GATEWAY_TOKEN }}
    steps:
      - name: Deploy ${{ matrix.service.name }} (gates + wrangler)
        uses: ./.github/actions/deploy-service
        with:
          service_name:    ${{ matrix.service.name }}
          service_config:  ${{ matrix.service.config }}
          service_package: ${{ matrix.service.package }}

  # ----------------------------------------------------------------
  # Job 3 — Layer 3 deploy (gateway).
  #         Depends on ALL 5 downstream services via Service Bindings
  #         (USER / GRAPH / INGESTION / AI / CLEANUP). Runs only if
  #         Layers 1 and 2 succeeded OR had no work this run.
  # ----------------------------------------------------------------
  deploy-layer-3:
    name: Deploy Layer 3 · ${{ matrix.service.name }}
    needs: [detect-changes, deploy-layer-1, deploy-layer-2]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.detect-changes.outputs.has_layer3 == 'true' &&
      always() &&
      (needs.deploy-layer-1.result == 'success' || needs.deploy-layer-1.result == 'skipped') &&
      (needs.deploy-layer-2.result == 'success' || needs.deploy-layer-2.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.layer3_matrix_json) }}
    env:
      CF_API_TOKEN:       ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:      ${{ secrets.CF_ACCOUNT_ID }}
      JWT_SECRET:         ${{ secrets.JWT_SECRET }}
      NEO4J_PASSWORD:     ${{ secrets.NEO4J_PASSWORD }}
      EMAIL_API_KEY:      ${{ secrets.EMAIL_API_KEY }}
      B2_KEY_ID:          ${{ secrets.B2_KEY_ID }}
      B2_KEY:             ${{ secrets.B2_KEY }}
      OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_TOKEN:   ${{ secrets.AI_GATEWAY_TOKEN }}
    steps:
      - name: Deploy ${{ matrix.service.name }} (gates + wrangler)
        uses: ./.github/actions/deploy-service
        with:
          service_name:    ${{ matrix.service.name }}
          service_config:  ${{ matrix.service.config }}
          service_package: ${{ matrix.service.package }}

  # ----------------------------------------------------------------
  # Job 4 — Post-deploy: apply D1 migrations to the shared-db.
  #         Runs ONCE after all deploy layers finished (success or
  #         no-work skip). Halts if ANY layer FAILED (the always()
  #         + per-layer result checks below enforce this).
  #
  #         D1 name = "${PROJECT_NAME}-${ENV_SHORT}-shared-db"
  #         Must match Terraform cloudflare_d1_database.shared_db.name.
  # ----------------------------------------------------------------
  migrate-d1:
    name: Apply D1 Migrations (remote)
    needs: [detect-changes, deploy-layer-1, deploy-layer-2, deploy-layer-3]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      always() &&
      (needs.deploy-layer-1.result == 'success' || needs.deploy-layer-1.result == 'skipped') &&
      (needs.deploy-layer-2.result == 'success' || needs.deploy-layer-2.result == 'skipped') &&
      (needs.deploy-layer-3.result == 'success' || needs.deploy-layer-3.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # ---- D1 name resolution (matches Terraform variables.tf) ----
      # Project name = GitHub repo name; environment defaults to production.
      PROJECT_NAME: ${{ github.event.repository.name }}
      ENVIRONMENT:  ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Print migration target (diagnostic)
        run: |
          echo "PROJECT_NAME = ${PROJECT_NAME}"
          echo "ENVIRONMENT  = ${ENVIRONMENT}"
          echo "Target D1    = (computed by migrate.sh — run --dry-run below)"
          ./scripts/migrate.sh --env "${ENVIRONMENT}" --dry-run

      - name: Apply D1 migrations (remote — idempotent, no-ops if current)
        run: ./scripts/migrate.sh --env "${ENVIRONMENT}" --remote
