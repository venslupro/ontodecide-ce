# AI Service Worker — multi-LLM decision intelligence.
#
# ============================================================
# HYBRID ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS:
#       - Worker skeleton + 4D tags
#       - D1 binding "DB" → shared decision-db
#       - KV namespace "CACHE"
#       - Gateway → AI Service Binding (binding=AI_SERVICE)
#   • Wrangler deploys (NOT Terraform — Provider v4 lacks support):
#       - [ai] AI binding     → Workers AI (Neurons / models catalog)
#       - Durable Object "AGENT"  → PlanningAgent class
#       - [[migrations]] tag=v1  → DO class code upload
#       - [vars] plain-text · optional LLM provider secrets
# ============================================================
#
# Identity model:
#   • This Worker does NOT hold JWT_SECRET. It trusts Gateway-injected
#     headers (enforced by `internalOnlyMiddleware()` — every route is
#     Gateway-only; no public carve-outs).
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "ontodecide-prd-ai"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/ai exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/ai"

# Workers AI binding (Wrangler-only — Terraform Provider v4 has no
# ai_binding block on cloudflare_workers_script).
[ai]
binding = "AI"

# ----- D1: shared decision-db (Terraform-managed) -------------------------
# database_name matches cloudflare_d1_database.decision_db.name pattern.
[[d1_databases]]
binding        = "DB"
database_name  = "ontodecide-prd-decision-db"
migrations_dir = "src/migrations"

# ----- KV: inference cache + neuron-budget (Terraform-managed) ------------
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_CACHE_AI_ID"

# Durable Object: planning agent.
# Terraform knows the CLASS NAME (outputs as durable_object_classes) but
# the actual class CODE + binding is uploaded via Wrangler [[migrations]].
[[durable_objects.bindings]]
name       = "AGENT"
class_name = "PlanningAgent"

[[migrations]]
tag         = "v1"
new_classes = ["PlanningAgent"]

[vars]
AI_DEFAULT_PROVIDER = "workers-ai"
WORKERS_AI_MODEL    = "@cf/meta/llama-3-8b-instruct"
AI_GATEWAY_ID       = "ontodecide-prd-gateway"
OPENAI_MODEL        = "gpt-4o-mini"
ANTHROPIC_MODEL     = "claude-3-sonnet-20241022"
GOOGLE_MODEL        = "gemini-1.5-flash"
OPENROUTER_MODEL    = "openai/gpt-4o-mini"

# Secrets (Dashboard → Secrets, CI, or `wrangler secret put`):
#   (JWT_SECRET is NOT required here. Identity is read from headers.)
#   OPENAI_API_KEY         — when AI_DEFAULT_PROVIDER == "openai".
#   ANTHROPIC_API_KEY      — when AI_DEFAULT_PROVIDER == "anthropic".
#   GOOGLE_API_KEY         — when AI_DEFAULT_PROVIDER == "google".
#   OPENROUTER_API_KEY     — when AI_DEFAULT_PROVIDER == "openrouter".
#   AI_GATEWAY_TOKEN       — (optional) to route through an AI Gateway.
