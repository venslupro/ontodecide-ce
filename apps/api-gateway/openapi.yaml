    post:
      tags: [admin-passkeys]
      operationId: adminPasskeyOptions
      summary: WebAuthn creation options for a new passkey
      responses:
        '200':
          description: PublicKeyCredentialCreationOptionsJSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnJson'}
        default: {$ref: '#/components/responses/Problem'}
  /admin/passkeys/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [admin-passkeys]
      operationId: adminDeletePasskey
      summary: Remove a passkey (at least 2 must remain)
      parameters: [{$ref: '#/components/parameters/StepUp'}]
      responses:
        '204': {description: Removed}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— ops ———————————————————————————————
  /health:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string}
                  environment: {type: string}
  /openapi.yaml:
    get:
      tags: [ops]
      operationId: getOpenApi
      summary: This document
      security: []
      responses:
        '200':
          description: OpenAPI 3.2 document
          content:
            application/yaml:
              schema: {type: string}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ed25519 (EdDSA) access token, 15 minutes, kept in memory only.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-od_rt
      description: Refresh token cookie (HttpOnly; Secure; SameSite=Strict; Path=/).

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current version, `"v{n}"`.
      schema: {type: string, example: '"v3"'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{16,64}$'}
    StepUp:
      name: X-Step-Up
      in: header
      required: true
      description: Step-up token from a passkey user verification (≤ 5 min).
      schema: {type: string}
    ActAsTenant:
      name: X-Act-As-Tenant
      in: header
      required: false
      description: Admin only. Target trial workspace id (ULID).
      schema: {$ref: '#/components/schemas/Ulid'}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Rid:
      name: rid
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Rid'}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    ApiName:
      name: id
      in: path
      required: true
      description: Definition api name.
      schema: {$ref: '#/components/schemas/ApiName'}
    Uid:
      name: uid
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    Tid:
      name: tid
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    Token:
      name: token
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,128}$'}

  headers:
    ETag:
      description: Resource version, `"v{n}"`.
      schema: {type: string}
    RetryAfter:
      description: Seconds until the rate window resets.
      schema: {type: integer}
    SetRefreshCookie:
      description: '`__Host-od_rt=…; HttpOnly; Secure; SameSite=Strict; Path=/; Expires=…`'
      schema: {type: string}

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SessionIssued:
      description: Session issued; the refresh token is only in the cookie
      headers:
        Set-Cookie: {$ref: '#/components/headers/SetRefreshCookie'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Session'}
    DefinitionList:
      description: Definitions (ETag = schema version)
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DefinitionList'}
    DefinitionResult:
      description: Definition (ETag = schema version)
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DefinitionResult'}
    DefinitionDeleted:
      description: Deleted (ETag = new schema version)
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
    AutomationWithEtag:
      description: Automation
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Automation'}
    SettingsWithEtag:
      description: Settings
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlatformSettings'}
    BlockedDomains:
      description: Block list
      content:
        application/json:
          schema: {$ref: '#/components/schemas/BlockedDomains'}

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - CODE_INVALID
            - UNAUTHENTICATED
            - TRIAL_EXPIRED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PRECONDITION_FAILED
            - RATE_LIMITED
            - QUOTA_EXCEEDED
            - INTERNAL
            - UNAVAILABLE
            - SIGNUP_CLOSED
        traceId: {type: string}
        errors:
          type: array
          description: Field errors (VALIDATION_FAILED)
          items:
            type: object
            required: [path, message]
            properties:
              path: {type: string}
              message: {type: string}
        reason:
          type: string
          description: >-
            FORBIDDEN on admin-token routes: the admin must finish passkey setup
            (at least 2 passkeys and recovery codes) or, after a recovery-code
            sign-in, bind a new passkey first.
          enum: [PASSKEY_SETUP_INCOMPLETE, RECOVERY_PENDING]
      additionalProperties: true
    Ulid: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'}
    Rid: {type: string, pattern: '^ri\.[A-Za-z][A-Za-z0-9_]*\.[0-9A-Z]{26}$'}
    ApiName: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'}
    Locale: {type: string, enum: [zh-CN, en-US]}
    I18nText:
      oneOf:
        - {type: string}
        - {type: object, additionalProperties: {type: string}}
    Used:
      type: object
      required: [used, limit]
      properties:
        used: {type: integer}
        limit: {type: integer}
    Quotas:
      type: object
      required: [objects, links, importRowsToday, aiRecsToday, mappingDraftsToday, sessions, resetsAt]
      properties:
        objects: {$ref: '#/components/schemas/Used'}
        links: {$ref: '#/components/schemas/Used'}
        importRowsToday: {$ref: '#/components/schemas/Used'}
        aiRecsToday: {$ref: '#/components/schemas/Used'}
        mappingDraftsToday: {$ref: '#/components/schemas/Used'}
        sessions: {$ref: '#/components/schemas/Used'}
        resetsAt: {type: string, format: date-time}

    # —— auth / me ——
    SendCodeRequest:
      type: object
      required: [email, purpose, turnstileToken]
      properties:
        email: {type: string, format: email, maxLength: 254}
        purpose: {type: string, enum: [signup, login]}
        turnstileToken: {type: string, maxLength: 4096}
        locale: {$ref: '#/components/schemas/Locale'}
    CreateSessionRequest:
      type: object
      required: [email, code, purpose]
      properties:
        email: {type: string, format: email, maxLength: 254}
        code: {type: string, pattern: '^\d{6}$'}
        purpose: {type: string, enum: [signup, login]}
    WebAuthnJson:
      type: object
      additionalProperties: true
      description: PublicKeyCredential*OptionsJSON / *ResponseJSON
    PasskeyOptionsRequest:
      type: object
      required: [purpose]
      properties:
        purpose: {type: string, enum: [login, step_up]}
        preAuth: {type: string}
    PasskeyAssertionRequest:
      type: object
      required: [purpose, credential]
      properties:
        purpose: {type: string, enum: [login, step_up]}
        preAuth: {type: string}
        credential: {$ref: '#/components/schemas/WebAuthnJson'}
    PasskeySetupOptionsRequest:
      type: object
      required: [preAuth, setupCode]
      properties:
        preAuth: {type: string}
        setupCode: {type: string, minLength: 8, maxLength: 128}
    PasskeySetupRequest:
      allOf:
        - {$ref: '#/components/schemas/PasskeySetupOptionsRequest'}
        - type: object
          required: [credential]
          properties:
            credential: {$ref: '#/components/schemas/WebAuthnJson'}
    RecoveryRequest:
      type: object
      required: [preAuth, recoveryCode]
      properties:
        preAuth: {type: string}
        recoveryCode: {type: string, minLength: 8, maxLength: 64}
    TokenGrant:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: {type: string}
        expiresIn: {type: integer, description: Seconds (900)}
    Session:
      allOf:
        - {$ref: '#/components/schemas/TokenGrant'}
        - type: object
          required: [me]
          properties:
            me: {$ref: '#/components/schemas/Me'}
    PasskeyRequired:
      type: object
      required: [passkeyRequired, preAuth, setupRequired]
      properties:
        passkeyRequired: {type: boolean, const: true}
        preAuth: {type: string, description: 5-minute pre-authentication token}
        setupRequired: {type: boolean}
    StepUpToken:
      type: object
      required: [stepUpToken, expiresIn]
      properties:
        stepUpToken: {type: string}
        expiresIn: {type: integer}
    Passkey:
      type: object
      required: [id, label, createdAt, lastUsedAt]
      properties:
        id: {type: string}
        label: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: [string, 'null'], format: date-time}
    PasskeyRegistered:
      type: object
      required: [passkey, total]
      properties:
        passkey: {$ref: '#/components/schemas/Passkey'}
        total: {type: integer}
        recoveryCodes:
          type: array
          description: Shown exactly once, when the second passkey is bound
          items: {type: string}
    PasskeySetupResult:
      allOf:
        - {$ref: '#/components/schemas/PasskeyRegistered'}
        - {$ref: '#/components/schemas/Session'}
    Workspace:
      type: object
      required: [tenantId, kind, status, verifiedAt, trialExpiresAt, expiredAt]
      properties:
        tenantId: {$ref: '#/components/schemas/Ulid'}
        kind: {type: string, enum: [trial, admin]}
        status: {type: string, enum: [ACTIVE, EXPIRED, ARCHIVING]}
        verifiedAt: {type: string, format: date-time}
        trialExpiresAt: {type: [string, 'null'], format: date-time}
        expiredAt: {type: [string, 'null'], format: date-time}
    Me:
      type: object
      required: [userId, email, role, locale, timeZone, workspace, sessions]
      properties:
        userId: {$ref: '#/components/schemas/Ulid'}
        email: {type: string, format: email}
        role: {type: string, enum: [owner, admin]}
        locale: {$ref: '#/components/schemas/Locale'}
        timeZone: {type: string}
        workspace: {$ref: '#/components/schemas/Workspace'}
        sessions: {$ref: '#/components/schemas/Used'}
        passkeys: {type: integer, description: Admin only}
        recoveryCodesLeft: {type: integer, description: Admin only}
        sessionExpiresAt: {type: string, format: date-time, description: When the current session expires (admin ≤ 8 h)}
        recoveryPending: {type: boolean, description: Admin only; signed in with a recovery code and must bind a new passkey first}
    MeWithQuotas:
      allOf:
        - {$ref: '#/components/schemas/Me'}
        - type: object
          required: [quotas]
          properties:
            quotas: {$ref: '#/components/schemas/Quotas'}
    PatchMeRequest:
      type: object
      properties:
        locale: {$ref: '#/components/schemas/Locale'}
        timeZone: {type: string, maxLength: 64}
    ExportRecord:
      type: object
      required: [file, data]
      properties:
        file:
          type: string
          description: Archive file the record belongs to (e.g. objects.jsonl)
        data: {description: A JSON Lines record or a whole JSON document}
    ArchiveDeletionInfo:
      type: object
      required: [expiresAt, sizeBytes]
      properties:
        expiresAt: {type: string, format: date-time}
        sizeBytes: {type: integer}

    # —— ontology ——
    PropertyDef:
      type: object
      required: [apiName, displayName, dataType]
      properties:
        apiName: {$ref: '#/components/schemas/ApiName'}
        displayName: {$ref: '#/components/schemas/I18nText'}
        dataType: {type: string, description: 'string|integer|double|boolean|date|timestamp|geopoint|enum|objectRef:<Type>'}
        required: {type: boolean}
        unit: {type: string}
        indexed: {type: boolean}
        semanticTags: {type: array, items: {type: string}}
        sensitive: {type: boolean}
        enumValues: {type: array, items: {type: string}}
        description: {$ref: '#/components/schemas/I18nText'}
    ObjectTypeDef:
      type: object
      required: [apiName, displayName, primaryKey, titleProperty, properties]
      properties:
        apiName: {$ref: '#/components/schemas/ApiName'}
        displayName: {$ref: '#/components/schemas/I18nText'}
        icon: {type: string}
        primaryKey: {type: string}
        titleProperty: {type: string}
        properties: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PropertyDef'}}
        description: {$ref: '#/components/schemas/I18nText'}
    LinkTypeDef:
      type: object
      required: [apiName, displayName, from, to, cardinality]
      properties:
        apiName: {$ref: '#/components/schemas/ApiName'}
        displayName: {$ref: '#/components/schemas/I18nText'}
        from: {type: string}
        to: {type: string}
        cardinality: {type: string, enum: [one, many]}
        propagation:
          type: object
          required: [defaultWeight]
          properties:
            defaultWeight: {type: number, minimum: 0, maximum: 1}
    ActionTypeDef:
      type: object
      required: [apiName, displayName, targetType, parameters, preconditions, effects]
      properties:
        apiName: {$ref: '#/components/schemas/ApiName'}
        displayName: {$ref: '#/components/schemas/I18nText'}
        targetType: {type: string}
        parameters: {type: array, items: {type: object, additionalProperties: true}}
        preconditions:
          type: array
          items:
            type: object
            required: [expr, message]
            properties:
              expr: {description: JSONLogic (safe subset)}
              message: {$ref: '#/components/schemas/I18nText'}
        effects:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: {type: string, enum: [set, increment, relink, unlink]}
            additionalProperties: true
        impact:
          type: array
          items:
            type: object
            required: [property, change]
            properties:
              property: {type: string}
              change: {type: number, minimum: -1, maximum: 1}
        description: {$ref: '#/components/schemas/I18nText'}
    Ontology:
      type: object
      required: [templateId, templateVersion, custom, etag, definition, updatedAt]
      properties:
        templateId: {type: string}
        templateVersion: {type: string}
        custom: {type: boolean}
        etag: {type: integer}
        definition:
          type: object
          required: [objectTypes, linkTypes, actionTypes, functions, simulationKpis]
          properties:
            objectTypes: {type: array, items: {$ref: '#/components/schemas/ObjectTypeDef'}}
            linkTypes: {type: array, items: {$ref: '#/components/schemas/LinkTypeDef'}}
            actionTypes: {type: array, items: {$ref: '#/components/schemas/ActionTypeDef'}}
            functions: {type: array, items: {type: object, additionalProperties: true}}
            simulationKpis: {type: array, items: {type: object, additionalProperties: true}}
        updatedAt: {type: [string, 'null'], format: date-time}
    DefinitionList:
      type: object
      required: [items, etag, custom]
      properties:
        items:
          type: array
          items:
            oneOf:
              - {$ref: '#/components/schemas/ObjectTypeDef'}
              - {$ref: '#/components/schemas/LinkTypeDef'}
              - {$ref: '#/components/schemas/ActionTypeDef'}
        etag: {type: integer}
        custom: {type: boolean}
    DefinitionResult:
      type: object
      required: [item, etag]
      properties:
        item:
          oneOf:
            - {$ref: '#/components/schemas/ObjectTypeDef'}
            - {$ref: '#/components/schemas/LinkTypeDef'}
            - {$ref: '#/components/schemas/ActionTypeDef'}
        etag: {type: integer}

    # —— data ——
    MappingSpec:
      type: object
      required: [targetType, primaryKey, fields]
      properties:
        targetType: {$ref: '#/components/schemas/ApiName'}
        primaryKey:
          type: object
          required: [from]
          properties:
            from: {type: string}
            transform: {type: string, maxLength: 200}
        fields:
          type: array
          maxItems: 100
          items:
            type: object
            required: [to, from]
            properties:
              to: {$ref: '#/components/schemas/ApiName'}
              from: {type: string}
              transform: {type: string, maxLength: 200}
              matchedBy: {type: string, enum: [exact, synonym, similarity, ai, manual]}
        links:
          type: array
          maxItems: 10
          items:
            type: object
            required: [type, toType, toKey]
            properties:
              type: {$ref: '#/components/schemas/ApiName'}
              toType: {$ref: '#/components/schemas/ApiName'}
              toKey: {type: string}
              split: {type: string, maxLength: 4}
              weightFrom: {type: string}
    MappingDraft:
      allOf:
        - {$ref: '#/components/schemas/MappingSpec'}
        - type: object
          required: [rankedBy, unmatched]
          properties:
            rankedBy: {type: string, enum: [ai, rules]}
            unmatched: {type: array, items: {type: string}}
    CreateImportRequest:
      type: object
      required: [fileName, targetType, totalRows]
      properties:
        fileName: {type: string, maxLength: 200}
        targetType: {$ref: '#/components/schemas/ApiName'}
        totalRows: {type: integer, minimum: 1, maximum: 2000}
        mapping: {$ref: '#/components/schemas/MappingSpec'}
    BatchRequest:
      type: object
      required: [seq, last, rows]
      properties:
        seq: {type: integer, minimum: 0, maximum: 10000}
        last: {type: boolean}
        rows: {type: array, maxItems: 100, items: {type: object, additionalProperties: true}}
    MappingDraftRequest:
      type: object
      required: [fields, sampleRows, targetType]
      properties:
        fields: {type: array, minItems: 1, maxItems: 100, items: {type: string, maxLength: 200}}
        sampleRows: {type: array, maxItems: 20, items: {type: array, items: {}}}
        targetType: {$ref: '#/components/schemas/ApiName'}
    Reject:
      type: object
      required: [row, code]
      properties:
        row: {type: integer}
        code: {type: string}
        column: {type: string}
        detail: {type: string}
    Job:
      type: object
      required: [id, kind, fileName, targetType, mapping, status, totalRows, received, upserted, skipped, rejected, createdAt, updatedAt]
      properties:
        id: {type: string}
        kind: {type: string, enum: [file, sample]}
        fileName: {type: [string, 'null']}
        targetType: {type: string}
        mapping:
          oneOf:
            - {$ref: '#/components/schemas/MappingSpec'}
            - {type: 'null'}
        status: {type: string, enum: [RECEIVING, DONE, FAILED]}
        totalRows: {type: integer}
        received: {type: integer}
        upserted: {type: integer}
        skipped: {type: integer}
        rejected: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        rejects: {type: array, items: {$ref: '#/components/schemas/Reject'}}
    JobPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Job'}}
        nextCursor: {type: [string, 'null']}
    BatchResult:
      type: object
      required: [seq, upserted, skipped, rejected, job]
      properties:
        seq: {type: integer}
        upserted: {type: integer}
        skipped: {type: integer}
        rejected: {type: array, items: {$ref: '#/components/schemas/Reject'}}
        job: {type: object, additionalProperties: true}

    # —— objects ——
    FilterExpr:
      type: object
      required: [op]
      description: and/or/not/eq/neq/gt/gte/lt/lte/in/contains/exists over object properties
      properties:
        op: {type: string, enum: [and, or, not, eq, neq, gt, gte, lt, lte, in, contains, exists]}
        args: {type: array, items: {$ref: '#/components/schemas/FilterExpr'}}
        arg: {$ref: '#/components/schemas/FilterExpr'}
        prop: {type: string}
        value: {type: [string, number, boolean]}
        values: {type: array, items: {type: [string, number, boolean]}}
    Provenance:
      type: object
      required: [jobId, row, at]
      properties:
        jobId: {type: string}
        row: {type: integer}
        at: {type: integer, description: Unix ms}
    Object:
      type: object
      required: [rid, type, primaryKey, title, props, provenance, version, updatedAt]
      properties:
        rid: {$ref: '#/components/schemas/Rid'}
        type: {type: string}
        primaryKey: {type: string}
        title: {type: string}
        props: {type: object, additionalProperties: true}
        provenance: {type: object, additionalProperties: {$ref: '#/components/schemas/Provenance'}}
        version: {type: integer}
        updatedAt: {type: string, format: date-time}
        invalidProps: {type: array, items: {type: string}}
        derived:
          type: object
          additionalProperties: true
          description: Values of the ontology's declarative functions bound to this object type, keyed by function apiName (null when a function fails)
        links:
          $ref: '#/components/schemas/GraphSlice'
          description: Only with `expand=links`
    ObjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Object'}}
        nextCursor: {type: [string, 'null']}
    GraphStats:
      type: object
      required: [objects, links, byType]
      properties:
        objects: {type: integer}
        links: {type: integer}
        byType: {type: object, additionalProperties: {type: integer}}
    GraphSlice:
      type: object
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [rid, type, title, props, hop]
            properties:
              rid: {$ref: '#/components/schemas/Rid'}
              type: {type: string}
              title: {type: string}
              props: {type: object, additionalProperties: true}
              hop: {type: integer}
        edges:
          type: array
          items:
            type: object
            required: [type, src, dst, weight]
            properties:
              type: {type: string}
              src: {$ref: '#/components/schemas/Rid'}
              dst: {$ref: '#/components/schemas/Rid'}
              weight: {type: [number, 'null']}
        truncated: {type: boolean}
    ExecuteActionRequest:
      type: object
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/Rid'}
        params: {type: object, additionalProperties: true}
        recommendationId: {type: string}
    ActionResult:
      type: object
      required: [actionLogId, actionType, rid, version, before, after, executedAt, replayed]
      properties:
        actionLogId: {type: string}
        actionType: {type: string}
        rid: {$ref: '#/components/schemas/Rid'}
        version: {type: integer}
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        executedAt: {type: string, format: date-time}
        replayed: {type: boolean}
    ActionLog:
      type: object
      required: [id, actionType, targetRid, params, before, after, actor, executedAt]
      properties:
        id: {type: string}
        actionType: {type: string}
        targetRid: {$ref: '#/components/schemas/Rid'}
        params: {type: object, additionalProperties: true}
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        actor: {type: string, description: 'owner, admin or svc:decision-engine'}
        actorUserId: {type: string}
        recommendationId: {type: string}
        executedAt: {type: string, format: date-time}
    ActionLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ActionLog'}}
        nextCursor: {type: [string, 'null']}

    # —— situation ——
    Severity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    AutomationDef:
      type: object
      required: [name, trigger, objectType, condition, severity]
      properties:
        name: {$ref: '#/components/schemas/I18nText'}
        trigger: {type: string, enum: [threshold, schedule]}
        objectType: {$ref: '#/components/schemas/ApiName'}
        condition: {$ref: '#/components/schemas/FilterExpr'}
        everyHours: {type: integer, minimum: 1, maximum: 24}
        severity: {$ref: '#/components/schemas/Severity'}
        cooldownSec: {type: integer, minimum: 0, maximum: 86400, default: 3600}
        enabled: {type: boolean, default: true}
    Automation:
      allOf:
        - {$ref: '#/components/schemas/AutomationDef'}
        - type: object
          required: [id, version, nextRunAt, lastFiredAt]
          properties:
            id: {type: string}
            version: {type: integer}
            nextRunAt: {type: [string, 'null'], format: date-time}
            lastFiredAt: {type: [string, 'null'], format: date-time}
    Alert:
      type: object
      required: [id, automationId, automationName, rid, title, severity, status, snapshot, hits, raisedAt, ackedAt, closedAt]
      properties:
        id: {type: string}
        automationId: {type: string}
        automationName: {$ref: '#/components/schemas/I18nText'}
        rid: {type: [string, 'null']}
        title: {type: string}
        severity: {$ref: '#/components/schemas/Severity'}
        status: {type: string, enum: [OPEN, ACKED, CLOSED]}
        snapshot: {type: object, additionalProperties: true}
        hits: {type: integer}
        raisedAt: {type: string, format: date-time}
        ackedAt: {type: [string, 'null'], format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
    AlertPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        nextCursor: {type: [string, 'null']}
    Kpi:
      type: object
      required: [id, name, objectType, aggregate, value, previous, target, unit, higherIsBetter, updatedAt]
      properties:
        id: {type: string}
        name: {$ref: '#/components/schemas/I18nText'}
        objectType: {type: string}
        aggregate: {type: object, additionalProperties: true}
        value: {type: [number, 'null']}
        previous: {type: [number, 'null']}
        target: {type: [number, 'null']}
        unit: {type: [string, 'null']}
        higherIsBetter: {type: boolean}
        updatedAt: {type: [string, 'null'], format: date-time}
    ImpactedObject:
      type: object
      required: [rid, type, title, delta, hop]
      properties:
        rid: {$ref: '#/components/schemas/Rid'}
        type: {type: string}
        title: {type: string}
        delta: {type: number}
        hop: {type: integer}
    CockpitOverview:
      type: object
      required: [kpis, trends, alerts, impacted, initialized, generatedAt, pendingRecommendations, quotas]
      properties:
        kpis: {type: array, items: {$ref: '#/components/schemas/Kpi'}}
        trends:
          type: array
          items:
            type: object
            required: [kpiId, points]
            properties:
              kpiId: {type: string}
              points:
                type: array
                items:
                  type: object
                  required: [ts, value]
                  properties:
                    ts: {type: string, format: date-time}
                    value: {type: number}
        alerts: {type: array, items: {$ref: '#/components/schemas/Alert'}}
        impacted: {type: array, items: {$ref: '#/components/schemas/ImpactedObject'}}
        initialized: {type: boolean}
        generatedAt: {type: string, format: date-time}
        pendingRecommendations:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/Recommendation'}
        quotas: {$ref: '#/components/schemas/Quotas'}
    StreamTicket:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket: {type: string, description: '`{tid}.{random}`, single use'}
        expiresIn: {type: integer, const: 30}
    WsMsg:
      type: object
      required: [seq, type, data, occurredAt]
      properties:
        seq: {type: integer}
        type: {type: string, enum: [snapshot, kpi, alert, recommendation, trial]}
        data: {}
        occurredAt: {type: string, format: date-time}
    WsResume:
      type: object
      required: [type, lastSeq]
      properties:
        type: {type: string, const: resume}
        lastSeq: {type: integer}

    # —— decision ——
    RecStatus: {type: string, enum: [Proposed, Confirmed, Rejected, Expired, Executed, ExecFailed]}
    Perturbation:
      type: object
      required: [rid, property, change]
      properties:
        rid: {$ref: '#/components/schemas/Rid'}
        property: {type: string}
        change: {type: number, minimum: -1, maximum: 1}
    Candidate:
      type: object
      required: [id, actionType, displayName, target, targetTitle, params, expectedImpact, affectedCount]
      properties:
        id: {type: string}
        actionType: {type: string}
        displayName: {$ref: '#/components/schemas/I18nText'}
        target: {$ref: '#/components/schemas/Rid'}
        targetTitle: {type: string}
        params: {type: object, additionalProperties: true}
        expectedImpact: {type: number}
        affectedCount: {type: integer}
    ScenarioResult:
      type: object
      required: [baseline, scenario, affected, riskLevel, kpis, nodeCount, computedAt]
      properties:
        baseline: {type: object, additionalProperties: {type: number}}
        scenario: {type: object, additionalProperties: {type: number}}
        withActions:
          type: object
          additionalProperties: {type: object, additionalProperties: {type: number}}
        affected: {type: array, items: {$ref: '#/components/schemas/ImpactedObject'}}
        riskLevel: {type: string, enum: [LOW, MEDIUM, HIGH]}
        kpis: {type: array, items: {type: object, additionalProperties: true}}
        nodeCount: {type: integer}
        computedAt: {type: string, format: date-time}
    ScenarioInput:
      type: object
      required: [perturbations]
      properties:
        name: {type: string, maxLength: 120}
        perturbations: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/Perturbation'}}
        candidateActions:
          type: array
          maxItems: 10
          items:
            type: object
            required: [actionType, target]
            properties:
              actionType: {type: string}
              target: {$ref: '#/components/schemas/Rid'}
              params: {type: object, additionalProperties: true}
    Scenario:
      type: object
      required: [id, name, perturbations, candidates, result, createdAt]
      properties:
        id: {type: string}
        name: {type: string}
        perturbations: {type: array, items: {$ref: '#/components/schemas/Perturbation'}}
        candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
        result: {$ref: '#/components/schemas/ScenarioResult'}
        createdAt: {type: string, format: date-time}
    Recommendation:
      type: object
      required: [id, status, focus, summary, rationale, candidates, ranking, evidence, risks, confidence, rankedBy, locale, createdAt, expiresAt, version]
      properties:
        id: {type: string}
        status: {$ref: '#/components/schemas/RecStatus'}
        focus: {$ref: '#/components/schemas/Rid'}
        alertId: {type: string}
        scenarioId: {type: string}
        summary: {type: string}
        rationale: {type: string}
        candidates: {type: array, items: {$ref: '#/components/schemas/Candidate'}}
        ranking: {type: array, items: {type: string}}
        evidence:
          type: array
          items:
            type: object
            required: [rid, prop, value]
            properties:
              rid: {$ref: '#/components/schemas/Rid'}
              prop: {type: string}
              value: {}
              provenance: {$ref: '#/components/schemas/Provenance'}
        risks: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 1}
        rankedBy: {type: string, enum: [ai, rules]}
        model: {type: string}
        simulation: {$ref: '#/components/schemas/ScenarioResult'}
        decidedBy: {type: string, enum: [owner, admin]}
        decidedAt: {type: string, format: date-time}
        rejectReason: {type: string}
        execution:
          type: array
          items:
            type: object
            required: [candidateId, status]
            properties:
              candidateId: {type: string}
              status: {type: string, enum: [Executed, Failed]}
              actionLogId: {type: string}
              error: {type: string}
        locale: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        version: {type: integer}
    RecommendationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}
        nextCursor: {type: [string, 'null']}
    GenerateRequest:
      type: object
      required: [focus]
      properties:
        focus: {$ref: '#/components/schemas/Rid'}
        alertId: {type: string}
        scenarioId: {type: string}
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [confirm, reject]}
        reason: {type: string, maxLength: 500, description: Required to reject}

    # —— admin ——
    PlatformOverview:
      type: object
      required: [activeTrials, signupsToday, archives, purgeBacklog, signup, freeQuota, analyticsAt, recentActions, analyticsConfigured, stuckArchives, signKeyRotationDue]
      properties:
        analyticsConfigured:
          type: boolean
          description: False when CF_ANALYTICS_TOKEN / CF_ACCOUNT_ID are not set (the 80% check is off).
        stuckArchives:
          type: integer
          minimum: 0
          description: Workspaces whose archive step has failed for more than 24 hours.
        signKeyRotationDue:
          type: boolean
          description: The active B2 signing key is older than 30 days.
        activeTrials: {$ref: '#/components/schemas/Used'}
        signupsToday: {$ref: '#/components/schemas/Used'}
        archives: {$ref: '#/components/schemas/Used'}
        purgeBacklog: {$ref: '#/components/schemas/Used'}
        signup:
          type: object
          required: [state]
          properties:
            state: {type: string, enum: [open, paused, auto_closed]}
        freeQuota:
          type: array
          items:
            type: object
            required: [key, used, limit]
            properties:
              key: {type: string, enum: [workers, d1Writes, neurons, queues, emailResend, emailBrevo]}
              used: {type: number}
              limit: {type: number}
        analyticsAt: {type: [string, 'null'], format: date-time}
        recentActions:
          type: array
          items:
            type: object
            required: [at, action, target, kind]
            properties:
              at: {type: string, format: date-time}
              action: {type: string}
              target: {type: [string, 'null']}
              kind: {type: string, enum: [modify, delete, enter, view]}
    AdminUserRow:
      type: object
      required: [userId, tenantId, email, status, trialExpiresAt, zipExpiresAt, sessions, banned, objects, links]
      properties:
        userId: {type: [string, 'null']}
        tenantId: {$ref: '#/components/schemas/Ulid'}
        email: {type: [string, 'null']}
        status: {type: string, enum: [ACTIVE, EXPIRED, ARCHIVING, ARCHIVE_ONLY]}
        trialExpiresAt: {type: [string, 'null'], format: date-time}
        zipExpiresAt: {type: [string, 'null'], format: date-time}
        sessions: {type: integer}
        banned: {type: boolean}
        objects: {type: integer, description: Objects held by the workspace (0 once purged)}
        links: {type: integer, description: Links held by the workspace (0 once purged)}
    AdminUser:
      allOf:
        - {$ref: '#/components/schemas/AdminUserRow'}
        - type: object
          required: [locale, timeZone, verifiedAt, expiredAt, archivePhase]
          properties:
            locale: {$ref: '#/components/schemas/Locale'}
            timeZone: {type: string}
            verifiedAt: {type: string, format: date-time}
            expiredAt: {type: [string, 'null'], format: date-time}
            archivePhase: {type: [string, 'null']}
    AdminUserPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminUserRow'}}
        nextCursor: {type: [string, 'null']}
    AdminUserPatch:
      type: object
      required: [reason]
      properties:
        trialExpiresAt: {type: string, format: date-time}
        status: {type: string, enum: [EXPIRED]}
        banned: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    ArchiveIndex:
      type: object
      required: [tenantId, sizeBytes, sha256, createdAt, expiresAt]
      properties:
        tenantId: {$ref: '#/components/schemas/Ulid'}
        sizeBytes: {type: integer}
        sha256: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    ArchivePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ArchiveIndex'}}
        nextCursor: {type: [string, 'null']}
    PlatformSettings:
      type: object
      required: [signupEnabled, signupDailyLimit, activeWorkspaceLimit, trialHours, archiveDays, version]
      properties:
        signupEnabled: {type: boolean}
        signupDailyLimit: {type: integer, minimum: 0, maximum: 20}
        activeWorkspaceLimit: {type: integer, minimum: 0, maximum: 60}
        trialHours: {type: integer, readOnly: true}
        archiveDays: {type: integer, readOnly: true}
        version: {type: integer}
    SettingsPatch:
      type: object
      properties:
        signupEnabled: {type: boolean}
        signupDailyLimit: {type: integer, minimum: 0, maximum: 20}
        activeWorkspaceLimit: {type: integer, minimum: 0, maximum: 60}
    BlockedDomains:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          maxItems: 5000
          items: {type: string, pattern: '^[a-z0-9.-]+\.[a-z]{2,}$'}
    AuditRow:
      type: object
      required: [id, at, action, targetTenantId, targetUserId, reason]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        action: {type: string}
        targetTenantId: {type: [string, 'null']}
        targetUserId: {type: [string, 'null']}
        reason: {type: [string, 'null']}
    AuditPage:
      type: object
      required: [items, nextCursor, chainOk]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditRow'}}
        nextCursor: {type: [string, 'null']}
        chainOk: {type: boolean}
