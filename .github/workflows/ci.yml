# CI: typecheck, lint (gts + architecture guard), unit/integration tests,
# web build with bundle budget, Worker dry-run bundles. Runs on every PR and
# push to main; Deploy starts from a green run on main. Terraform checks live
# in terraform.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # pnpm is installed by corepack in the next step, so setup-node
          # must not try to cache it before it exists.
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build web
        run: pnpm build:web
      - name: Bundle budget (initial JS ≤ 250 KB gzip)
        run: node scripts/check_bundle.mjs apps/web/dist 250
      - name: Worker bundles (dry-run)
        run: |
          node scripts/gen_wrangler.mjs --env local
          for w in ontology-manager data-integration object-graph situation-awareness decision-engine identity-access api-gateway; do
            npx wrangler deploy --dry-run --outdir "dist/$w" -c "apps/$w/wrangler.jsonc"
          done
