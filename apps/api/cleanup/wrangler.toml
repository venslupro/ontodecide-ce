# Cleanup Service Worker — daily retention enforcement + manual purge.
#
# Exports:
#   * `fetch`     — admin endpoints (POST /cleanup, GET /cleanup/status/:id)
#   * `scheduled` — cron trigger at 03:00 UTC (see [triggers] below; the
#                   production source-of-truth for cron is Terraform:
#                   cloudflare_worker_cron_trigger.cleanup — keep BOTH in sync).
#   * `queue`     — consumer for cleanup-queue (one tenant per message)
#
# Deployed via Cloudflare Workers Builds (Git-connected).
#
# Ownership split (keep in sync with infrastructure/terraform/workers.tf):
#   HERE: code, [vars] (Neo4j URL/user, B2 region & both bucket names),
#         worker secrets (B2_KEY_ID/B2_KEY, NEO4J_PASSWORD, JWT_SECRET),
#         queue consumer configuration, KV IDs filled from terraform.
#   THERE (terraform): D1 decision-db, queue/DLQ, 5 KV cache namespaces,
#         B2 dual-bucket creation, cron triggers, worker script names.

name = "decision-cleanup-service"
# NOTE: entry point is intentionally the TYPESCRIPT source file.
# Wrangler bundles via its internal esbuild; the tsc-based
# `turbo run build` step only typechecks and builds shared/dist.
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block (Workers Builds ignores Custom Builds;
# authoritative build command lives in Dash + .cloudflare/workers-builds.yaml).
[build]
command = "pnpm --filter=@ontodecide/cleanup exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/cleanup"
# Note: Upload format/dir/main are inferred from top `main = "src/index.ts"`
# automatically in wrangler >= 3.100.  Do NOT re-declare `[build.upload]`
# + `main` — defining both is a fatal error.

# Daily cleanup at 03:00 UTC. Terraform also owns the equivalent
# cloudflare_worker_cron_trigger.cleanup resource — keep both in sync.
[triggers]
crons = ["0 3 * * *"]

# Queue: one message per tenant to be cleaned + DLQ for poison events.
# Queue names MUST equal the terraform output: queues.cleanup / queues.cleanup_dlq
# which default to `${project}-cleanup-${env}` with env=production.
# NOTE: Use dotted form `[[queues.producers]]` / `[[queues.consumers]]` —
# underscored `queues_producers` / `queues_consumers` is deprecated and
# triggers wrangler >= 3.91 "Unexpected fields found in top-level field"
# warnings (bindings may be silently dropped).
[[queues.producers]]
binding = "CLEANUP_QUEUE"
queue   = "ontodecide-cleanup-production"   # Terraform output: queues.cleanup

[[queues.consumers]]
queue             = "ontodecide-cleanup-production"       # Terraform output: queues.cleanup
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "ontodecide-cleanup-dlq-production"   # Terraform output: queues.cleanup_dlq

# D1: shared decision-db; cleanup worker hard-deletes rows ONLY after
# the tenant archive write to the B2 tenant-archive bucket returns 200.
[[d1_databases]]
binding        = "DB"
database_name  = "ontodecide-decision-db-production"  # Terraform: cloudflare_d1_database.decision_db.name
database_id    = "REPLACE_WITH_D1_ID"                 # Terraform output key: d1_database_id

# KV namespaces: caches + job-status stores that Cleanup touches.
# Every REPLACE_WITH_KV_ID maps to the listed terraform output key.
[[kv_namespaces]]
binding = "USER_CACHE"
id = "REPLACE_WITH_KV_ID"   # Terraform output key: kv_namespaces["user-cache"]

[[kv_namespaces]]
binding = "GRAPH_CACHE"
id = "REPLACE_WITH_KV_ID"   # Terraform output key: kv_namespaces["graph-cache"]

[[kv_namespaces]]
binding = "INGESTION_JOBS"
id = "REPLACE_WITH_KV_ID"   # Terraform output key: kv_namespaces["ingestion-jobs"]

[[kv_namespaces]]
binding = "AI_CACHE"
id = "REPLACE_WITH_KV_ID"   # Terraform output key: kv_namespaces["ai-cache"]

[[kv_namespaces]]
binding = "CLEANUP_JOBS"
id = "REPLACE_WITH_KV_ID"   # Terraform output key: kv_namespaces["cleanup-jobs"]

[vars]
# Neo4j AuraDB cluster — DROP DATABASE hits its /db/system endpoint.
NEO4J_URL  = "https://REPLACE_WITH_AURADB_HOST.databases.neo4j.io"
NEO4J_USER = "neo4j"

# Backblaze B2 S3-compatible: region plus the two bucket names.
# Defaults match Terraform outputs (project=ontodecide, env=production):
#   terraform output b2_region
#   terraform output b2_buckets.ingestion_staging
#   terraform output b2_buckets.tenant_archive
B2_REGION           = "us-west-004"
B2_INGESTION_BUCKET = "ontodecide-ingestion-staging-production"
B2_ARCHIVE_BUCKET   = "ontodecide-tenant-archive-production"

# Secrets (Dashboard → Secrets / `wrangler secret put`):
#   JWT_SECRET       — shared HMAC signing secret.
#   NEO4J_PASSWORD   — Password for NEO4J_USER; cluster /db/system role
#                      MUST have the "Create database" / "Drop database"
#                      privileges for per-tenant logical DBs.
#   B2_KEY_ID        — B2 Application Key keyID with R/W on BOTH the
#                      ingestion staging + tenant archive buckets.
#   B2_KEY           — B2 Application Key secret paired with B2_KEY_ID.
