# Continuous Deployment (CD) — Worker Services + Frontend Pages
#
# Code + configuration deploys here. Long-lived resources (D1 / KV / Queues)
# live in infrastructure/terraform via terraform.yml — run Terraform apply
# BEFORE service deploys the first time so resolve-d1-ids.sh / resolve-kv-ids.sh
# can look up the real resource IDs from the Cloudflare API.
#
# Workers Scripts, Cron triggers, Service Bindings, Observability settings,
# and the Cloudflare Pages Project (apps/web) are ALL created automatically
# by `wrangler deploy` / `wrangler pages deploy` on first run (upsert / PUT
# semantics) — no Terraform sentinel or pre-creation required.
#
# TRIGGERS:
#   • push (any branch): detect-changes always; deploy all services on main.
#   • workflow_dispatch: same as push; D1 migration still requires approval.
#
# DEPENDENCY ORDER (4-layer):
#   L1 (parallel) → user · graph · ai · cleanup · web (Pages)
#   L2            → ingestion (needs: graph)
#   L3            → gateway   (needs: L1 + L2)
#   L4 (approval) → migrate-d1 (needs: L3 + web; main-only; environment review)

name: Deploy · Services

on:
  push: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# GitHub Actions runner Node runtime (20 deprecated 2025-09; default 24).
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true opts Node 20 actions into Node 24
# and suppresses the deprecation banner.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      user:      ${{ steps.filter.outputs.user }}
      graph:     ${{ steps.filter.outputs.graph }}
      ai:        ${{ steps.filter.outputs.ai }}
      cleanup:   ${{ steps.filter.outputs.cleanup }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      gateway:   ${{ steps.filter.outputs.gateway }}
      web:       ${{ steps.filter.outputs.web }}
      any:       ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      # NOTE: paths are inlined per filter — YAML anchors would inject
      # nested lists inside the | block scalar, causing silent mismatch.
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: 'none'
          filters: |
            user:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/user/**'
            graph:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/graph/**'
            ai:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/ai/**'
            cleanup:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/cleanup/**'
            ingestion:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/ingestion/**'
            gateway:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/gateway/**'
            web:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/web/**'
            any:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/user/**'
              - 'apps/api/graph/**'
              - 'apps/api/ai/**'
              - 'apps/api/cleanup/**'
              - 'apps/api/ingestion/**'
              - 'apps/api/gateway/**'
              - 'apps/web/**'

      - name: Summary
        run: |
          echo "Changed:"
          echo "  user      = ${{ steps.filter.outputs.user }}"
          echo "  graph     = ${{ steps.filter.outputs.graph }}"
          echo "  ai        = ${{ steps.filter.outputs.ai }}"
          echo "  cleanup   = ${{ steps.filter.outputs.cleanup }}"
          echo "  ingestion = ${{ steps.filter.outputs.ingestion }}"
          echo "  gateway   = ${{ steps.filter.outputs.gateway }}"
          echo "  web       = ${{ steps.filter.outputs.web }}"

  # ── LAYER 1 — Independent services (parallel) ──────────────────────
  # Leaves: user · graph · ai · cleanup · **web (Pages)**

  deploy-user:
    name: Deploy · user
    needs: detect-changes
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/user
      - name: Resolve D1 database IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-d1-ids.sh apps/api/user
      - name: Deploy user worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/user
          secrets: |
            JWT_SECRET
            EMAIL_API_KEY
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}

  deploy-graph:
    name: Deploy · graph
    needs: detect-changes
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/graph
      - name: Deploy graph worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/graph
          secrets: |
            NEO4J_PASSWORD
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

  deploy-ai:
    name: Deploy · ai
    needs: detect-changes
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve D1 database IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-d1-ids.sh apps/api/ai
      - name: Deploy ai worker
        # GOOGLE_API_KEY / GROQ_API_KEY are optional — configured directly
        # on Cloudflare Dashboard Secrets so deploys never overwrite them.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/ai

  deploy-cleanup:
    name: Deploy · cleanup
    needs: detect-changes
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/cleanup
      - name: Resolve D1 database IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-d1-ids.sh apps/api/cleanup
      - name: Deploy cleanup worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/cleanup
          secrets: |
            NEO4J_PASSWORD
            B2_KEY_ID
            B2_KEY
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}

  # web — L1, Cloudflare Pages SPA (parallel with leaves)
  deploy-web:
    name: Deploy · web
    needs: detect-changes
    environment:
      name: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Resolve the Gateway worker's public workers.dev URL so the SPA
      # knows where to send API requests at runtime.
      - name: Resolve Gateway URL
        id: gateway-url
        env:
          CF_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME:   ${{ github.event.repository.name }}
        run: |
          SUBDOMAIN=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CF_API_TOKEN" | jq -r '.result.subdomain')
          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "::error::Could not resolve workers.dev subdomain"
            exit 1
          fi
          ENV_SHORT="prd"
          GATEWAY_URL="https://${PROJECT_NAME}-${ENV_SHORT}-gateway.${SUBDOMAIN}.workers.dev"
          echo "url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Gateway URL: $GATEWAY_URL"
      - run: pnpm --filter @ontodecide/web build
        env:
          VITE_API_BASE: ${{ steps.gateway-url.outputs.url }}
      # wrangler pages CLI reads CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # (not the CF_* aliases used by wrangler-action).
      - name: Deploy frontend to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME:          ${{ github.event.repository.name }}
          ENVIRONMENT:           production
        run: |
          ENV_SHORT="$([[ "$ENVIRONMENT" == "production" ]] && echo "prd" || echo "$ENVIRONMENT")"
          PROJECT="${PROJECT_NAME}-${ENV_SHORT}-web"
          pnpm exec wrangler pages deploy apps/web/dist \
            --project-name "$PROJECT" \
            --branch main

  # ── LAYER 2 — ingestion (depends on graph) ──────────────────────────

  deploy-ingestion:
    name: Deploy · ingestion
    needs: [detect-changes, deploy-graph]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-graph.result == 'success' || needs.deploy-graph.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/ingestion
      - name: Deploy ingestion worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/ingestion
          secrets: |
            B2_KEY_ID
            B2_KEY
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}

  # ── LAYER 3 — gateway (depends on all L1 + L2) ──────────────────────

  deploy-gateway:
    name: Deploy · gateway
    needs: [detect-changes, deploy-user, deploy-graph, deploy-ai, deploy-cleanup, deploy-ingestion]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-user.result      == 'success' || needs.deploy-user.result      == 'skipped') &&
      (needs.deploy-graph.result     == 'success' || needs.deploy-graph.result     == 'skipped') &&
      (needs.deploy-ai.result        == 'success' || needs.deploy-ai.result        == 'skipped') &&
      (needs.deploy-cleanup.result   == 'success' || needs.deploy-cleanup.result   == 'skipped') &&
      (needs.deploy-ingestion.result == 'success' || needs.deploy-ingestion.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/gateway
      - name: Deploy gateway worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/gateway
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # ── LAYER 4 — migrate-d1 (Approval · main-only) ──────────────────────
  # Waits for required reviewers on the production environment after deploy.

  migrate-d1:
    name: Migrate · D1 (Approval · main-only)
    needs: [deploy-user, deploy-graph, deploy-ai, deploy-cleanup, deploy-ingestion, deploy-gateway, deploy-web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.deploy-user.result      == 'success' || needs.deploy-user.result      == 'skipped') &&
      (needs.deploy-graph.result     == 'success' || needs.deploy-graph.result     == 'skipped') &&
      (needs.deploy-ai.result        == 'success' || needs.deploy-ai.result        == 'skipped') &&
      (needs.deploy-cleanup.result   == 'success' || needs.deploy-cleanup.result   == 'skipped') &&
      (needs.deploy-ingestion.result == 'success' || needs.deploy-ingestion.result == 'skipped') &&
      (needs.deploy-gateway.result   == 'success' || needs.deploy-gateway.result   == 'skipped') &&
      (needs.deploy-web.result       == 'success' || needs.deploy-web.result       == 'skipped')
    runs-on: ubuntu-latest
    env:
      # wrangler d1 CLI reads CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # (not the CF_* aliases used by wrangler-action).
      CLOUDFLARE_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN:           ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:          ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME:           ${{ github.event.repository.name }}
      ENVIRONMENT:            'production'
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations --remote
        run: |
          export PROJECT_NAME ENVIRONMENT
          ./scripts/migrate.sh --remote --ai
