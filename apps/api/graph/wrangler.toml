# Graph Service Worker — Neo4j AuraDB-backed knowledge graph.
#
# Identity model:
#   • This Worker does NOT hold JWT_SECRET. It trusts the Gateway-injected
#     x-tenant-id / x-user-role / x-internal-call headers (enforced by
#     `internalOnlyMiddleware`).  Direct public calls are rejected.
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "decision-graph-service"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/graph exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/graph"

# KV — wrangler auto-creates on first deploy.
[[kv_namespaces]]
binding = "CACHE"

[vars]
NEO4J_URL  = "https://REPLACE_WITH_AURADB_HOST.databases.neo4j.io"
NEO4J_USER = "neo4j"
NEO4J_DATABASE = "neo4j"

# Secrets:
#   NEO4J_PASSWORD — password for NEO4J_USER.
#   (JWT_SECRET is NOT required here. Graph consumes identity via headers.)
