# Gateway Worker — public entry point.
#
# Identity model:
#   • This Gateway is the **sole** verifier of inbound Bearer JWTs. It holds
#     JWT_SECRET; downstream workers do NOT. Downstream workers trust the
#     identity headers (x-tenant-id, x-user-id, x-user-role) and the
#     x-internal-call marker injected here.
#   • Downstream calls go via **Service Bindings** (`[[services]]`), not
#     public HTTP URLs — zero extra-network cost, no external-request
#     billing, implicit in-account trust.
#
# Build & deploy:
#   • [build] block is LOCAL ONLY. Canonical deploys use wrangler-action in
#     .github/workflows/deploy-workers.yml (push to main).
#   • `main = "src/index.ts"` lets wrangler bundle via its esbuild pipeline
#     and resolve @ontodecide/shared via package.json exports → dist.

name = "decision-gateway"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/gateway exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/gateway"

# Non-secret runtime variables.
[vars]
AI_DEFAULT_PROVIDER = "workers-ai"

# ----- Service Bindings ---------------------------------------------------
#
# Gateway routes every /api/* request to one of these 5 downstream Workers.
# Each `service` field MUST match the `name =` declared in the target
# wrangler.toml (e.g. decision-user-service).  `binding` is the name the
# code reads (e.g. env.USER_SERVICE → Fetcher).
#
# NOTE: Service Bindings resolve at deploy time against the same account.
#       If you deploy to staging with suffixed worker names, update the
#       `service` field here to match (Dashboard Variables & Secrets take
#       precedence over the committed value — set it there for env splits).
[[services]]
binding = "USER_SERVICE"
service = "decision-user-service"

[[services]]
binding = "GRAPH_SERVICE"
service = "decision-graph-service"

[[services]]
binding = "INGESTION_SERVICE"
service = "decision-ingestion-service"

[[services]]
binding = "AI_SERVICE"
service = "decision-ai-service"

[[services]]
binding = "CLEANUP_SERVICE"
service = "decision-cleanup-service"

# Secrets (set via Dashboard → Worker → Secrets, CI, or `wrangler secret put`):
#   JWT_SECRET           — 32+ byte HMAC signing key.
#                          **ONLY Gateway + User Service hold this secret.**
#                          Downstream services rely on injected headers.

# KV bindings. IDs from Dashboard Variables & Secrets take precedence.
[[kv_namespaces]]
binding = "JWT_BLACKLIST"
id = "REPLACE_WITH_KV_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_ID"
