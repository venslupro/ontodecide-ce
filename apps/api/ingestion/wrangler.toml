# Ingestion Service Worker — multi-source data fusion.
#
# Two paths:
#   * sync  : ≤10 entities → inline Graph call
#   * async : larger files or webhooks → B2 staging → queue → consumer
#
# Deployed via Cloudflare Workers Builds (Git-connected).
#
# Ownership split:
#   HERE: code, vars (GRAPH_SERVICE_URL, B2 region, bucket names),
#         secrets (B2_KEY_ID, B2_KEY, JWT_SECRET), queue KV job IDs.
#   THERE: queue resources (ingestion + DLQ), KV ingestion-jobs,
#          B2 bucket creation itself.
name = "decision-ingestion-service"
main = "dist/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm turbo run build --filter=@ontodecide/ingestion"
cwd = "apps/api/ingestion"

[build.upload]
format = "modules"
dir = "dist"
main = "./index.js"

# Async queue: producer sends, consumer (same Worker) picks up.
[[queues_producers]]
binding = "INGEST_QUEUE"
queue = "ingestion-queue"    # From: `terraform output queues.ingestion`

[[queues_consumers]]
queue = "ingestion-queue"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "ingestion-dlq"   # From: `terraform output queues.ingestion_dlq`

# KV namespace stores job-status records for callers to poll.
[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_KV_ID"   # From: `terraform output kv_namespaces.ingestion-jobs`

[vars]
# Downstream Graph service worker URL — same workers.dev pattern.
GRAPH_SERVICE_URL = "https://decision-graph-service.<ACCOUNT-SUBDOMAIN>.workers.dev"
# Backblaze B2 S3-compatible access: region + staging bucket name.
# Region & bucket must match the output of `terraform output b2_buckets`
# & terraform variable b2_region for the deployed environment.
B2_REGION            = "us-west-004"
B2_INGESTION_BUCKET  = "ontodecide-ingestion-staging-production"

# Secrets (dashboard → Secrets / `wrangler secret put`):
#   JWT_SECRET  — shared signing secret.
#   B2_KEY_ID   — Application Key keyID with R/W on the staging bucket.
#   B2_KEY      — Application Key secret matching B2_KEY_ID.
