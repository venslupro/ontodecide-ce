# AI Service Worker — multi-LLM decision intelligence.
#
# Deployed via Cloudflare Workers Builds (Git-connected).
#
# Ownership split:
#   HERE: code, [vars] (provider/model defaults), third-party API keys
#         as dashboard Secrets, Durable Object class declarations,
#         D1/KV placeholder IDs filled from terraform output.
#   THERE: Workers AI binding itself, D1 decision-db, KV ai-cache,
#          Durable Object namespace creation (on first deploy).
name = "decision-ai-service"
main = "dist/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm turbo run build --filter=@ontodecide/ai"
cwd = "apps/api/ai"

[build.upload]
format = "modules"
dir = "dist"
main = "./index.js"

# Workers AI binding (free tier). The binding NAME is the only value
# that matters to the Worker; the AI resource itself is provisioned by
# the Cloudflare account's Workers AI entitlement.
[ai]
binding = "AI"

# D1: decisions / recommendations tables (shares decision-db).
[[d1_databases]]
binding = "DB"
database_name = "decision-db"
database_id = "REPLACE_WITH_D1_ID"   # From: `terraform output d1_database_id`
migrations_dir = "src/migrations"

# Inference cache + neuron-budget counter.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"           # From: `terraform output kv_namespaces.ai-cache`

# Durable Object: planning agent. The first Workers Builds deploy of
# this Worker will create the namespace from the [[migrations]] below.
[[durable_objects.bindings]]
name = "AGENT"
class_name = "PlanningAgent"

[[migrations]]
tag = "v1"
new_classes = ["PlanningAgent"]

[vars]
AI_DEFAULT_PROVIDER = "workers-ai"
WORKERS_AI_MODEL    = "@cf/meta/llama-3-8b-instruct"
AI_GATEWAY_ID       = "decision-gateway"
OPENAI_MODEL        = "gpt-4o-mini"
ANTHROPIC_MODEL     = "claude-3-sonnet-20241022"
GOOGLE_MODEL        = "gemini-1.5-flash"
OPENROUTER_MODEL    = "openai/gpt-4o-mini"

# Secrets (dashboard → Secrets / `wrangler secret put`):
#   JWT_SECRET             — shared signing secret.
#   OPENAI_API_KEY         — when AI_DEFAULT_PROVIDER == "openai".
#   ANTHROPIC_API_KEY      — when AI_DEFAULT_PROVIDER == "anthropic".
#   GOOGLE_API_KEY         — when AI_DEFAULT_PROVIDER == "google".
#   OPENROUTER_API_KEY     — when AI_DEFAULT_PROVIDER == "openrouter".
#   AI_GATEWAY_TOKEN       — (optional) to route through an AI Gateway.
