# ============================================================
# Deploy Cloudflare Workers
#
# Canonical deployment path for all 6 Workers in the monorepo.
# Runs on every push to `main`.  Each Worker deploys IN PARALLEL
# via the official `cloudflare/wrangler-action@v3`.
#
# Runtime bindings / IDs / Secrets model:
#   • CODE (this repo + wrangler-action):   deploys Worker bundle,
#                                            pushes runtime secrets
#                                            (JWT_SECRET, B2 keys, etc.)
#                                            from GitHub Secrets → Worker
#                                            via `wrangler secret put`.
#   • DASHBOARD (Worker → Variables & Secrets): owns non-secret resource
#                                            IDs (D1, KV) plus URL
#                                            overrides.  Values set in
#                                            Dashboard take precedence
#                                            over `REPLACE_WITH_*` defaults
#                                            committed to wrangler.toml,
#                                            so resource IDs NEVER need
#                                            to be written back to git.
#
# Required GitHub Secrets (Repo → Settings → Secrets and variables):
#   CF_API_TOKEN      — Cloudflare API Token with Workers Scripts Edit,
#                       Workers KV Storage Edit, D1 Edit, Workers Routes
#                       Edit, Queues Edit permissions.
#   CF_ACCOUNT_ID     — Cloudflare Account ID (32 hex chars).
#
#   + Per-Worker runtime secrets (pushed by each matrix job via
#     `wrangler secret put` — set once, survives re-deploys):
#     JWT_SECRET        — HMAC signing key shared across all Workers.
#     NEO4J_PASSWORD    — AuraDB password (user/graph/cleanup only).
#     B2_KEY_ID         — Backblaze B2 Application Key keyID
#                         (ingestion/cleanup only).
#     B2_KEY            — Backblaze B2 Application Key secret
#                         (ingestion/cleanup only).
# ============================================================

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: 'gateway'
            config: 'apps/api/gateway/wrangler.toml'
            package: '@ontodecide/gateway'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
          - name: 'user'
            config: 'apps/api/user/wrangler.toml'
            package: '@ontodecide/user'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
          - name: 'graph'
            config: 'apps/api/graph/wrangler.toml'
            package: '@ontodecide/graph'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
          - name: 'ingestion'
            config: 'apps/api/ingestion/wrangler.toml'
            package: '@ontodecide/ingestion'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              B2_KEY_ID=${{ secrets.B2_KEY_ID }}
              B2_KEY=${{ secrets.B2_KEY }}
          - name: 'ai'
            config: 'apps/api/ai/wrangler.toml'
            package: '@ontodecide/ai'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
          - name: 'cleanup'
            config: 'apps/api/cleanup/wrangler.toml'
            package: '@ontodecide/cleanup'
            secrets: |
              JWT_SECRET=${{ secrets.JWT_SECRET }}
              NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}
              B2_KEY_ID=${{ secrets.B2_KEY_ID }}
              B2_KEY=${{ secrets.B2_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Lock pnpm to the exact version declared in package.json
      # ("packageManager" field — Node.js corepack standard).
      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Build the target Worker + its transitive workspace deps
      # (in practice: @ontodecide/shared).  `turbo run build`
      # typechecks + emits shared/dist, which wrangler's esbuild
      # resolver picks up via @ontodecide/shared → package.json
      # exports.
      - name: Build ${{ matrix.service.name }}
        run: pnpm turbo run build --filter=${{ matrix.service.package }}

      # Deploy Worker code AND push runtime secrets in one step.
      # `secrets` input is written by wrangler-action@v3 via
      # `wrangler secret put <NAME>` — values are picked up from
      # the repo's GitHub Secrets (never committed to git).
      # Resource IDs (D1 / KV / Queue names) come from either
      # wrangler.toml defaults OR (preferred) Dashboard Variables
      # overrides — they are NOT managed by this CI pipeline.
      - name: Deploy ${{ matrix.service.name }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config ${{ matrix.service.config }}
          secrets: ${{ matrix.service.secrets }}

  # ---------------------------------------------------------------
  # Post-deploy: apply D1 migrations to the shared decision-db.
  # Runs ONCE after all 6 Workers have successfully deployed.
  # ---------------------------------------------------------------
  migrate-d1:
    name: Apply D1 Migrations
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply D1 migrations (remote)
        run: ./scripts/migrate.sh --remote
