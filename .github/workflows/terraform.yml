# Terraform (production only). Stages, one job each:
#
#   Format → Validate → Lint → Plan → Apply
#
# Format, Validate, Lint and Plan run on every branch (pull requests) and on
# main. Apply runs only on main, only when Plan found changes, and only
# after a reviewer approves the `production` environment.
#
# On main it is the middle link of the release chain
#
#   push to main → CI → Terraform → Deploy
#
# so Deploy always follows Terraform for the same commit. A nightly run on
# main goes up to Plan as a drift check.
name: Terraform

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The B2 backend has no verified locking; serialize runs on main. Pull
  # requests only plan (no lock) and supersede their own older runs.
  group: terraform-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID || secrets.B2_MASTER_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_KEY || secrets.B2_MASTER_KEY }}
  B2_APPLICATION_KEY_ID: ${{ secrets.B2_MASTER_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_MASTER_KEY }}
  AURA_CLIENT_ID: ${{ secrets.NEO4J_AURA_CLIENT_ID }}
  AURA_CLIENT_SECRET: ${{ secrets.NEO4J_AURA_CLIENT_SECRET }}

defaults:
  run:
    working-directory: infra

jobs:
  fmt:
    name: Format
    # From CI only when it was a green push to main; later stages are
    # skipped with it.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - run: terraform init -backend=false
      - run: terraform validate

  lint:
    name: Lint
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.64.0
      - run: tflint --format compact

  plan:
    name: Plan
    needs: lint
    # Fork PRs get no secrets, so they stop after the static checks.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has-changes: ${{ steps.plan.outputs.exitcode == '2' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -lock=false -detailed-exitcode > plan.txt
          code=$?
          set -e
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          { echo '### terraform plan'; echo '```'; tail -n 80 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [[ ${code} -ne 1 ]]
      - name: Drift detected
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: echo "::error::Infrastructure drift detected" && exit 1

  apply:
    name: Apply (production)
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') &&
      needs.plan.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for a required reviewer to approve the plan above.
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -no-color -out=tfplan
      - run: terraform apply -auto-approve tfplan
