# Continuous Deployment (CD) — Worker Services
#
# Deploys Cloudflare Worker code + runtime secrets when source changes.
# Resource creation (D1 / KV / Queues / Service Bindings / Cron / Domains)
# is handled in terraform.yml — provision BEFORE any service deploy.
#
# TRIGGERS:
#   • push on ANY branch — detect-changes always runs.
#     On main: deploy jobs auto-run for changed services.
#     On non-main: ALL deploy jobs are SKIPPED.
#   • workflow_dispatch — same as push + optional "Run D1 migration" checkbox.
#
# DEPENDENCY ORDER (3-layer):
#   L1 (parallel) → L2 (ingestion → graph) → L3 (gateway → all)

name: Deploy · Services

on:
  push: {}
  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Run D1 migration after deploy (wrangler d1 migrate --remote)'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      user:      ${{ steps.filter.outputs.user }}
      graph:     ${{ steps.filter.outputs.graph }}
      ai:        ${{ steps.filter.outputs.ai }}
      cleanup:   ${{ steps.filter.outputs.cleanup }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      gateway:   ${{ steps.filter.outputs.gateway }}
      any:       ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      # NOTE: paths are inlined per filter — YAML anchors would inject
      # nested lists inside the | block scalar, causing silent mismatch.
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: 'none'
          filters: |
            user:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/user/**'
            graph:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/graph/**'
            ai:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/ai/**'
            cleanup:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/cleanup/**'
            ingestion:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/ingestion/**'
            gateway:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/gateway/**'
            any:
              - 'apps/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vitest.config.ts'
              - '.github/workflows/deploy.yml'
              - 'apps/api/user/**'
              - 'apps/api/graph/**'
              - 'apps/api/ai/**'
              - 'apps/api/cleanup/**'
              - 'apps/api/ingestion/**'
              - 'apps/api/gateway/**'

      - name: Summary
        run: |
          echo "Changed:"
          echo "  user      = ${{ steps.filter.outputs.user }}"
          echo "  graph     = ${{ steps.filter.outputs.graph }}"
          echo "  ai        = ${{ steps.filter.outputs.ai }}"
          echo "  cleanup   = ${{ steps.filter.outputs.cleanup }}"
          echo "  ingestion = ${{ steps.filter.outputs.ingestion }}"
          echo "  gateway   = ${{ steps.filter.outputs.gateway }}"

  # ── LAYER 1 — Independent services (parallel) ──────────────────────

  deploy-user:
    name: Deploy · user
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.user == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/user
      - name: Deploy user worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/user
          secrets: |
            JWT_SECRET
            EMAIL_API_KEY
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}

  deploy-graph:
    name: Deploy · graph
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.graph == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/graph
      - name: Deploy graph worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/graph
          secrets: |
            NEO4J_PASSWORD
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

  deploy-ai:
    name: Deploy · ai
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Deploy ai worker
        # GOOGLE_API_KEY / GROQ_API_KEY are optional — configured directly
        # on Cloudflare Dashboard Secrets so deploys never overwrite them.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/ai

  deploy-cleanup:
    name: Deploy · cleanup
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.cleanup == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/cleanup
      - name: Deploy cleanup worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/cleanup
          secrets: |
            NEO4J_PASSWORD
            B2_KEY_ID
            B2_KEY
        env:
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}

  # ── LAYER 2 — ingestion (depends on graph) ──────────────────────────

  deploy-ingestion:
    name: Deploy · ingestion
    needs: [detect-changes, deploy-graph]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.ingestion == 'true' &&
      (needs.deploy-graph.result == 'success' || needs.deploy-graph.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/ingestion
      - name: Deploy ingestion worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/ingestion
          secrets: |
            B2_KEY_ID
            B2_KEY
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_KEY: ${{ secrets.B2_KEY }}

  # ── LAYER 3 — gateway (depends on all L1 + L2) ──────────────────────

  deploy-gateway:
    name: Deploy · gateway
    needs: [detect-changes, deploy-user, deploy-graph, deploy-ai, deploy-cleanup, deploy-ingestion]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.gateway == 'true' &&
      (needs.deploy-user.result      == 'success' || needs.deploy-user.result      == 'skipped') &&
      (needs.deploy-graph.result     == 'success' || needs.deploy-graph.result     == 'skipped') &&
      (needs.deploy-ai.result        == 'success' || needs.deploy-ai.result        == 'skipped') &&
      (needs.deploy-cleanup.result   == 'success' || needs.deploy-cleanup.result   == 'skipped') &&
      (needs.deploy-ingestion.result == 'success' || needs.deploy-ingestion.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Resolve KV namespace IDs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          ENVIRONMENT: production
        run: ./scripts/resolve-kv-ids.sh apps/api/gateway
      - name: Deploy gateway worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/api/gateway
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # ── MIGRATE-D1 — Manual-only, main-only ──────────────────────────────

  migrate-d1:
    name: Migrate · D1 (Manual · main-only)
    needs: [deploy-user, deploy-graph, deploy-ai, deploy-cleanup, deploy-ingestion, deploy-gateway]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_migration == true &&
      (needs.deploy-user.result      == 'success' || needs.deploy-user.result      == 'skipped') &&
      (needs.deploy-graph.result     == 'success' || needs.deploy-graph.result     == 'skipped') &&
      (needs.deploy-ai.result        == 'success' || needs.deploy-ai.result        == 'skipped') &&
      (needs.deploy-cleanup.result   == 'success' || needs.deploy-cleanup.result   == 'skipped') &&
      (needs.deploy-ingestion.result == 'success' || needs.deploy-ingestion.result == 'skipped') &&
      (needs.deploy-gateway.result   == 'success' || needs.deploy-gateway.result   == 'skipped')
    runs-on: ubuntu-latest
    env:
      # wrangler d1 CLI reads CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
      # (not the CF_* aliases used by wrangler-action).
      CLOUDFLARE_API_TOKEN:   ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID:  ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN:           ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID:          ${{ secrets.CF_ACCOUNT_ID }}
      PROJECT_NAME:           ${{ github.event.repository.name }}
      ENVIRONMENT:            'production'
    steps:
      - uses: actions/checkout@v5
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations --remote
        run: |
          export PROJECT_NAME ENVIRONMENT
          ./scripts/migrate.sh --remote --ai
