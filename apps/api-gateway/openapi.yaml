openapi: 3.2.0
info:
  title: OntoDecide CE API
  version: 1.0.0
  summary: Public REST and WebSocket API of OntoDecide Community Edition.
  description: |
    The only public contract of the Community Edition (修订说明书 10). Every
    operationId equals the `op` of `apps/api-gateway/src/routes.ts`.

    Conventions: JSON bodies are the contract DTOs without envelopes; errors
    are RFC 9457 `application/problem+json` with the stable `code` and
    `traceId` (= `X-Request-Id`). Paging uses `?cursor=&limit=` (limit ≤ 100)
    and returns `nextCursor`. Modifiable resources return `ETag: "v{n}"`;
    PUT / PATCH / DELETE of them require `If-Match` (412 on mismatch).
    Action executions, recommendation decisions and `/admin/*` writes require
    `Idempotency-Key` (16–64 chars). High-risk admin writes require
    `X-Step-Up` (passkey user-verification proof, ≤ 5 min). Every non-GET
    request and the refresh endpoint must carry `Origin` = the app origin.
    Request bodies are limited to 512 KB (413, code VALIDATION_FAILED).

    Admin: any `workspace` operation accepts `X-Act-As-Tenant: {tid}` (admin
    tokens only; owners → 403). The target must exist and be a trial
    workspace (404), writes need it ACTIVE (409); entries and writes are
    audited. `Accept-Language` only affects e-mails and server-generated text.
servers:
  - url: https://app.example.com/api/v1
    description: Production (same origin as the SPA)
tags:
  - {name: auth, summary: Sign-in and sessions, kind: nav}
  - {name: workspace, summary: Workspace, kind: nav}
  - {name: me, summary: Account and trial, parent: workspace, kind: nav}
  - {name: ontology, summary: Ontology, parent: workspace, kind: nav}
  - {name: data, summary: Imports, parent: workspace, kind: nav}
  - {name: objects, summary: Objects and actions, parent: workspace, kind: nav}
  - {name: situation, summary: Situation awareness, parent: workspace, kind: nav}
  - {name: decision, summary: Scenarios and recommendations, parent: workspace, kind: nav}
  - {name: archive, summary: Archive deletion links, kind: nav}
  - {name: admin, summary: Platform administration (Admin), kind: nav}
  - {name: admin-users, summary: Accounts, parent: admin, kind: nav}
  - {name: admin-archives, summary: Archives, parent: admin, kind: nav}
  - {name: admin-platform, summary: Settings and audit, parent: admin, kind: nav}
  - {name: admin-passkeys, summary: Admin passkeys, parent: admin, kind: nav}
  - {name: ops, summary: Operations, kind: nav}
security:
  - bearerAuth: []

paths:
  # ——————————————————————————————— auth ———————————————————————————————
  /auth/codes:
    post:
      tags: [auth]
      operationId: sendCode
      summary: Send an e-mail code (signup / login)
      description: Always 202, whether or not the e-mail exists. Rate class email + ip.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendCodeRequest'}
      responses:
        '202': {description: Accepted}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/sessions:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange an e-mail code for a session
      description: |
        Owner: 201 with an access token and the refresh cookie (signup also
        creates the user and the trial workspace). Admin: 200 with
        `passkeyRequired` — a passkey assertion (or the first-passkey setup,
        or a recovery code) must follow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSessionRequest'}
      responses:
        '201': {$ref: '#/components/responses/SessionIssued'}
        '200':
          description: Admin code accepted; second factor required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyRequired'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/sessions/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Refresh the access token (rotates the refresh cookie)
      description: Replay of a rotated refresh token revokes the whole family. Origin required.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: New access token
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetRefreshCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenGrant'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/sessions/current:
    delete:
      tags: [auth]
      operationId: logout
      summary: End the current session (clears the refresh cookie)
      responses:
        '204':
          description: Logged out
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetRefreshCookie'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/passkeys/options:
    post:
      tags: [auth]
      operationId: passkeyOptions
      summary: WebAuthn request options (admin login or step-up)
      description: '`login` needs `preAuth` (no token); `step_up` needs an admin token.'
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyOptionsRequest'}
      responses:
        '200':
          description: PublicKeyCredentialRequestOptionsJSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnJson'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/passkeys/assertion:
    post:
      tags: [auth]
      operationId: passkeyAssertion
      summary: Submit a passkey assertion
      description: '`login` → 201 admin session (≤ 8 h) + cookie; `step_up` → 200 step-up token.'
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyAssertionRequest'}
      responses:
        '201': {$ref: '#/components/responses/SessionIssued'}
        '200':
          description: Step-up proof for X-Step-Up
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StepUpToken'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/passkeys/setup-options:
    post:
      tags: [auth]
      operationId: passkeySetupOptions
      summary: Creation options for the first admin passkey (needs the setup code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeySetupOptionsRequest'}
      responses:
        '200':
          description: PublicKeyCredentialCreationOptionsJSON
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebAuthnJson'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/passkeys/setup:
    post:
      tags: [auth]
      operationId: passkeySetup
      summary: Bind the first admin passkey and open the admin session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeySetupRequest'}
      responses:
        '201':
          description: Passkey bound; admin session issued
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetRefreshCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeySetupResult'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/recovery:
    post:
      tags: [auth]
      operationId: recoveryLogin
      summary: Sign in with a one-time recovery code (a new passkey must follow)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoveryRequest'}
      responses:
        '201': {$ref: '#/components/responses/SessionIssued'}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— me ———————————————————————————————
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Account, trial and personal quotas
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: The caller with aggregated quotas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeWithQuotas'}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [me]
      operationId: patchMe
      summary: Change language or time zone
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/PatchMeRequest'}
          application/json:
            schema: {$ref: '#/components/schemas/PatchMeRequest'}
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}
  /me/codes:
    post:
      tags: [me]
      operationId: sendMeCode
      summary: Send a confirmation code (purpose terminate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: {type: string, enum: [terminate]}
      responses:
        '202': {description: Accepted}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
  /me/trial/termination:
    post:
      tags: [me]
      operationId: terminateTrial
      summary: End the trial early (archive starts after 16 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^\d{6}$'}
      responses:
        '202': {description: Workspace is EXPIRED}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /me/export:
    get:
      tags: [me]
      operationId: exportWorkspace
      summary: Export the workspace as JSON Lines (streamed)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: One ExportRecord per line
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/jsonl:
              itemSchema: {$ref: '#/components/schemas/ExportRecord'}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /workspace/sample-data:
    post:
      tags: [workspace]
      operationId: loadSampleData
      summary: Load the sample scenario (80 objects, 160 links) once
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '202':
          description: Sample job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— archive ———————————————————————————————
  /archive-deletions/{token}:
    parameters: [{$ref: '#/components/parameters/Token'}]
    get:
      tags: [archive]
      operationId: getArchiveDeletion
      summary: Confirmation data of an e-mailed "delete now" link
      security: []
      responses:
        '200':
          description: Archive still present
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArchiveDeletionInfo'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [archive]
      operationId: confirmArchiveDeletion
      summary: Delete the archive now (one-time token)
      security: []
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— ontology ———————————————————————————————
  /ontology:
    get:
      tags: [ontology]
      operationId: getOntology
      summary: Whole workspace ontology
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: Ontology (ETag = schema version)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ontology'}
        default: {$ref: '#/components/responses/Problem'}
  /object-types:
    get:
      tags: [ontology]
      operationId: listObjectTypes
      summary: List object types
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [ontology]
      operationId: createObjectType
      summary: Create an object type (id = apiName)
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObjectTypeDef'}
      responses:
        '201': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /object-types/{id}:
    parameters: [{$ref: '#/components/parameters/ApiName'}]
    get:
      tags: [ontology]
      operationId: getObjectType
      summary: Get an object type
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [ontology]
      operationId: putObjectType
      summary: Replace an object type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObjectTypeDef'}
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [ontology]
      operationId: deleteObjectType
      summary: Delete an object type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '204': {$ref: '#/components/responses/DefinitionDeleted'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /link-types:
    get:
      tags: [ontology]
      operationId: listLinkTypes
      summary: List link types
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [ontology]
      operationId: createLinkType
      summary: Create a link type (id = apiName)
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkTypeDef'}
      responses:
        '201': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /link-types/{id}:
    parameters: [{$ref: '#/components/parameters/ApiName'}]
    get:
      tags: [ontology]
      operationId: getLinkType
      summary: Get a link type
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [ontology]
      operationId: putLinkType
      summary: Replace a link type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LinkTypeDef'}
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [ontology]
      operationId: deleteLinkType
      summary: Delete a link type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '204': {$ref: '#/components/responses/DefinitionDeleted'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /action-types:
    get:
      tags: [ontology]
      operationId: listActionTypes
      summary: List action types
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionList'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [ontology]
      operationId: createActionType
      summary: Create an action type (id = apiName)
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionTypeDef'}
      responses:
        '201': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /action-types/{id}:
    parameters: [{$ref: '#/components/parameters/ApiName'}]
    get:
      tags: [ontology]
      operationId: getActionType
      summary: Get an action type
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [ontology]
      operationId: putActionType
      summary: Replace an action type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActionTypeDef'}
      responses:
        '200': {$ref: '#/components/responses/DefinitionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [ontology]
      operationId: deleteActionType
      summary: Delete an action type
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '204': {$ref: '#/components/responses/DefinitionDeleted'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— data ———————————————————————————————
  /imports:
    get:
      tags: [data]
      operationId: listImports
      summary: List import jobs
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Page of jobs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [data]
      operationId: createImport
      summary: Create an import job (reserves the daily import rows)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateImportRequest'}
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /imports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [data]
      operationId: getImport
      summary: Import job progress (with the first ≤ 200 rejects)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /imports/{id}/mapping:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      tags: [data]
      operationId: putImportMapping
      summary: Set the mapping (before the first batch)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping: {$ref: '#/components/schemas/MappingSpec'}
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /imports/{id}/batches:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [data]
      operationId: submitImportBatch
      summary: Upload one batch (≤ 100 rows, written synchronously, idempotent by seq)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchResult'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /imports/{id}/mapping-draft:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [data]
      operationId: draftImportMapping
      summary: Mapping draft (deterministic, then AI ≤ 2 per day)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MappingDraftRequest'}
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MappingDraft'}
        '429': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— objects ———————————————————————————————
  /objects:
    get:
      tags: [objects]
      operationId: listObjects
      summary: Search objects
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - name: filter
          in: query
          description: JSON-encoded FilterExpr (only indexed properties are pushed down)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilterExpr'}
        - name: orderBy
          in: query
          schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]*:(asc|desc)$'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Page of objects
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ObjectPage'}
        default: {$ref: '#/components/responses/Problem'}
  /objects/stats:
    get:
      tags: [objects]
      operationId: getObjectStats
      summary: Object and link counts
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphStats'}
        default: {$ref: '#/components/responses/Problem'}
  /objects/{rid}:
    parameters: [{$ref: '#/components/parameters/Rid'}]
    get:
      tags: [objects]
      operationId: getObject
      summary: Object detail (optionally with its links)
      parameters:
        - {name: expand, in: query, description: '`links` adds the link slice around the object', schema: {type: string, enum: [links]}}
        - {name: depth, in: query, description: Link depth with `expand=links`, schema: {type: integer, minimum: 1, maximum: 2, default: 1}}
        - {name: linkTypes, in: query, description: Comma-separated link types with `expand=links`, schema: {type: string}}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Object
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [objects]
      operationId: patchObject
      summary: Merge-patch object properties
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {type: object, additionalProperties: true}
      responses:
        '200':
          description: Updated object
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Object'}
        '400': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /objects/{rid}/links:
    parameters: [{$ref: '#/components/parameters/Rid'}]
    get:
      tags: [objects]
      operationId: getObjectLinks
      summary: Links around an object (depth ≤ 2)
      parameters:
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 2, default: 1}}
        - {name: linkTypes, in: query, description: Comma-separated link types, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [out, in, both], default: both}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 300, default: 200}}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Subgraph
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GraphSlice'}
        default: {$ref: '#/components/responses/Problem'}
  /objects/{rid}/actions:
    parameters: [{$ref: '#/components/parameters/Rid'}]
    get:
      tags: [objects]
      operationId: listObjectActions
      summary: Action audit of an object (newest first)
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Page of action log entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionLogPage'}
        default: {$ref: '#/components/responses/Problem'}
  /action-types/{id}/executions:
    parameters: [{$ref: '#/components/parameters/ApiName'}]
    post:
      tags: [objects]
      operationId: executeAction
      summary: Execute an action on its target
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecuteActionRequest'}
      responses:
        '200':
          description: Action result (also for an idempotent replay)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionResult'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— situation ———————————————————————————————
  /situation/overview:
    get:
      tags: [situation]
      operationId: getSituationOverview
      summary: Cockpit (KPIs, trends, alerts, pending recommendations, quotas)
      parameters:
        - {name: range, in: query, schema: {type: string, enum: [24h, 7d], default: 24h}}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Cockpit data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CockpitOverview'}
        '401': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /alerts:
    get:
      tags: [situation]
      operationId: listAlerts
      summary: List alerts
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [OPEN, ACKED, CLOSED]}}
        - {name: severity, in: query, schema: {$ref: '#/components/schemas/Severity'}}
        - {name: rid, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '200':
          description: Page of alerts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertPage'}
        default: {$ref: '#/components/responses/Problem'}
  /alerts/{id}/acknowledgement:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [situation]
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: Alert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        default: {$ref: '#/components/responses/Problem'}
  /automations:
    get:
      tags: [situation]
      operationId: listAutomations
      summary: List automations
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200':
          description: Automations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Automation'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [situation]
      operationId: createAutomation
      summary: Create an automation (≤ 3 scheduled, interval ≥ 1 h)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationDef'}
      responses:
        '201': {$ref: '#/components/responses/AutomationWithEtag'}
        default: {$ref: '#/components/responses/Problem'}
  /automations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [situation]
      operationId: getAutomation
      summary: Get an automation
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '200': {$ref: '#/components/responses/AutomationWithEtag'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [situation]
      operationId: putAutomation
      summary: Replace an automation
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AutomationDef'}
      responses:
        '200': {$ref: '#/components/responses/AutomationWithEtag'}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [situation]
      operationId: deleteAutomation
      summary: Delete an automation
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/ActAsTenant'}
      responses:
        '204': {description: Deleted}
        '412': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /situation/stream-tickets:
    post:
      tags: [situation]
      operationId: issueStreamTicket
      summary: 30-second one-time WebSocket ticket (bound to sub, tid and Act-as)
      parameters: [{$ref: '#/components/parameters/ActAsTenant'}]
      responses:
        '201':
          description: Ticket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreamTicket'}
        default: {$ref: '#/components/responses/Problem'}
  /situation/stream:
    get:
      tags: [situation]
      operationId: openSituationStream
      summary: Realtime stream (WebSocket upgrade)
      description: |
        Same-origin WebSocket upgrade; Origin must equal the app origin (403).
        The one-time ticket selects the workspace room. Heartbeats are
        protocol-level ping/pong. A trial end closes sockets with code 4401.
        Clients may send `{"type":"resume","lastSeq":n}`: a gap ≤ 200 is
        replayed, otherwise a fresh snapshot is sent.
      security: []
      parameters:
        - {name: ticket, in: query, required: true, schema: {type: string}}
        - {name: Upgrade, in: header, required: true, schema: {type: string, enum: [websocket]}}
      responses:
        '101': {description: Switching protocols}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '426': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
      x-websocket-messages:
        server:
          summary: Server → client frame
          schema: {$ref: '#/components/schemas/WsMsg'}
        client:
          summary: Client → server frame
          schema: {$ref: '#/components/schemas/WsResume'}
        closeCodes:
          '4401': Trial ended

  # ——————————————————————————————— decision ———————————————————————————————
  /scenarios:
    post:
      tags: [decision]
      operationId: runScenario
      summary: Run and store a what-if scenario
