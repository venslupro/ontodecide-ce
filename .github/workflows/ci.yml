# CI: typecheck, lint (gts + architecture guard), unit/integration tests,
# web build with bundle budget, Terraform fmt/validate. Runs on every PR.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm is installed by corepack in the next step, so setup-node
          # must not try to cache it before it exists.
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build web
        run: pnpm build:web
      - name: Bundle budget (initial JS ≤ 250 KB gzip)
        run: node scripts/check_bundle.mjs apps/web/dist 250
      - name: Worker bundles (dry-run)
        run: |
          node scripts/gen_wrangler.mjs --env local
          for w in ontology-manager data-integration object-graph situation-awareness decision-engine identity-access api-gateway; do
            npx wrangler deploy --dry-run --outdir "dist/$w" -c "apps/$w/wrangler.jsonc"
          done

  terraform:
    name: Terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
