# Cleanup Service Worker — daily retention enforcement + manual purge.
#
# ============================================================
# ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS LONG-LIVED RESOURCES ONLY:
#       - D1 shared-db (cloudflare_d1_database.shared_db)
#       - 4 KV namespaces (USER_CACHE / INGESTION_JOBS /
#         AI_CACHE / CLEANUP_JOBS) — for cross-service cache invalidation
#       - Cloudflare Queue resources: cleanup + cleanup-dlq
#   • Wrangler OWNS EVERYTHING WORKER-RELATED:
#       - Worker itself (created / updated by `wrangler deploy`)
#       - [triggers].crons (0 3 * * * UTC — replaces former TF cron_trigger)
#       - [[queues.producers]] CLEANUP_QUEUE +
#         [[queues.consumers]] + dead_letter_queue wiring
#       - [[d1_databases]] DB binding (database_id by resolve-d1-ids.sh)
#       - [[kv_namespaces]] ×4 bindings (ids by resolve-kv-ids.sh)
#       - [observability] block — Workers Observability enabled here
#       - script code · [vars] · NEO4J_PASSWORD + B2_KEY_ID + B2_KEY
# ============================================================
#
# Exports:
#   * `fetch`     — admin endpoints (POST /cleanup, GET /cleanup/status/:id)
#   * `scheduled` — daily cron trigger at 03:00 UTC (Terraform-managed)
#   * `queue`     — consumer for cleanup-queue
#
# Identity model:
#   • This Worker does NOT hold JWT_SECRET. It trusts Gateway-injected
#     headers (enforced by `internalOnlyMiddleware()`). Admin role check
#     is performed on the x-user-role header for /cleanup endpoints.
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "ontodecide-prd-cleanup"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# ----- Workers Observability ------------------------------------------------
# Enabled at the Worker by this wrangler.toml; every `wrangler deploy`
# re-applies the full block. Dashboard shows "Observability: Enabled".
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
destinations = ["cloudflare"]
head_sampling_rate = 1
persist = true

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/cleanup exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
# No `cwd` — see graph/wrangler.toml. A repo-root-relative path doubles and
# causes spawn /bin/sh ENOENT; the default (process cwd = service dir) is correct.

# Daily cleanup at 03:00 UTC.
# Terraform cloudflare_workers_cron_trigger.cleanup_daily also provisions
# this; both MUST stay in sync.  If you change the cron here, update
# local.workers["cleanup"].cron in infrastructure/terraform/main.tf too.
[triggers]
crons = ["0 3 * * *"]

# ----- Queue: per-tenant cleanup messages + DLQ --------------------------
# Names MUST match cloudflare_queue.cleanup(.cleanup_dlq).name pattern.
[[queues.producers]]
binding = "CLEANUP_QUEUE"
queue   = "ontodecide-prd-cleanup"

[[queues.consumers]]
queue             = "ontodecide-prd-cleanup"
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "ontodecide-prd-cleanup-dlq"

# ----- D1: shared-db (Terraform-managed) ---------------------------------
[[d1_databases]]
binding        = "DB"
database_name  = "ontodecide-prd-shared-db"

# ----- KV: cross-service cache invalidation (Terraform-managed) -----------
# 4 bindings MUST match local.kv_binding_map entries with svc="cleanup".
[[kv_namespaces]]
binding = "USER_CACHE"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_USER_CACHE_CLEANUP_ID"

[[kv_namespaces]]
binding = "INGESTION_JOBS"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_INGESTION_JOBS_CLEANUP_ID"

[[kv_namespaces]]
binding = "AI_CACHE"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_AI_CACHE_CLEANUP_ID"

[[kv_namespaces]]
binding = "CLEANUP_JOBS"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_CLEANUP_JOBS_CLEANUP_ID"

[vars]
NEO4J_URL  = "https://REPLACE_WITH_AURADB_HOST.databases.neo4j.io"
NEO4J_USER = "neo4j"
NEO4J_DATABASE = "neo4j"

B2_REGION           = "us-west-004"
B2_INGESTION_BUCKET = "ontodecide-prd-ingestion-staging"
B2_ARCHIVE_BUCKET   = "ontodecide-prd-tenant-archive"

# Secrets (Dashboard → Secrets, CI, or `wrangler secret put`):
#   NEO4J_PASSWORD   — Password for NEO4J_USER on the shared database.
#                      Used for DETACH DELETE tenant cleanup queries.
#   B2_KEY_ID        — B2 Application Key keyID with R/W on BOTH the
#                      ingestion staging + tenant archive buckets.
#   B2_KEY           — B2 Application Key secret paired with B2_KEY_ID.
#   (JWT_SECRET is NOT required here. Cleanup consumes identity via
#    Gateway-injected headers; cron/queue runs are platform-invoked.)
