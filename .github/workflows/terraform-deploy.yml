# ============================================================
# Terraform Deploy Workflow
#
# STANDARD: Google Cloud Platform / Cloud Foundation Toolkit
# workflow code-style conventions.
#
# Backblaze B2 has replaced Cloudflare R2 for ALL object storage
# in this project: business-data buckets (ingestion-staging +
# tenant-archive) AND the Terraform remote-state bucket all live
# in B2 now.
#
# Two-stage pipeline (CFT standard):
#   Stage 1 "plan"  — automatic on EVERY branch. Emits a plan
#                     artifact + human-readable diff summary.
#                     On branches / forks WITHOUT the required
#                     secrets, Plan is gracefully SKIPPED (exit
#                     0 with an informative GITHUB_STEP_SUMMARY,
#                     never a red failure).
#   Stage 2 "apply" — EXPLICITLY requires: (a) approval of the
#                     "production" GitHub Environment, AND
#                     (b) running from `refs/heads/main`.
#
# ==================================================================
# GITHUB CONFIGURATION REFERENCE — Google-style config matrix
# ==================================================================
# Navigate:  Repo → Settings → Secrets and variables → Actions
#
# ┌─────────────────────────────────────────────────────────────────────────────┬──────────┬──────────┬──────────────────────────────────────────────────────────┬─────────────────────────────────────────────┬─────────────────────────────────────────────────────────────┐
# │ Name                                                                        │ Type     │ Required │ Purpose                                                │ Example                                     │ Rotation / Notes                                            │
# ├─────────────────────────────────────────────────────────────────────────────┼──────────┼──────────┼──────────────────────────────────────────────────────────┼─────────────────────────────────────────────┼─────────────────────────────────────────────────────────────┤
# │ CLOUDFLARE_API_TOKEN                                                        │ Secret   │ Yes      │ Cloudflare Terraform provider authentication.          │ AQhi...612                                  │ Per Cloudflare token lifecycle; rotation is hot-swappable.  │
# │ CLOUDFLARE_ACCOUNT_ID                                                       │ Secret   │ No       │ Override for auto-discover. Only set if the token       │ 0123456789abcdef0123456789abcdef            │ does NOT grant the Account List permission.                 │
# │ TF_VAR_jwt_secret                                                           │ Secret   │ Yes      │ HMAC signing secret for gateway/user JWT tokens.        │ (64 random chars via openssl rand -base64 48)│ Invalidate all existing sessions on rotation.               │
# │ TF_VAR_neo4j_password                                                       │ Secret   │ Yes      │ Password for Neo4j AuraDB user (var.neo4j_user).        │ (dashboard secret)                          │ Rotate via AuraDB dashboard FIRST, then update the secret. │
# │ TF_VAR_cloudflare_account_id_or_workers_dev                                 │ Secret   │ Yes      │ Workers.dev subdomain prefix for cross-worker URLs.     │ "myteam-a1b2"                               │ Rarely changes; tied to the Cloudflare account.            │
# │ TF_B2_STATE_KEY_ID                                                          │ Secret   │ Yes      │ B2 App Key keyID — Terraform STATE backend bucket R/W   │ 0001a2b3c4d5e6f00000000001k                  │ Bucket-scoped (ontodecide-terraform-state) ONLY.          │
# │ TF_B2_STATE_APPLICATION_KEY                                                 │ Secret   │ Yes      │ B2 App Key secret — paired with TF_B2_STATE_KEY_ID.     │ (shown once at App Key creation)            │ Create a 2nd key, swap, delete old — no downtime.          │
# │ TF_VAR_b2_application_key_id                                                │ Secret   │ Yes      │ B2 App Key keyID — BUSINESS buckets (ingestion +        │ 000...0001k                                 │ Must cover BOTH business buckets (Read & Write).           │
# │                               archive).                                     │          │          │                                                        │                                             │                                                             │
# │ TF_VAR_b2_application_key                                                   │ Secret   │ Yes      │ B2 App Key secret — paired with the business-bucket     │ (shown once at App Key creation)            │ Rotate together with b2_application_key_id.                 │
# │                               keyID.                                        │          │          │                                                        │                                             │                                                             │
# │ TF_VAR_neo4j_url                                                            │ Variable │ Yes      │ AuraDB cluster base URL (https://...databases.neo4j.io).│ https://neo4j+s://abc123.databases.neo4j.io │ From Neo4j AuraDB dashboard → Connection details.          │
# │ TF_VAR_cloudflare_account_id                                                │ Variable │ No       │ Alternate delivery for the optional account override.  │ 0123...cdef                                │ Same-named Secret takes precedence if both exist.          │
# │ TF_VAR_b2_region                                                            │ Variable │ Yes      │ B2 region code — used for BOTH backend endpoint and    │ "us-west-004"                               │ Copy from any B2 bucket's details screen in dashboard.     │
# │                               the aws.b2 provider endpoint.                │          │          │                                                        │                                             │                                                             │
# │ TF_VAR_default_provider                                                     │ Variable │ No       │ Default LLM provider for AI Worker.                    │ "workers-ai"                                │ Defaults to "workers-ai" if unset.                         │
# │ TF_VAR_workers_ai_model                                                     │ Variable │ No       │ Workers AI model id for default_provider=workers-ai.   │ "@cf/meta/llama-3-8b-instruct"              │ Defaults to @cf/meta/llama-3-8b-instruct.                  │
# └─────────────────────────────────────────────────────────────────────────────┴──────────┴──────────┴──────────────────────────────────────────────────────────┴─────────────────────────────────────────────┴─────────────────────────────────────────────────────────────┘
#
# ADDITIONAL GITHUB SETUP:
#   • Settings → Environments → New environment → name = "production"
#     → Enable "Required reviewers" → add people / teams authorized
#     to approve production applies.
# ==================================================================

name: Terraform Deploy

on:
  # ------------------------------------------------------------------
  #   • terraform PLAN  → may run on EVERY branch.
  #   • terraform APPLY → still restricted to the main branch ONLY
  #                      (gated separately at the job level).
  # ------------------------------------------------------------------
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment name (sets the B2 state key prefix)."
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # ---- Shared configuration ----
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: "infrastructure/terraform"
  # Manually-created B2 bucket for Terraform remote state.
  # See main.tf for the one-time first-setup instructions.
  TF_STATE_BUCKET: "ontodecide-terraform-state"

jobs:
  # ================================================================
  # Stage 1 — Plan (automatic, no approval)
  #
  # Graceful-skip behaviour (Google CFT pattern):
  #   If ANY required Secret / Variable needed to reach the remote
  #   state or to validate Terraform inputs is missing (typical on
  #   contributor forks / feature branches without secrets), we
  #   produce an informative GITHUB_STEP_SUMMARY note, set
  #   changed=false, skipped=true, and exit 0 — so the PR check
  #   does NOT turn red. The Build/Lint/Test CI still provides
  #   full code-quality validation.
  # ================================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-artifact: tfplan-${{ github.sha }}
      changed: ${{ steps.plan-summary.outputs.changed }}
      skipped: ${{ steps.preflight.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # ---- Preflight: required Secret + Variable presence ----
      #
      # Terraform's own validation blocks (see variables.tf and
      # b2.tf) will catch FORMAT issues during `plan`; this step
      # catches PRESENCE issues early so the operator sees a
      # single clean list of missing items with remediation
      # hints instead of 10 cryptic errors later.
      - name: Preflight — required secrets & variables
        id: preflight
        env:
          # --- Terraform state backend ---
          S__TF_B2_STATE_KEY_ID:              ${{ secrets.TF_B2_STATE_KEY_ID }}
          S__TF_B2_STATE_APPLICATION_KEY:     ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          V__TF_VAR_b2_region:                ${{ vars.TF_VAR_b2_region }}
          # --- Cloudflare provider ---
          S__CLOUDFLARE_API_TOKEN:            ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # --- Required Terraform input vars (no defaults) ---
          S__TF_VAR_jwt_secret:               ${{ secrets.TF_VAR_jwt_secret }}
          S__TF_VAR_neo4j_password:           ${{ secrets.TF_VAR_neo4j_password }}
          S__TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          S__TF_VAR_b2_application_key_id:    ${{ secrets.TF_VAR_b2_application_key_id }}
          S__TF_VAR_b2_application_key:       ${{ secrets.TF_VAR_b2_application_key }}
          V__TF_VAR_neo4j_url:                ${{ vars.TF_VAR_neo4j_url }}
        run: |
          set +e
          declare -A SPEC=(
            # [env_var_name]="human_readable_spec"
            ["S__TF_B2_STATE_KEY_ID"]="Secret   | TF_B2_STATE_KEY_ID                    | B2 App Key keyID for ontodecide-terraform-state bucket"
            ["S__TF_B2_STATE_APPLICATION_KEY"]="Secret   | TF_B2_STATE_APPLICATION_KEY       | B2 App Key secret (matches TF_B2_STATE_KEY_ID)"
            ["V__TF_VAR_b2_region"]="Variable | TF_VAR_b2_region                   | B2 region code, e.g. us-west-004"
            ["S__CLOUDFLARE_API_TOKEN"]="Secret   | CLOUDFLARE_API_TOKEN               | Cloudflare Terraform provider token"
            ["S__TF_VAR_jwt_secret"]="Secret   | TF_VAR_jwt_secret                  | JWT signing secret (>=32 random bytes)"
            ["S__TF_VAR_neo4j_password"]="Secret   | TF_VAR_neo4j_password              | Neo4j AuraDB password"
            ["S__TF_VAR_cloudflare_account_id_or_workers_dev"]="Secret   | TF_VAR_cloudflare_account_id_or_workers_dev | Workers.dev subdomain prefix"
            ["S__TF_VAR_b2_application_key_id"]="Secret   | TF_VAR_b2_application_key_id     | B2 App Key keyID for business-data buckets"
            ["S__TF_VAR_b2_application_key"]="Secret   | TF_VAR_b2_application_key        | B2 App Key secret for business-data buckets"
            ["V__TF_VAR_neo4j_url"]="Variable | TF_VAR_neo4j_url                   | AuraDB cluster base URL"
          )

          missing=()
          for var_name in "${!SPEC[@]}"; do
            if [ -z "${!var_name}" ]; then
              missing+=("${SPEC[$var_name]}")
            fi
          done
          set -e

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::${#missing[@]} required Terraform secrets/variables missing — gracefully skipping Plan for this run."
            {
              echo "### Terraform Plan — Skipped (${#missing[@]} required item(s) not configured)"
              echo ""
              echo "This branch / fork does not carry all of the GitHub Secrets"
              echo "and Variables required to run Terraform Plan against the"
              echo "Backblaze B2 remote state. The Build/Lint/Test CI job still"
              echo "provides full code-quality validation for this PR."
              echo ""
              echo "| Type | Name | Hint |"
              echo "|---|---|---|"
              for m in "${missing[@]}"; do
                IFS='|' read -r type name hint <<<"$m"
                # trim whitespace
                type="$(echo "$type" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                name="$(echo "$name" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                hint="$(echo "$hint" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
                echo "| ${type} | \`${name}\` | ${hint} |"
              done
              echo ""
              echo "**What this means:**"
              echo "- No infrastructure diff can be previewed from this run."
              echo "- After merging to \`main\`, Plan + Apply will run with the"
              echo "  production credentials configured on the repo."
              echo ""
              echo "**To configure (repo owner only):** See the full configuration"
              echo "matrix at the top of \`.github/workflows/terraform-deploy.yml\`"
              echo "and the setup docs in \`infrastructure/terraform/main.tf\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Terraform init with B2 remote backend ----
      #
      # The backend "s3" block in main.tf is partial — we inject
      # the real B2 credentials via AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY (the bundled AWS SDK inside
      # Terraform's backend "s3" only accepts those env vars).
      # AWS_EC2_METADATA_DISABLED=true prevents the SDK from
      # falling through to EC2 IMDS lookups on GitHub
      # Actions runners, which would otherwise produce a
      # misleading "no EC2 IMDS role found" error that masks
      # the real root cause.
      - name: Terraform Init (B2 backend)
        if: steps.preflight.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          # Cloudflare Terraform provider — official env vars
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # B2 state backend — standard AWS SDK env vars
          AWS_ACCESS_KEY_ID:            ${{ secrets.TF_B2_STATE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:        ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          AWS_DEFAULT_REGION:           ${{ vars.TF_VAR_b2_region }}
          AWS_EC2_METADATA_DISABLED:    true
          # Non-secret init inputs (shell variables)
          B2_REGION:  ${{ vars.TF_VAR_b2_region }}
          ENV:        ${{ github.event.inputs.environment || 'production' }}
        run: |
          STATE_KEY="${ENV}/terraform.tfstate"
          B2_ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"

          BACKEND_CFG_FILE="backend-config-overrides.tfvars"

          cat > "${BACKEND_CFG_FILE}" <<'EOF'
          bucket     = "__TF_STATE_BUCKET__"
          key        = "__STATE_KEY__"
          endpoints = {
            s3 = "__B2_ENDPOINT__"
          }
          EOF

          sed -i \
            -e "s|__TF_STATE_BUCKET__|${TF_STATE_BUCKET}|g" \
            -e "s|__STATE_KEY__|${STATE_KEY}|g" \
            -e "s|__B2_ENDPOINT__|${B2_ENDPOINT}|g" \
            "${BACKEND_CFG_FILE}"

          echo "--- backend-config-overrides.tfvars ---"
          cat "${BACKEND_CFG_FILE}"
          echo "---------------------------------------"

          terraform init \
            -input=false \
            -backend-config="${BACKEND_CFG_FILE}"

      # ---- Terraform validate (Google CFT style — runs before plan) ----
      - name: Terraform Validate
        if: steps.preflight.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform validate

      # ---- Terraform plan ----
      - name: Terraform Plan
        id: plan
        if: steps.preflight.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          # Provider auth
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Terraform input vars — secrets
          TF_VAR_jwt_secret:              ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_neo4j_password:          ${{ secrets.TF_VAR_neo4j_password }}
          TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          TF_VAR_b2_application_key_id:   ${{ secrets.TF_VAR_b2_application_key_id }}
          TF_VAR_b2_application_key:      ${{ secrets.TF_VAR_b2_application_key }}
          # Terraform input vars — non-sensitive
          TF_VAR_neo4j_url:               ${{ vars.TF_VAR_neo4j_url }}
          TF_VAR_cloudflare_account_id:   ${{ vars.TF_VAR_cloudflare_account_id }}
          TF_VAR_b2_region:               ${{ vars.TF_VAR_b2_region }}
          TF_VAR_default_provider:        ${{ vars.TF_VAR_default_provider }}
          TF_VAR_workers_ai_model:        ${{ vars.TF_VAR_workers_ai_model }}
          ENV_TAG: ${{ github.event.inputs.environment || 'production' }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan.binary \
            -var="environment=${ENV_TAG}"
          terraform show -json tfplan.binary > tfplan.json

      # ---- Upload plan artifact ----
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.binary
            ${{ env.TF_WORKING_DIR }}/tfplan.json
          if-no-files-found: ignore
          retention-days: 7

      # ---- Human-readable change summary (Google CFT pattern) ----
      - name: Summarize resource changes
        id: plan-summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ steps.preflight.outputs.skipped }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ADDS=$(jq '[.resource_changes[]?.change.actions[] | select(. == "create")] | length' tfplan.json)
          UPDATES=$(jq '[.resource_changes[]?.change.actions[] | select(. == "update")] | length' tfplan.json)
          DESTROYS=$(jq '[.resource_changes[]?.change.actions[] | select(. == "delete")] | length' tfplan.json)
          {
            echo "### Terraform Plan Summary"
            echo ""
            echo "| Change type | Count |"
            echo "|---|---|"
            echo "| 🟢 Add      | ${ADDS}    |"
            echo "| 🟡 Update   | ${UPDATES} |"
            echo "| 🔴 Destroy  | ${DESTROYS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$((ADDS + UPDATES + DESTROYS))
          if [ "$TOTAL" -gt 0 ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo ":warning: **${TOTAL} resource(s) will change.** Review the plan log before approving apply." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ":white_check_mark: No resource changes. Apply will be a no-op." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ================================================================
  # Stage 2 — Apply (manual approval + main branch only)
  # ================================================================
  apply:
    name: Terraform Apply  ✅ Manual approval required
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.plan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://dash.cloudflare.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # Re-run the same credential preflight on apply. Apply
      # NEVER falls back to graceful skip — it always runs from
      # `main` with the full production secret set configured.
      # If something is missing here we HARD-FAIL so the
      # operator sees the missing-item list directly instead of
      # a confusing Terraform error.
      - name: Preflight — required secrets & variables (Apply — hard-fail)
        env:
          S__TF_B2_STATE_KEY_ID:              ${{ secrets.TF_B2_STATE_KEY_ID }}
          S__TF_B2_STATE_APPLICATION_KEY:     ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          V__TF_VAR_b2_region:                ${{ vars.TF_VAR_b2_region }}
          S__CLOUDFLARE_API_TOKEN:            ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S__TF_VAR_jwt_secret:               ${{ secrets.TF_VAR_jwt_secret }}
          S__TF_VAR_neo4j_password:           ${{ secrets.TF_VAR_neo4j_password }}
          S__TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          S__TF_VAR_b2_application_key_id:    ${{ secrets.TF_VAR_b2_application_key_id }}
          S__TF_VAR_b2_application_key:       ${{ secrets.TF_VAR_b2_application_key }}
          V__TF_VAR_neo4j_url:                ${{ vars.TF_VAR_neo4j_url }}
        run: |
          set +e
          declare -A SPEC=(
            ["S__TF_B2_STATE_KEY_ID"]="Secret   | TF_B2_STATE_KEY_ID"
            ["S__TF_B2_STATE_APPLICATION_KEY"]="Secret   | TF_B2_STATE_APPLICATION_KEY"
            ["V__TF_VAR_b2_region"]="Variable | TF_VAR_b2_region"
            ["S__CLOUDFLARE_API_TOKEN"]="Secret   | CLOUDFLARE_API_TOKEN"
            ["S__TF_VAR_jwt_secret"]="Secret   | TF_VAR_jwt_secret"
            ["S__TF_VAR_neo4j_password"]="Secret   | TF_VAR_neo4j_password"
            ["S__TF_VAR_cloudflare_account_id_or_workers_dev"]="Secret   | TF_VAR_cloudflare_account_id_or_workers_dev"
            ["S__TF_VAR_b2_application_key_id"]="Secret   | TF_VAR_b2_application_key_id"
            ["S__TF_VAR_b2_application_key"]="Secret   | TF_VAR_b2_application_key"
            ["V__TF_VAR_neo4j_url"]="Variable | TF_VAR_neo4j_url"
          )
          missing=()
          for var_name in "${!SPEC[@]}"; do
            [ -z "${!var_name}" ] && missing+=("${SPEC[$var_name]}")
          done
          set -e
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Terraform Apply aborted — ${#missing[@]} required secret(s)/variable(s) missing from the main-branch configuration:" >&2
            for m in "${missing[@]}"; do
              echo "  - ${m}" >&2
            done
            echo "Repair via Settings → Secrets and variables → Actions, then re-run Plan + Approve." >&2
            exit 1
          fi
          echo "Preflight OK: all ${!#SPEC[@]} required items present."

      - name: Terraform Init (B2 backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID:            ${{ secrets.TF_B2_STATE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:        ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          AWS_DEFAULT_REGION:           ${{ vars.TF_VAR_b2_region }}
          AWS_EC2_METADATA_DISABLED:    true
          B2_REGION:  ${{ vars.TF_VAR_b2_region }}
          ENV:        ${{ github.event.inputs.environment || 'production' }}
        run: |
          STATE_KEY="${ENV}/terraform.tfstate"
          B2_ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"

          BACKEND_CFG_FILE="backend-config-overrides.tfvars"

          cat > "${BACKEND_CFG_FILE}" <<'EOF'
          bucket     = "__TF_STATE_BUCKET__"
          key        = "__STATE_KEY__"
          endpoints = {
            s3 = "__B2_ENDPOINT__"
          }
          EOF

          sed -i \
            -e "s|__TF_STATE_BUCKET__|${TF_STATE_BUCKET}|g" \
            -e "s|__STATE_KEY__|${STATE_KEY}|g" \
            -e "s|__B2_ENDPOINT__|${B2_ENDPOINT}|g" \
            "${BACKEND_CFG_FILE}"

          echo "--- backend-config-overrides.tfvars ---"
          cat "${BACKEND_CFG_FILE}"
          echo "---------------------------------------"

          terraform init \
            -input=false \
            -backend-config="${BACKEND_CFG_FILE}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan-artifact }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify plan artifact exists
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ ! -f tfplan.binary ]; then
            echo "::error::Plan artifact is missing. Re-run the 'plan' job and approve apply before the artifact expires (7 days)."
            exit 1
          fi

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_jwt_secret:              ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_neo4j_password:          ${{ secrets.TF_VAR_neo4j_password }}
          TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          TF_VAR_b2_application_key_id:   ${{ secrets.TF_VAR_b2_application_key_id }}
          TF_VAR_b2_application_key:      ${{ secrets.TF_VAR_b2_application_key }}
          TF_VAR_neo4j_url:               ${{ vars.TF_VAR_neo4j_url }}
          TF_VAR_cloudflare_account_id:   ${{ vars.TF_VAR_cloudflare_account_id }}
