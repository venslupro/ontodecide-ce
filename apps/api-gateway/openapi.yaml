        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: Recommendation after the decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recommendation'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  # ——————————————————————————————— admin ———————————————————————————————
  /admin/overview:
