# ============================================================
# Infrastructure as Code — Terraform Workflow
#
# Manages LONG-LIVED Cloudflare resources (D1 / KV / Queues /
# Worker Bindings / Cron / Domains) via Terraform's declarative
# model — the "Shift Left" pillar of the hybrid architecture.
#
# TRIGGERS:
#   • push to `main` with changes under infrastructure/terraform/**
#     → fmt · validate · plan (READ-ONLY) + apply job is CREATED
#       but pauses at ⏳ WAITING, gated by the `production` GitHub
#       Environment Required-reviewers protection rule.
#       Operator clicks "Review pending deployments → Approve &
#       deploy" at the TOP OF THIS SAME run page → ONE single
#       click fires `terraform apply` against the EXACT plan
#       binary already uploaded by Phase 2 (reviewed diff = applied
#       diff).  Apply NEVER auto-runs; the Environment gate is the
#       sole pause-point.  See the ⚠️ MANDATORY REPO CONFIG block
#       below — without this 1-click-flow breaks badly (the apply
#       job would run immediately on every push, as in run #52).
#   • pull_request to `main` with TF file changes
#     → fmt · validate · plan (READ-ONLY).  The apply job is
#       explicitly skipped (PR github.ref != refs/heads/main).
#       PRs can never trigger apply.
#   • workflow_dispatch (any branch)
#     → fmt · validate · plan ALWAYS run so the operator can check
#       the plan diff from any branch.  The apply job then behaves
#       as follows:
#         - on main → apply enters ⏳ WAITING (prod env approval).
#         - on other branches → apply is cleanly skipped
#           (github.ref != refs/heads/main) without affecting the
#           plan results already displayed above.
#     The trigger intentionally declares no `branches:` key —
#     actionlint v1 rejects `branches:` under workflow_dispatch
#     as unknown syntax; branch gating is done on the apply job.
#
# ⚠️⚠️⚠️  MANDATORY REPO CONFIG BEFORE MERGING / USING  ⚠️⚠️⚠️
#   This workflow operates a SINGLE manual-click model: the
#   `environment: production` deployment protection rule is the
#   ONLY mechanism that prevents `terraform apply` from running
#   automatically on push to main.  If the `production`
#   Environment is misconfigured or missing, apply WILL RUN
#   UNAUTHORIZED on every push (see run #52 incident).
#
#   Configure NOW in GitHub web UI:
#     1. Repo → Settings → Environments
#     2. [New environment]  Name = production   (exact match)
#     3. Required reviewers  →  ✅ Tick this box
#        Add at least ONE reviewer account (preferably 2+).
#     4. (Optional but recommended) Admins can bypass — OFF.
#     5. [Save protection rules].
#
#   After saving, push-triggered runs on main will pause Apply
#   at WAITING and surface the "Review pending deployments"
#   banner at the top of the run page — that is the 1-click UX.
# ⚠️⚠️⚠️  END MANDATORY REPO CONFIG  ⚠️⚠️⚠️
#
# ENVIRONMENT:
#   This pipeline targets a SINGLE, FIXED environment: production.
#   There is no staging/non-production environment selector.
#
# PHASES:
#   1. Static checks   — terraform fmt -check (canonical formatting)
#                        + terraform validate (schema / references)
#   2. Plan            — `terraform plan` renders the diff against
#                        the real Cloudflare state.  The plan JSON
#                        is uploaded as a build artifact for review.
#   3. Apply ( single manual click on push/main )
#                      — Created whenever github.ref is refs/heads/main
#                        (both push to main AND workflow_dispatch on
#                        main).  Instantly enters ⏳ WAITING via the
#                        `production` Environment Required-reviewers
#                        protection rule until a human clicks the
#                        banner → Approve & deploy (ONE click to
#                        apply; that click is the full manual gate).
#                      — On NON-main workflow_dispatch runs, and on
#                        ALL pull requests (ref != main), apply is
#                        cleanly SKIPPED.  The plan from Phase 2 is
#                        still rendered in full for review.
#                      — ⚠️ Push-to-main auto-pause is 100% reliant
#                        on the Environment config block above.
#                        Apply the MANDATORY REPO CONFIG steps in the
#                        TRIGGERS section BEFORE merging this change
#                        (omitting it caused the run-#52 auto-apply).
#
# REQUIRED GITHUB SECRETS / VARS:
#   (Set via Repo → Settings → Secrets and variables → Actions)
#
#   Secrets (shared with deploy-service.yml):
#     CF_API_TOKEN   — Cloudflare API token with wide admin scopes
#                      (D1 · KV · Queue · Worker Script ·
#                       Worker Domain · Account Settings read).
#     CF_ACCOUNT_ID  — Cloudflare Account ID (32 hex chars)
#   Variables (optional):
#     TF_ZONE_ID     — (optional) DNS Zone ID for custom domains
#
#   The project name is derived from the GitHub repo name
#   (github.event.repository.name) and the environment is
#   fixed to "production".
# ============================================================

name: Terraform · Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/*.tf'
      - 'infrastructure/terraform/**/*.tf'
      - 'infrastructure/terraform/*.tfvars'
      - 'infrastructure/terraform/**/*.tfvars'
      - '.github/workflows/terraform.yml'
      - 'infrastructure/terraform/.terraform.lock.hcl'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/*.tf'
      - 'infrastructure/terraform/**/*.tf'
      - 'infrastructure/terraform/*.tfvars'
      - 'infrastructure/terraform/**/*.tfvars'
      - '.github/workflows/terraform.yml'
      - 'infrastructure/terraform/.terraform.lock.hcl'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# Default working directory for all `run:` steps — saves
# repeating `cd infrastructure/terraform` everywhere.
defaults:
  run:
    working-directory: infrastructure/terraform

env:
  # Terraform Provider authentication — reuse the same CF_API_TOKEN
  # already configured for deploy-service.yml (no extra secret needed).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  # Input variables (injected via TF_VAR_ convention into variables.tf)
  # CF_ACCOUNT_ID is a secret; repo name and environment are hardcoded.
  TF_VAR_account_id:  ${{ secrets.CF_ACCOUNT_ID }}
  TF_VAR_zone_id:     ${{ vars.TF_ZONE_ID }}
  TF_VAR_project_name: ${{ github.event.repository.name }}
  TF_VAR_environment: 'production'
  # ---- Remote state backend (B2 S3-compatible) ----
  # Backend config (bucket/endpoint/region/skip flags) is STATIC in
  # versions.tf. Only credentials are injected via env vars.
  # Reuses B2_KEY_ID / B2_KEY secrets already configured for
  # deploy-service.yml (ingestion + cleanup workers).
  AWS_ACCESS_KEY_ID:     ${{ secrets.B2_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_KEY }}

jobs:
  # -------------------------------------------------------------
  # Phase 1 — Static validation (fmt + validate)
  # -------------------------------------------------------------
  validate:
    name: Fmt · Validate
    runs-on: ubuntu-latest
    # validate + plan run on ALL trigger-event × branch combinations so
    # the operator can always inspect formatting / schema / plan diff.
    # Only the APPLY step below is gated by branch (main) + human approval.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true

      - name: Init (backend=false — state is managed externally)
        run: terraform init -backend=false -input=false

      - name: Format check (canonical HCL layout)
        id: fmt
        run: terraform fmt -check -recursive -list=false

      - name: Validate schema + references
        id: validate
        run: terraform validate

  # -------------------------------------------------------------
  # Phase 2 — Plan (runs against REAL Cloudflare state)
  #          terraform plan is READ-ONLY — it does not create or
  #          modify resources.  Safe to run on every PR so reviewers
  #          can see the infra diff before merge.
  # -------------------------------------------------------------
  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      plan_exit: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: infrastructure/terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}

      - name: Init (B2 remote state backend config is static in versions.tf)
        run: terraform init -input=false

      - name: (One-off) Remove stale D1 UUID from remote state
        if: always()
        run: |
          set -u -o pipefail

          echo "Snapshot of current state keys that match 'd1':"
          STATE_KEYS="$(terraform state list | grep -E '^cloudflare_d1_database\.' || true)"
          if [ -z "${STATE_KEYS}" ]; then
            echo "  (no D1 resources present — nothing to remove, step no-op)"
          else
            echo "${STATE_KEYS}"
            for KEY in cloudflare_d1_database.decision_db cloudflare_d1_database.shared_db; do
              if echo "${STATE_KEYS}" | grep -Fxq "${KEY}"; then
                echo "Removing ${KEY} ..."
                terraform state rm "${KEY}"
                echo "  ... removed."
              else
                echo "Skipping ${KEY} (not present in state)."
              fi
            done
          fi

          echo
          echo "State D1 keys after cleanup:"
          terraform state list | grep -E '^cloudflare_d1_database\.' || echo "(no D1 resources in state)"

      - name: Plan
        id: plan
        run: |
          if [ -f terraform.tfvars ]; then
            terraform plan -input=false -out=tfplan.binary -var-file=terraform.tfvars
          else
            terraform plan -input=false -out=tfplan.binary
          fi

      - name: Render plan to JSON artifact
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Render human-readable plan summary
        run: terraform show tfplan.binary | tee tfplan-summary.txt

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.sha }}
          path: |
            infrastructure/terraform/tfplan.json
            infrastructure/terraform/tfplan-summary.txt
          retention-days: 30

  # -------------------------------------------------------------
  # Phase 3 — Apply (NEVER automatic — requires manual approval)
  # -------------------------------------------------------------
  apply:
    name: Apply (main · 1-click prod-env approval)
    needs: plan
    # ==============================================================
    # SINGLE CLICK FLOW for terraform apply.
    #
    # The ONLY code-level gate is branch-based: main-only apply.
    # The *human* gate is the `production` GitHub Environment
    # Required-reviewers deployment protection rule (see block
    # below): on push to main the apply job is created but pauses
    # immediately at ⏳ WAITING until a reviewer on the production
    # environment clicks Approve & deploy from the banner at the
    # top of the SAME run page — that is the ONE manual click.
    #
    # ⚠️ DEPENDENCY ON REPO SETTINGS:
    #    If the `production` Environment has NO Required reviewers
    #    configured (or doesn't exist), the job proceeds without
    #    pausing → terraform apply runs on EVERY push to main,
    #    causing the same auto-run incident seen on run #52.
    #    Follow the MANDATORY REPO CONFIG steps in the header
    #    comment (Settings → Environments) BEFORE merging.
    # ==============================================================
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One-click human approval gate.  MUST be paired with the
    # MANDATORY repo-level Environment protection config in
    # Settings → Environments → production → Required reviewers.
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: infrastructure/terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}

      - name: Download previous plan artifacts (if available)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: tfplan-${{ github.sha }}
          path: infrastructure/terraform/

      - name: Init (B2 remote state backend config is static in versions.tf)
        run: terraform init -input=false

      - name: Apply saved plan or fresh plan
        run: |
          if [ -f tfplan.binary ]; then
            echo ">>> Applying PREVIOUSLY REVIEWED plan (from Phase 2 of the SAME run) — plan reviewed in UI = plan applied <<<"
            terraform apply -input=false tfplan.binary
          else
            echo ">>> Saved plan not found — generating fresh plan and applying <<<"
            if [ -f terraform.tfvars ]; then
              terraform apply -input=false -auto-approve -var-file=terraform.tfvars
            else
              terraform apply -input=false -auto-approve
            fi
          fi

      - name: Print outputs (resource IDs / names for human review)
        run: |
          echo "--- Terraform Outputs (resources created / updated) ---"
          terraform output -json || true
          echo "--- End Outputs ---"
