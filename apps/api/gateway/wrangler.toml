# Gateway Worker — public entry point.
#
# ============================================================
# HYBRID ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform (infrastructure/terraform/main.tf) CREATES & GOVERNS:
#       - Worker name, compatibility_date/flags, tags
#       - Service Bindings (USER_SERVICE / GRAPH_SERVICE / etc.)
#       - KV namespaces JWT_BLACKLIST + RATE_LIMIT
#       - Worker Domain (api.ontodecide.com, zone_id required)
#       - lifecycle.ignore_changes on content / bindings so
#         Terraform never rolls back Wrangler-deployed code
#   • Wrangler (deploy-workers.yml) deploys:
#       - Worker script code (src/index.ts bundle)
#       - [vars] plain-text environment variables
#       - JWT_SECRET runtime secret (via wrangler-action secrets:)
# ============================================================
#
# Identity model:
#   • This Gateway is the **sole** verifier of inbound Bearer JWTs. It holds
#     JWT_SECRET; downstream workers do NOT. Downstream workers trust the
#     identity headers (x-tenant-id, x-user-id, x-user-role) and the
#     x-internal-call marker injected here.
#   • Downstream calls go via **Service Bindings** (`[[services]]`), not
#     public HTTP URLs — zero extra-network cost, no external-request
#     billing, implicit in-account trust.
#
# Build & deploy:
#   • [build] block is LOCAL ONLY. Canonical deploys use wrangler-action in
#     .github/workflows/deploy-workers.yml (push to main).
#   • `main = "src/index.ts"` lets wrangler bundle via its esbuild pipeline
#     and resolve @ontodecide/shared via package.json exports → dist.

name = "decision-gateway"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/gateway exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/gateway"

# Non-secret runtime variables.
[vars]
AI_DEFAULT_PROVIDER = "workers-ai"

# ----- Service Bindings ---------------------------------------------------
#
# Gateway routes every /api/* request to one of these 5 downstream Workers.
# Each `service` field MUST match local.workers[X].worker_name declared in
# infrastructure/terraform/main.tf — Terraform pre-creates these bindings,
# but wrangler.toml declares them so `wrangler types` generates accurate
# Environment TS types (compile-time drift detection).
[[services]]
binding = "USER_SERVICE"
service = "decision-user-service"

[[services]]
binding = "GRAPH_SERVICE"
service = "decision-graph-service"

[[services]]
binding = "INGESTION_SERVICE"
service = "decision-ingestion-service"

[[services]]
binding = "AI_SERVICE"
service = "decision-ai-service"

[[services]]
binding = "CLEANUP_SERVICE"
service = "decision-cleanup-service"

# Secrets (set via Dashboard → Worker → Secrets, CI, or `wrangler secret put`):
#   JWT_SECRET           — 32+ byte HMAC signing key.
#                          **ONLY Gateway + User Service hold this secret.**
#                          Downstream services rely on injected headers.

# ----- KV Namespaces (Terraform-managed) ----------------------------------
# Binding names MUST match local.kv_binding_map in main.tf.
# DO NOT OMIT `id` — if you do, wrangler auto-creates a DUPLICATE namespace
# parallel to the Terraform-managed one.
#
# How to populate `id` after first `terraform apply`:
#   1. Run:  terraform -chdir=infrastructure/terraform output kv_namespaces
#   2. Log into Cloudflare Dashboard → Workers KV → click the namespace
#      named "${project_name}-${BINDING}-${environment}"
#   3. Copy the Namespace ID and paste into the `id` field below.
#
# For local dev (`wrangler dev` / `wrangler types`) you can leave the
# REPLACE_WITH_* placeholder; validation occurs at Worker startup and
# during the CI Gate 4 (`wrangler types` followed by typecheck).
[[kv_namespaces]]
binding = "JWT_BLACKLIST"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_JWT_BLACKLIST_ID"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_RATE_LIMIT_ID"
