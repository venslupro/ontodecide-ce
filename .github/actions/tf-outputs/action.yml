# ============================================================================
# Read Terraform outputs → masked job env vars
#
# Reads outputs straight from the remote state object in B2 (S3 API +
# jq) — no `terraform init`, no provider downloads. Terraform owns the
# values; deploy.yml consumes them and hands them to wrangler-action
# `secrets:`, so Worker Secrets are written together with the code in a
# single deploy (works on first deploy too — no Worker has to pre-exist).
#
# Secret values are registered with ::add-mask:: BEFORE they are exported
# (NEO4J_URI / NEO4J_USERNAME are not secret and stay readable in logs),
# and only the groups a job asks for are exported (least privilege).
#
# Exported env vars:
#   b2: 'true'    → B2_KEY_ID, B2_KEY           (b2_worker_key output)
#   neo4j: 'true' → NEO4J_PASSWORD, NEO4J_URI, NEO4J_USERNAME
#                   (neo4j_password + neo4j_instance outputs)
# ============================================================================
name: Terraform outputs
description: Export selected Terraform outputs from B2 remote state as masked env vars.

inputs:
  state-key-id:
    description: B2 key ID with read access to the state bucket.
    required: true
  state-key:
    description: B2 application key paired with state-key-id.
    required: true
  b2:
    description: Export the B2 worker key (B2_KEY_ID / B2_KEY).
    default: 'false'
  neo4j:
    description: Export Neo4j credentials (NEO4J_PASSWORD / NEO4J_URI / NEO4J_USERNAME).
    default: 'false'

runs:
  using: composite
  steps:
    - name: Read outputs from Terraform state
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.state-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.state-key }}
        AWS_DEFAULT_REGION: us-east-005
        # B2's S3 API rejects the default CRC checksum headers of newer
        # AWS CLI releases — only send/verify checksums when required.
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        # Must match the backend "s3" block in infrastructure/terraform/versions.tf.
        STATE_URI: s3://ontodecide-prd-tf-state/ontodecide/terraform.tfstate
        STATE_ENDPOINT: https://s3.us-east-005.backblazeb2.com
        WANT_B2: ${{ inputs.b2 }}
        WANT_NEO4J: ${{ inputs.neo4j }}
      run: |
        set -euo pipefail

        #######################################
        # Exports a value to later steps of this job. Uses the heredoc form
        # of GITHUB_ENV with a random delimiter so values containing
        # newlines or '=' cannot inject extra vars.
        # Arguments:
        #   Env var name.
        #   Value (must be non-empty).
        #######################################
        export_plain() {
          local name="$1"
          local value="$2"
          local delimiter
          if [[ -z "${value}" ]]; then
            printf '::error::Terraform output for %s is empty. ' "${name}"
            printf 'Run terraform.yml apply first.\n'
            return 1
          fi
          delimiter="EOF_$(openssl rand -hex 16)"
          printf '%s<<%s\n%s\n%s\n' \
            "${name}" "${delimiter}" "${value}" "${delimiter}" \
            >> "${GITHUB_ENV}"
        }

        #######################################
        # Masks a secret value, then exports it (see export_plain).
        # ::add-mask:: only covers a single line, so each line is masked.
        # Arguments:
        #   Env var name.
        #   Value (must be non-empty).
        #######################################
        export_masked() {
          local line
          while IFS= read -r line; do
            if [[ -n "${line}" ]]; then
              printf '::add-mask::%s\n' "${line}"
            fi
          done <<< "$2"
          export_plain "$1" "$2"
        }

        #######################################
        # Prints one Terraform output from the state JSON, or "" if absent.
        # Arguments:
        #   jq path below .outputs, e.g. "neo4j_password.value".
        #######################################
        tf_output() {
          jq -r ".outputs.$1 // empty" <<< "${STATE_JSON}"
        }

        if ! STATE_JSON="$(aws s3 cp "${STATE_URI}" - \
            --endpoint-url "${STATE_ENDPOINT}" --only-show-errors)"; then
          echo "::error::Cannot read Terraform state — check the B2 state key."
          exit 1
        fi

        if [[ "${WANT_B2}" == "true" ]]; then
          export_masked B2_KEY_ID \
            "$(tf_output 'b2_worker_key.value.application_key_id')"
          export_masked B2_KEY \
            "$(tf_output 'b2_worker_key.value.application_key')"
        fi
        if [[ "${WANT_NEO4J}" == "true" ]]; then
          export_masked NEO4J_PASSWORD "$(tf_output 'neo4j_password.value')"
          export_plain NEO4J_URI \
            "$(tf_output 'neo4j_instance.value.connection_url')"
          export_plain NEO4J_USERNAME \
            "$(tf_output 'neo4j_instance.value.username')"
        fi
        unset STATE_JSON
