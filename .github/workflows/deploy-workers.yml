# ============================================================
# Deploy Cloudflare Workers — Application Logic Layer
#
# The APPLICATION pillar of the hybrid "Shift Left" architecture.
# Resource bindings (D1 / KV / Queue / Service Bindings / Cron /
# Domains) are LOCKED by Terraform (terraform.yml) — this workflow
# only ships CODE + RUNTIME SECRETS, fast and incrementally.
#
# CHANGE-AWARE DEPLOY (new in hybrid model):
#   A "detect-changes" job uses `dorny/paths-filter` to compute
#   WHICH of the 6 services actually have source changes vs the
#   last main commit.  Only those services enter the deploy
#   matrix.  If nothing changed, the workflow short-circuits.
#
# EXPLICIT SERVICE OVERRIDE:
#   `workflow_dispatch` accepts an optional comma-separated list
#   of service names to force-deploy regardless of diff.
#
# QUALITY GATES (per-service, inside the matrix):
#   1. typecheck  — `pnpm turbo run typecheck --filter=<pkg>`
#   2. lint       — `pnpm turbo run lint --filter=<pkg>`
#   3. test       — `pnpm turbo run test --filter=<pkg>`
#   4. wrangler types — regenerate binding types & validate that
#                       wrangler.toml bindings match code-side
#                       TypeScript declarations at compile time
#                       (catches Terraform ↔ code drift EARLY).
#   5. build      — emits worker bundle for wrangler.
#
# SECRET DISTRIBUTION (unchanged per DDD boundary rule):
#   JWT_SECRET → Gateway + User only.  Downstream services read
#   x-tenant-id / x-user-role / x-internal-call from Gateway.
#
# REQUIRED GITHUB SECRETS (unchanged):
#   CF_API_TOKEN      — Workers Scripts Edit + D1 Edit
#   CF_ACCOUNT_ID     — Cloudflare Account ID (32 hex)
#   JWT_SECRET        — gateway + user
#   EMAIL_API_KEY     — user
#   NEO4J_PASSWORD    — graph + cleanup
#   B2_KEY_ID / B2_KEY — ingestion + cleanup
#   OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY /
#     OPENROUTER_API_KEY / AI_GATEWAY_TOKEN — ai (all optional)
# ============================================================

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      services:
        description: |
          Comma-separated services to force-deploy (ignores diff).
          Leave empty for auto-detect.  Example: gateway,user,ai
        required: false
        default: ''
      environment:
        description: 'Target environment (passed to wrangler as TAG info only; resources are Terraform-managed)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

# ------------------------------------------------------------------
# DEFAULTS_MATRIX — single source of truth for the 6 API services.
# Add new services (e.g. `web`) HERE ONLY; the rest of the workflow
# reads this list dynamically.
# ------------------------------------------------------------------
env:
  DEFAULTS_MATRIX_JSON: >-
    [
      {"name":"gateway",   "config":"apps/api/gateway/wrangler.toml",     "package":"@ontodecide/gateway",   "src_paths":["apps/api/gateway/**","packages/shared/**"]},
      {"name":"user",      "config":"apps/api/user/wrangler.toml",        "package":"@ontodecide/user",      "src_paths":["apps/api/user/**","packages/shared/**"]},
      {"name":"graph",     "config":"apps/api/graph/wrangler.toml",       "package":"@ontodecide/graph",     "src_paths":["apps/api/graph/**","packages/shared/**"]},
      {"name":"ingestion", "config":"apps/api/ingestion/wrangler.toml",   "package":"@ontodecide/ingestion", "src_paths":["apps/api/ingestion/**","packages/shared/**"]},
      {"name":"ai",        "config":"apps/api/ai/wrangler.toml",          "package":"@ontodecide/ai",        "src_paths":["apps/api/ai/**","packages/shared/**"]},
      {"name":"cleanup",   "config":"apps/api/cleanup/wrangler.toml",     "package":"@ontodecide/cleanup",   "src_paths":["apps/api/cleanup/**","packages/shared/**"]}
    ]

jobs:
  # ----------------------------------------------------------------
  # Job 0 — Compute deploy set (change-detect OR explicit override)
  # ----------------------------------------------------------------
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.compute.outputs.matrix_json }}
      has_changes: ${{ steps.compute.outputs.has_changes }}
    steps:
      - name: Checkout (full history for paths-filter)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Expand DEFAULTS_MATRIX_JSON into a list of `paths-filter`
      # rules, one per service.  Each rule uses the service's
      # declared src_paths (includes transitive shared/ dep).
      - name: Build paths-filter ruleset + run detection
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: 'none'
          filters: |
            gateway:
              - 'apps/api/gateway/**'
              - 'packages/shared/**'
            user:
              - 'apps/api/user/**'
              - 'packages/shared/**'
            graph:
              - 'apps/api/graph/**'
              - 'packages/shared/**'
            ingestion:
              - 'apps/api/ingestion/**'
              - 'packages/shared/**'
            ai:
              - 'apps/api/ai/**'
              - 'packages/shared/**'
            cleanup:
              - 'apps/api/cleanup/**'
              - 'packages/shared/**'
            workflow:
              - '.github/workflows/deploy-workers.yml'

      # Build final matrix:
      #   • If user provided workflow_dispatch `services` → parse CSV
      #     and use those (force-deploy mode).
      #   • Else if `workflow` file changed → deploy ALL services
      #     (pipeline change needs re-verify across fleet).
      #   • Else → deploy only services paths-filter flagged as true.
      #
      # Outputs:
      #   matrix_json  — JSON array of {name,config,package,src_paths}
      #   has_changes  — "true" if matrix_json != [] (controls skip)
      - name: Compute final deploy matrix
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          ALL="$DEFAULTS_MATRIX_JSON"

          FORCE_SVC="${{ github.event.inputs.services }}"
          WORKFLOW_CHANGED="${{ steps.filter.outputs.workflow }}"

          if [ -n "$FORCE_SVC" ]; then
            echo ">>> workflow_dispatch: force-deploy list = [$FORCE_SVC]"
            # Split CSV, trim spaces, dedupe
            IFS=',' read -ra ARR <<< "$FORCE_SVC"
            NAMES=()
            for raw in "${ARR[@]}"; do
              clean="$(echo "$raw" | xargs)"
              [ -n "$clean" ] && NAMES+=("$clean")
            done
          elif [ "$WORKFLOW_CHANGED" = "true" ]; then
            echo ">>> deploy-workers.yml itself changed — deploying ALL 6 services"
            NAMES=(gateway user graph ingestion ai cleanup)
          else
            echo ">>> Using paths-filter diff results"
            NAMES=()
            for svc in gateway user graph ingestion ai cleanup; do
              val="$(echo '${{ toJSON(steps.filter.outputs) }}' | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('$svc','false'))" 2>/dev/null || echo "false")"
              if [ "$val" = "true" ]; then
                NAMES+=("$svc")
              fi
            done
          fi

          echo "Services selected for deploy: ${NAMES[*]:-(none)}"

          if [ ${#NAMES[@]} -eq 0 ]; then
            echo "matrix_json=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Filter DEFAULTS_MATRIX_JSON down to selected names
          RESULT="$(python3 -c "
          import sys, json
          all_items = json.loads('''$ALL''')
          wanted = set(sys.argv[1:])
          out = [it for it in all_items if it['name'] in wanted]
          # Preserve the declared ordering from DEFAULTS_MATRIX_JSON
          print(json.dumps(out, separators=(',',':')))
          " "${NAMES[@]}")"

          echo "matrix_json=$RESULT" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Job 1 — Per-service parallel deploy (Quality Gates + Wrangler)
  #         Runs ONLY for changed services, in parallel, fail-fast=false.
  # ----------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix_json) }}

    # Map ALL GitHub Secrets → env vars (secrets context is NOT
    # available inside strategy.matrix, so we inject at job level
    # and read from env in `prepare_secrets` step).
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_KEY: ${{ secrets.B2_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---- Toolchain (byte-equivalent to workers-builds image) ----
      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # =============================================================
      # QUALITY GATES — per-service, runs BEFORE deploy.
      # Fails fast if this service (or its shared deps) don't meet
      # standards.  All gates use `turbo run --filter=<pkg>` so
      # shared/ is typechecked / linted / tested as a transitive
      # dependency exactly once per cache key.
      # =============================================================

      # Gate 1: TypeScript typecheck (tsc --noEmit)
      - name: Gate 1 · Typecheck ${{ matrix.service.name }}
        run: pnpm turbo run typecheck --filter=${{ matrix.service.package }}

      # Gate 2: ESLint (source + tests)
      - name: Gate 2 · Lint ${{ matrix.service.name }}
        run: pnpm turbo run lint --filter=${{ matrix.service.package }}

      # Gate 3: Unit tests (vitest)
      - name: Gate 3 · Test ${{ matrix.service.name }}
        run: pnpm turbo run test --filter=${{ matrix.service.package }}

      # Gate 4: `wrangler types` — compiles wrangler.toml bindings
      #         into worker-configuration.d.ts, then runs a tsc
      #         pass over the service again.  This catches:
      #           • binding names that drift between Terraform +
      #             wrangler.toml + TypeScript code
      #           • missing D1 / KV / Queue IDs referenced from code
      #           • [vars] declared in wrangler.toml but not read
      #             via Env interface (or vice versa)
      - name: Gate 4 · wrangler types + re-typecheck ${{ matrix.service.name }}
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="${{ matrix.service.config }}"
          # Regenerate binding typings from wrangler.toml →
          # worker-configuration.d.ts (the "Environment contract").
          npx wrangler types --config "$CONFIG"
          # Re-run typecheck so tsc validates the freshly-generated
          # binding types against the service's code.
          pnpm turbo run typecheck --filter=${{ matrix.service.package }}

      # Gate 5: Build the worker bundle (shared/ transitive dist
      #         emitted by turbo, picked up by wrangler's esbuild)
      - name: Gate 5 · Build ${{ matrix.service.name }}
        run: pnpm turbo run build --filter=${{ matrix.service.package }}

      # ------------------------------------------------------------
      # NOTE: The OLD workflow had a giant "Ensure Cloudflare
      #       resources" shell step here (wrangler d1 create /
      #       queues create).  We REMOVED it completely — those
      #       long-lived resources are now the exclusive
      #       responsibility of Terraform (terraform.yml).
      #
      #       If a resource binding is missing at deploy time,
      #       wrangler deploy will FAIL LOUDLY — that is the
      #       intended signal to run `terraform apply` first.
      # ------------------------------------------------------------

      # ---- Build secrets list for wrangler-action ----
      # wrangler-action@v3 expects NAMES (one per line).  Values
      # are read from process.env (job-level `env:` above).
      # Optional third-party LLM keys are skipped if empty.
      - name: Prepare secrets for ${{ matrix.service.name }}
        id: prepare_secrets
        shell: bash
        run: |
          all_names=()
          case "${{ matrix.service.name }}" in
            gateway)
              all_names=("JWT_SECRET") ;;
            user)
              all_names=("JWT_SECRET" "EMAIL_API_KEY") ;;
            graph)
              all_names=("NEO4J_PASSWORD") ;;
            ingestion)
              all_names=("B2_KEY_ID" "B2_KEY") ;;
            ai)
              all_names=("OPENAI_API_KEY" "ANTHROPIC_API_KEY" "GOOGLE_API_KEY" "OPENROUTER_API_KEY" "AI_GATEWAY_TOKEN") ;;
            cleanup)
              all_names=("NEO4J_PASSWORD" "B2_KEY_ID" "B2_KEY") ;;
          esac
          names=()
          for name in "${all_names[@]}"; do
            val="${!name}"
            if [ -n "$val" ]; then
              names+=("$name")
            else
              echo "WARNING: $name is not set — skipping. Worker will validate at runtime."
            fi
          done
          {
            echo "secrets<<EOF"
            if [ ${#names[@]} -gt 0 ]; then
              printf '%s\n' "${names[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ---- DEPLOY: wrangler deploy via official action ----
      # Resource bindings (D1 / KV / Queue / Service / Cron) are
      # READ FROM wrangler.toml AND Terraform-created Dashboard
      # overrides — Wrangler does NOT (re)create resources here.
      - name: Deploy ${{ matrix.service.name }} (code + secrets only)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config ${{ matrix.service.config }}
          secrets: ${{ steps.prepare_secrets.outputs.secrets }}

  # ----------------------------------------------------------------
  # Job 2 — Post-deploy: apply D1 migrations to shared decision-db.
  #         Runs ONCE after all changed Workers successfully deploy.
  #         SKIPS entirely if no services deployed this run.
  #
  #         D1 name = "${PROJECT_NAME}-${ENV_SHORT}-decision-db"
  #         Must match Terraform cloudflare_d1_database.decision_db.name.
  # ----------------------------------------------------------------
  migrate-d1:
    name: Apply D1 Migrations (remote)
    needs: [detect-changes, deploy]
    if: |
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # ---- D1 name resolution (matches Terraform variables.tf) ----
      # Project name = GitHub repo name; environment defaults to production.
      PROJECT_NAME: ${{ github.event.repository.name }}
      ENVIRONMENT:  ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Print migration target (diagnostic)
        run: |
          echo "PROJECT_NAME = ${PROJECT_NAME}"
          echo "ENVIRONMENT  = ${ENVIRONMENT}"
          echo "Target D1    = (computed by migrate.sh — run --dry-run below)"
          ./scripts/migrate.sh --env "${ENVIRONMENT}" --dry-run

      - name: Apply D1 migrations (remote — idempotent, no-ops if current)
        run: ./scripts/migrate.sh --env "${ENVIRONMENT}" --remote
