# ============================================================
# Terraform Deploy Workflow
#
# Backblaze B2 has replaced Cloudflare R2 for ALL object storage
# in this project: business-data buckets (ingestion-staging +
# tenant-archive) AND the Terraform remote-state bucket all live
# in B2 now.
#
# Follows Backblaze + Cloudflare official Terraform best practices:
#
#   1. Provider auth  →  CLOUDFLARE_API_TOKEN env var
#                        (never written to config / tfvars)
#   2. State backend  →  Backblaze B2 (remote S3-compatible)
#                        credentials via AWS_ACCESS_KEY_ID /
#                        AWS_SECRET_ACCESS_KEY env vars
#                        (the bundled HashiCorp AWS SDK inside
#                        Terraform's backend "s3" hard-codes
#                        those variable names)
#   3. Input vars     →  TF_VAR_* env variables (standard
#                        Terraform mechanism; no auto.tfvars file)
#   4. Environments   →  separate accounts + separate B2 state
#                        bucket keys per env
#   5. Secrets        →  all from GitHub Secrets / a secret store
#                        such as Vault, per Cloudflare guidance
#
# Two-stage pipeline:
#   Stage 1 "plan"  — automatic on every branch. Produces a
#                     plan artifact + human-readable diff.
#                     On PRs / forks WITHOUT the full secret
#                     set, the Plan is gracefully SKIPPED
#                     (informs the reviewer but does not fail
#                     the check; Build/Lint/Test CI still runs).
#   Stage 2 "apply" — requires manual approval via the
#                     "production" GitHub Environment. Never runs
#                     unless someone explicitly clicks
#                     "Approve and deploy" in the Actions UI.
#                     Restricted to `main` branch only.
#
# To run Stage 2 after a successful Stage 1:
#   1. Open the completed workflow run in GitHub → Actions.
#   2. Click the paused "production" environment card.
#   3. Review the plan output → click "Approve and deploy".
#   4. The "Apply" job begins automatically.
# ============================================================

name: Terraform Deploy

on:
  # ------------------------------------------------------------------
  #   • terraform PLAN  → may run on EVERY branch (for PR authors to
  #                        preview resource changes before merging).
  #   • terraform APPLY → still restricted to the main branch ONLY
  #                      (the job-level gate enforces that separately).
  # ------------------------------------------------------------------
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment name (sets the B2 state key prefix)."
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  # ---- Shared configuration ----
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: "infrastructure/terraform"
  # B2 bucket created manually (first-time setup in main.tf docs):
  #   B2 Dashboard → Buckets → ontodecide-terraform-state
  # B2 bucket names are GLOBALLY unique (not account-scoped).
  TF_STATE_BUCKET: "ontodecide-terraform-state"

# ============================================================
# Required repository setup (Settings → Secrets and variables
# → Actions)
#
# SECRETS (Settings → Secrets and variables → Actions → Secrets):
# ─────────────────────────────────────────────────────────────
#   CLOUDFLARE_API_TOKEN
#       Cloudflare API token with these permissions:
#         Account.Account Settings:Read
#         D1:Edit
#         Workers KV Storage:Edit
#         Workers Queues:Edit
#         Workers Scripts:Edit
#         Workers AI:Read
#
#   CLOUDFLARE_ACCOUNT_ID
#       (Optional — only if the token lacks Account List scope)
#       Cloudflare numeric Account ID.
#
#   TF_VAR_jwt_secret
#       Shared JWT signing secret (>= 32 random bytes).
#
#   TF_VAR_neo4j_password
#       Neo4j AuraDB password.
#
#   TF_VAR_cloudflare_account_id_or_workers_dev
#       Workers.dev subdomain prefix, e.g. "myteam-a1b2".
#
#   TF_B2_STATE_KEY_ID
#       B2 Application Key keyID used for the Terraform state
#       backend ONLY. Bucket-scoped (Read & Write) on
#       ontodecide-terraform-state. Created in B2 Dashboard
#       → App Keys → Add Application Key. This value maps to
#       AWS_ACCESS_KEY_ID env var for Terraform's bundled SDK.
#
#   TF_B2_STATE_APPLICATION_KEY
#       Matching B2 applicationKey for state backend. Maps to
#       AWS_SECRET_ACCESS_KEY env var.
#
#   TF_VAR_b2_application_key_id
#       B2 Application Key keyID for business-data buckets
#       (ingestion-staging + tenant-archive). Can be a single
#       key with Read & Write on both buckets, or a key scoped
#       per bucket. Created in B2 Dashboard → App Keys.
#
#   TF_VAR_b2_application_key
#       Matching B2 applicationKey for business-data buckets.
#
# VARIABLES (Settings → Secrets and variables → Actions → Variables):
# ─────────────────────────────────────────────────────────────
#   TF_VAR_neo4j_url
#       e.g. "https://neo4j+s://xxxxxxxx.databases.neo4j.io"
#
#   TF_VAR_cloudflare_account_id
#       (Optional — override via Variable if you don't want to
#        create a second secret for it.)
#
#   TF_VAR_b2_region
#       Backblaze B2 region code, e.g. "us-west-004".
#       Find it in B2 dashboard → Buckets → bucket details.
#       Used for BOTH the provider configuration AND the
#       backend endpoint (s3.<region>.backblazeb2.com).
#
#   TF_VAR_default_provider   (optional)
#   TF_VAR_workers_ai_model   (optional)
#
# ENVIRONMENT (Settings → Environments → New environment):
# ─────────────────────────────────────────────────────────────
#   Create an environment named "production" and enable
#   "Required reviewers". Add the people or teams allowed to
#   approve a production apply.
# ============================================================

jobs:
  # ================================================================
  # Stage 1 — Plan (automatic, no approval)
  #
  # Graceful-skip behaviour:
  #   If any credential required to reach the remote state is
  #   missing (typical on first-time contributor forks / PR
  #   branches without secrets), we produce an informative
  #   GITHUB_STEP_SUMMARY note, upload an empty plan stub, set
  #   changed=false, and exit 0 — so the PR check does not
  #   fail. The Build/Lint/Test CI still gives full validation.
  # ================================================================
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-artifact: tfplan-${{ github.sha }}
      changed: ${{ steps.plan-summary.outputs.changed }}
      skipped: ${{ steps.creds-check.outputs.skipped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Terraform install ----
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # ---- Credential preflight + graceful skip gate ----
      - name: Check state-backend credentials (skip Plan if missing)
        id: creds-check
        env:
          TF_B2_STATE_KEY_ID:          ${{ secrets.TF_B2_STATE_KEY_ID }}
          TF_B2_STATE_APPLICATION_KEY: ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          TF_VAR_b2_region:            ${{ vars.TF_VAR_b2_region }}
        run: |
          set +e
          missing=()
          [ -z "${TF_B2_STATE_KEY_ID}" ]          && missing+=("TF_B2_STATE_KEY_ID (B2 Application Key keyID for ontodecide-terraform-state bucket)")
          [ -z "${TF_B2_STATE_APPLICATION_KEY}" ] && missing+=("TF_B2_STATE_APPLICATION_KEY (matching B2 applicationKey)")
          [ -z "${TF_VAR_b2_region}" ]            && missing+=("TF_VAR_b2_region Variable (B2 region code, e.g. us-west-004)")
          set -e

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::notice::Terraform state-backend credentials missing. Skipping Plan gracefully for this run. Missing: $(IFS=, ; echo "${missing[*]}")"
            {
              echo "### Terraform Plan — Skipped (credentials not available)"
              echo ""
              echo "This branch / fork does not have the GitHub Secrets required"
              echo "to connect to the Backblaze B2 Terraform state bucket."
              echo ""
              echo "Missing secret / variable:"
              for m in "${missing[@]}"; do
                echo "- \`${m}\`"
              done
              echo ""
              echo "**What this means:**"
              echo "- No infrastructure diff can be previewed from this run."
              echo "- The Build/Lint/Test CI job still provides full code-quality"
              echo "  validation for this PR."
              echo "- After merging to \`main\`, the Plan + Apply jobs will run"
              echo "  with the production credentials configured on the repo."
              echo ""
              echo "**To configure (repo owner only):** follow the detailed"
              echo "instructions in the header of \`.github/workflows/terraform-deploy.yml\`"
              echo "or in \`infrastructure/terraform/main.tf\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Terraform init with B2 remote backend ----
      #
      # The backend "s3" block in main.tf is intentionally
      # partial — we inject the real B2 credentials HERE via
      # the STANDARD AWS SDK environment variables. This is the
      # OFFICIAL recommended mechanism per Backblaze's
      # Terraform integration guide, and places the credentials
      # at the very TOP of the AWS credential provider chain.
      #
      # AWS_EC2_METADATA_DISABLED=true tells the bundled AWS SDK
      # to NOT fall through to EC2 IMDS lookups on GitHub
      # Actions runners (which are not on AWS — IMDS always
      # fails and used to mask the REAL error when credentials
      # were missing).
      #
      # Non-secret backend options (bucket, key, endpoints.s3)
      # are passed via `-backend-config=FILE` form, because the
      # dotted CLI form cannot handle nested HCL object attrs.
      - name: Terraform Init (B2 backend)
        if: steps.creds-check.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          # ──────────────────────────────────────────────────────
          # [1] Cloudflare Terraform provider — official env vars
          # ──────────────────────────────────────────────────────
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # ──────────────────────────────────────────────────────
          # [2] B2 remote STATE backend auth — uses AWS SDK env
          #     vars because Terraform's backend "s3" ships with a
          #     BUNDLED HashiCorp AWS SDK that only accepts those
          #     env var names.
          #
          #     ⚠️  NOT AN AWS COMMITMENT — ZERO AWS RESOURCES.
          #     ─────────────────────────────────────────────────
          #     The AWS_-prefixed naming is imposed by Terraform.
          #     The actual secret values are:
          #       AWS_ACCESS_KEY_ID     ← B2 App Key keyID
          #                              (ontodecide-terraform-state)
          #       AWS_SECRET_ACCESS_KEY ← B2 App Key secret
          #     AWS_DEFAULT_REGION       ← B2 region, e.g. us-west-004
          # ──────────────────────────────────────────────────────
          AWS_ACCESS_KEY_ID:            ${{ secrets.TF_B2_STATE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:        ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          AWS_DEFAULT_REGION:           ${{ vars.TF_VAR_b2_region }}
          AWS_EC2_METADATA_DISABLED:    true

          # Non-secret init inputs (shell variables used in run block)
          B2_REGION:  ${{ vars.TF_VAR_b2_region }}
          ENV:        ${{ github.event.inputs.environment || 'production' }}
        run: |
          STATE_KEY="${ENV}/terraform.tfstate"
          B2_ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"

          # FILE-based backend config (not KEY=VALUE — see main.tf
          # docs for the reasoning: nested HCL objects cannot be
          # reliably passed via CLI flags).
          BACKEND_CFG_FILE="backend-config-overrides.tfvars"

          cat > "${BACKEND_CFG_FILE}" <<'EOF'
          bucket     = "__TF_STATE_BUCKET__"
          key        = "__STATE_KEY__"
          endpoints = {
            s3 = "__B2_ENDPOINT__"
          }
          EOF

          sed -i \
            -e "s|__TF_STATE_BUCKET__|${TF_STATE_BUCKET}|g" \
            -e "s|__STATE_KEY__|${STATE_KEY}|g" \
            -e "s|__B2_ENDPOINT__|${B2_ENDPOINT}|g" \
            "${BACKEND_CFG_FILE}"

          echo "--- backend-config-overrides.tfvars ---"
          cat "${BACKEND_CFG_FILE}"
          echo "---------------------------------------"

          terraform init \
            -input=false \
            -backend-config="${BACKEND_CFG_FILE}"

      # ---- Terraform validate (only if init ran) ----
      - name: Terraform Validate
        if: steps.creds-check.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform validate

      # ---- Terraform plan ----
      - name: Terraform Plan
        id: plan
        if: steps.creds-check.outputs.skipped == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          # Provider auth
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Input variables — secrets
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_neo4j_password: ${{ secrets.TF_VAR_neo4j_password }}
          TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          # Backblaze B2 credentials (S3-compatible) for business buckets
          TF_VAR_b2_application_key_id: ${{ secrets.TF_VAR_b2_application_key_id }}
          TF_VAR_b2_application_key: ${{ secrets.TF_VAR_b2_application_key }}
          # Input variables — non-sensitive
          TF_VAR_neo4j_url: ${{ vars.TF_VAR_neo4j_url }}
          TF_VAR_cloudflare_account_id: ${{ vars.TF_VAR_cloudflare_account_id }}
          TF_VAR_b2_region: ${{ vars.TF_VAR_b2_region }}
          TF_VAR_default_provider: ${{ vars.TF_VAR_default_provider }}
          TF_VAR_workers_ai_model: ${{ vars.TF_VAR_workers_ai_model }}
          ENV_TAG: ${{ github.event.inputs.environment || 'production' }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan.binary \
            -var="environment=${ENV_TAG}"
          terraform show -json tfplan.binary > tfplan.json

      # ---- Upload plan artifact for apply stage (or a stub if skipped) ----
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan.binary
            ${{ env.TF_WORKING_DIR }}/tfplan.json
          if-no-files-found: ignore
          retention-days: 7

      # ---- Human-readable change summary ----
      - name: Summarize resource changes
        id: plan-summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ steps.creds-check.outputs.skipped }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ADDS=$(jq '[.resource_changes[]?.change.actions[] | select(. == "create")] | length' tfplan.json)
          UPDATES=$(jq '[.resource_changes[]?.change.actions[] | select(. == "update")] | length' tfplan.json)
          DESTROYS=$(jq '[.resource_changes[]?.change.actions[] | select(. == "delete")] | length' tfplan.json)
          {
            echo "### Terraform Plan Summary"
            echo ""
            echo "| Change type | Count |"
            echo "|---|---|"
            echo "| 🟢 Add      | ${ADDS}    |"
            echo "| 🟡 Update   | ${UPDATES} |"
            echo "| 🔴 Destroy  | ${DESTROYS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          TOTAL=$((ADDS + UPDATES + DESTROYS))
          if [ "$TOTAL" -gt 0 ]; then
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo ":warning: **${TOTAL} resource(s) will change.** Review the plan log before approving apply." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ":white_check_mark: No resource changes. Apply will be a no-op." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ================================================================
  # Stage 2 — Apply (requires manual approval + main branch)
  # ================================================================
  apply:
    name: Terraform Apply  ✅ Manual approval required
    needs: plan
    # Apply is ONLY ever run from `main`, and ONLY after a
    # human explicitly approves the production Environment.
    # If Plan was gracefully skipped (no credentials), we
    # never reach this branch (needs.plan.result would still
    # be success, but the artifact will be empty — the verify
    # step below catches that).
    if: github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.plan.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://dash.cloudflare.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # Reconnect to the B2 backend before we can use the saved plan.
      - name: Terraform Init (B2 backend)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # B2 state backend auth via standard AWS SDK env vars
          AWS_ACCESS_KEY_ID:            ${{ secrets.TF_B2_STATE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:        ${{ secrets.TF_B2_STATE_APPLICATION_KEY }}
          AWS_DEFAULT_REGION:           ${{ vars.TF_VAR_b2_region }}
          AWS_EC2_METADATA_DISABLED:    true
          # Non-secret init inputs
          B2_REGION:  ${{ vars.TF_VAR_b2_region }}
          ENV:        ${{ github.event.inputs.environment || 'production' }}
        run: |
          STATE_KEY="${ENV}/terraform.tfstate"
          B2_ENDPOINT="https://s3.${B2_REGION}.backblazeb2.com"

          BACKEND_CFG_FILE="backend-config-overrides.tfvars"

          cat > "${BACKEND_CFG_FILE}" <<'EOF'
          bucket     = "__TF_STATE_BUCKET__"
          key        = "__STATE_KEY__"
          endpoints = {
            s3 = "__B2_ENDPOINT__"
          }
          EOF

          sed -i \
            -e "s|__TF_STATE_BUCKET__|${TF_STATE_BUCKET}|g" \
            -e "s|__STATE_KEY__|${STATE_KEY}|g" \
            -e "s|__B2_ENDPOINT__|${B2_ENDPOINT}|g" \
            "${BACKEND_CFG_FILE}"

          echo "--- backend-config-overrides.tfvars ---"
          cat "${BACKEND_CFG_FILE}"
          echo "---------------------------------------"

          terraform init \
            -input=false \
            -backend-config="${BACKEND_CFG_FILE}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan-artifact }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Verify plan artifact exists
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ ! -f tfplan.binary ]; then
            echo "::error::Plan artifact is missing. Re-run the 'plan' job and approve apply before the artifact expires (7 days)."
            exit 1
          fi

      # ---- Terraform apply (from saved plan) ----
      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_neo4j_password: ${{ secrets.TF_VAR_neo4j_password }}
          TF_VAR_cloudflare_account_id_or_workers_dev: ${{ secrets.TF_VAR_cloudflare_account_id_or_workers_dev }}
          TF_VAR_b2_application_key_id: ${{ secrets.TF_VAR_b2_application_key_id }}
          TF_VAR_b2_application_key: ${{ secrets.TF_VAR_b2_application_key }}
          TF_VAR_neo4j_url: ${{ vars.TF_VAR_neo4j_url }}
          TF_VAR_cloudflare_account_id: ${{ vars.TF_VAR_cloudflare_account_id }}
          TF_VAR_b2_region: ${{ vars.TF_VAR_b2_region }}
          TF_VAR_default_provider: ${{ vars.TF_VAR_default_provider }}
          TF_VAR_workers_ai_model: ${{ vars.TF_VAR_workers_ai_model }}
          ENV_TAG: ${{ github.event.inputs.environment || 'production' }}
        run: |
          terraform apply -input=false tfplan.binary
