# Deploy (production only). Stages:
#
#   Build → Approve → services (dependency order) → web → smoke
#
# Build runs on every branch (pull requests) and on main: it renders the
# production Wrangler configs from Terraform outputs, dry-runs every Worker
# bundle and builds the web app. Approve and everything after it run only on
# main: one approval (environment `production`), then every service is
# redeployed, each in its own job.
#
# On main it is the last link of the release chain
#
#   push to main → CI → Terraform → Deploy
#
# so services always deploy after the infrastructure for the same commit is
# applied. Also runnable manually (deploys only when run on main).
#
# `needs:` mirrors the service bindings in apps/*/wrangler.jsonc.tpl
# (docs/ARCHITECTURE.md 2.2): a service starts only after everything it
# binds to is live, and services without a dependency between them deploy
# in parallel. If any service fails, no further service starts and the
# rollout stops.
#
# Service bindings:
#   ontology-manager    → (none)
#   object-graph        → ontology-manager
#   situation-awareness → object-graph, ontology-manager
#   decision-engine     → object-graph, situation-awareness, ontology-manager
#   data-integration    → ontology-manager, object-graph
#   identity-access     → TenantLifecycle of the five services above
#   api-gateway         → all six services above
#   web (Pages)         → api-gateway (creates the Pages project if missing;
#                         with APP_DOMAIN: pure static + custom domain)
#   smoke               → web: scripts/smoke.mjs against the production URL
#                         (read-only pre-launch checks; non-blocking)
name: Deploy

on:
  pull_request:
  workflow_run:
    workflows: [Terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read # fail-fast check in .github/actions/deploy-worker
  contents: read

concurrency:
  # Pull requests only build and supersede their own older runs.
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.B2_STATE_KEY_ID || secrets.B2_MASTER_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_STATE_KEY || secrets.B2_MASTER_KEY }}
  # Every render needs the signing key(s): api-gateway's JWT_PUBLIC_KEYS is
  # derived from them (public parts only).
  JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
  JWT_SIGNING_KEY_PREV: ${{ secrets.JWT_SIGNING_KEY_PREV }}
  # identity-access vars (repository variables).
  APP_DOMAIN: ${{ vars.APP_DOMAIN }}
  MAIL_FROM: ${{ vars.MAIL_FROM }}
  EMAIL_MODE: ${{ vars.EMAIL_MODE }}
  # One-time V1.3 → V2.4 schema reset (scripts/d1_migrate.mjs).
  D1_RESET_LEGACY: ${{ vars.D1_RESET_LEGACY }}

jobs:
  build:
    name: Build (prod configs · dry-run)
    # Any branch: pull requests from this repo (forks get no secrets), manual
    # runs, and the main release chain (Terraform started by CI).
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CI passed for this commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ci="$(gh run list --workflow ci.yml --commit "${SHA}" --event push \
            --limit 1 --json conclusion --jq '.[0].conclusion // "none"')"
          echo "CI for ${SHA}: ${ci}" >> "$GITHUB_STEP_SUMMARY"
          [[ "${ci}" == 'success' ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Render production Wrangler configs
        # On a PR, resources the change adds are not applied yet; render
        # placeholders for them (with a warning) instead of failing.
        env:
          ALLOW_MISSING: ${{ github.event_name == 'pull_request' && '--allow-missing' || '' }}
        run: |
          terraform -chdir=infra init -input=false > /dev/null
          # shellcheck disable=SC2086  # ALLOW_MISSING is empty or one flag.
          node scripts/gen_wrangler.mjs --env prod ${ALLOW_MISSING}
          # Public Turnstile site key for the web build (test key until the
          # widget exists).
          sitekey="$(terraform -chdir=infra output -json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{process.stdout.write(JSON.parse(s).turnstile?.value?.sitekey??"")}catch{}})')"
          echo "VITE_TURNSTILE_SITE_KEY=${sitekey:-1x00000000000000000000AA}" >> "$GITHUB_ENV"
      - name: Worker bundles (dry-run)
        run: |
          for w in ontology-manager object-graph situation-awareness decision-engine \
                   data-integration identity-access api-gateway; do
            npx wrangler deploy --dry-run --outdir "dist/${w}" -c "apps/${w}/wrangler.jsonc"
          done
      - run: pnpm build:web

  approve:
    name: Approve (production)
    needs: build
    # Never on pull requests: from here on only main deploys.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The single approval for the whole rollout (required reviewers are set
    # on this environment).
    environment: production
    outputs:
      admin-email: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
    steps:
      - run: echo "Deploying ${SHA} to production." >> "$GITHUB_STEP_SUMMARY"

  ontology-manager:
    needs: [approve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: ontology-manager
          admin-email: ${{ needs.approve.outputs.admin-email }}

  object-graph:
    needs: [approve, ontology-manager]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: object-graph
          admin-email: ${{ needs.approve.outputs.admin-email }}

  situation-awareness:
    needs: [approve, ontology-manager, object-graph]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: situation-awareness
          admin-email: ${{ needs.approve.outputs.admin-email }}

  decision-engine:
    needs: [approve, ontology-manager, object-graph, situation-awareness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: decision-engine
          admin-email: ${{ needs.approve.outputs.admin-email }}

  data-integration:
    needs: [approve, ontology-manager, object-graph]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: data-integration
          admin-email: ${{ needs.approve.outputs.admin-email }}

  identity-access:
    needs:
      - approve
      - ontology-manager
      - data-integration
      - object-graph
      - situation-awareness
      - decision-engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMAIL_PEPPER: ${{ secrets.EMAIL_PEPPER }}
      EMAIL_ENC_KEY: ${{ secrets.EMAIL_ENC_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      BOOTSTRAP_ADMIN_SETUP_CODE: ${{ secrets.BOOTSTRAP_ADMIN_SETUP_CODE }}
      # TURNSTILE_SECRET and B2_* come from Terraform outputs (deploy-worker).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy-worker
        with:
          worker: identity-access
          admin-email: ${{ needs.approve.outputs.admin-email }}
          secrets: >-
            JWT_SIGNING_KEY EMAIL_PEPPER EMAIL_ENC_KEY RESEND_API_KEY
            BREVO_API_KEY TURNSTILE_SECRET B2_WRITE_KEY_ID B2_WRITE_APP_KEY
            B2_SIGN_KEY_ID B2_SIGN_APP_KEY CF_ANALYTICS_TOKEN
            BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_SETUP_CODE

  api-gateway:
    needs:
      - approve
      - identity-access
      - ontology-manager
      - data-integration
      - object-graph
      - situation-awareness
      - decision-engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      # JWT_PUBLIC_KEYS is a var rendered from JWT_SIGNING_KEY(_PREV).
      - uses: ./.github/actions/deploy-worker
        with:
          worker: api-gateway
          admin-email: ${{ needs.approve.outputs.admin-email }}

  web:
    name: web (Pages)
    needs: api-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Turnstile site key
        run: |
          terraform -chdir=infra init -input=false > /dev/null
          sitekey="$(terraform -chdir=infra output -json turnstile \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).sitekey))')"
          echo "VITE_TURNSTILE_SITE_KEY=${sitekey}" >> "$GITHUB_ENV"
      - run: pnpm build:web
      # Terraform does not manage the Pages project; the first deploy (or the
      # first one after scripts/reset.sh) creates it.
      - name: Create Pages project if missing
        working-directory: apps/web
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ontodecide-ce")"
          case "${status}" in
            200) echo "Pages project ontodecide-ce exists" ;;
            404) npx wrangler pages project create ontodecide-ce --production-branch main ;;
            *) echo "::error::Pages project lookup failed (HTTP ${status})"; exit 1 ;;
          esac
      # With a domain, /api/* is served by the api-gateway Workers Route on
      # the same host: publish the SPA without the Pages Functions proxy and
      # attach app.${APP_DOMAIN} (its CNAME is managed by Terraform).
      - name: Custom domain (pure static)
        if: env.APP_DOMAIN != ''
        working-directory: apps/web
        run: |
          rm -rf functions
          host="app.${APP_DOMAIN}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ontodecide-ce/domains"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${host}")"
          case "${status}" in
            200) echo "Pages custom domain ${host} attached" ;;
            404)
              curl -sS --fail-with-body -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                -d "{\"name\":\"${host}\"}" "${api}" > /dev/null
              echo "Attached Pages custom domain ${host}"
              ;;
            *) echo "::error::Pages domain lookup failed (HTTP ${status})"; exit 1 ;;
          esac
      - name: Deploy Pages
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name ontodecide-ce --branch main

  smoke:
    name: Post-deploy smoke (non-blocking)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports problems as warnings; a failed smoke never marks the rollout
    # failed (it is already live) but must be looked at.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Smoke (scripts/smoke.mjs, read-only)
        id: smoke
        run: |
          if [[ -n "${APP_DOMAIN}" ]]; then
            base="https://app.${APP_DOMAIN}"
            # With a custom domain *.pages.dev must answer 301 to it.
            export SMOKE_PAGES_URL='https://ontodecide-ce.pages.dev'
          else
            base='https://ontodecide-ce.pages.dev'
          fi
          export SMOKE_BASE_URL="${base}" SMOKE_ORIGIN="${base}" SMOKE_READONLY=1
          node scripts/smoke.mjs
      - name: Report
        if: failure() && steps.smoke.outcome == 'failure'
        run: echo '::warning::Post-deploy smoke checks failed (see the smoke step)'
