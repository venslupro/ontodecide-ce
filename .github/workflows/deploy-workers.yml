# ============================================================
# Deploy Cloudflare Workers
#
# Canonical deployment path for all 6 Workers in the monorepo.
# Runs on every push to `main`.  Each Worker deploys IN PARALLEL
# via the official `cloudflare/wrangler-action@v3`.
#
# Runtime bindings / IDs / Secrets model:
#   • CODE (this repo + wrangler-action):   deploys Worker bundle,
#                                            pushes runtime secrets
#                                            (JWT_SECRET, B2 keys, etc.)
#                                            from GitHub Secrets → Worker
#                                            via `wrangler secret put`.
#   • DASHBOARD (Worker → Variables & Secrets): owns non-secret resource
#                                            IDs (D1, KV) plus URL
#                                            overrides.  Values set in
#                                            Dashboard take precedence
#                                            over `REPLACE_WITH_*` defaults
#                                            committed to wrangler.toml,
#                                            so resource IDs NEVER need
#                                            to be written back to git.
#
# ************************  SECRET DISTRIBUTION (NEW)  *********************
# JWT_SECRET is NO LONGER distributed to every Worker.  Per the DDD
# boundary model:
#   • GATEWAY  — verifies inbound JWTs → needs JWT_SECRET.
#   • USER     — signs tokens on login/refresh → needs JWT_SECRET.
#   • GRAPH / INGESTION / AI / CLEANUP  — consume identity via
#     Gateway-injected headers (x-tenant-id, x-user-role, x-internal-call).
#     They do NOT receive JWT_SECRET.
# *************************************************************************
#
# Required GitHub Secrets (Repo → Settings → Secrets and variables):
#   CF_API_TOKEN      — Cloudflare API Token with Workers Scripts Edit,
#                       Workers KV Storage Edit, D1 Edit, Workers Routes
#                       Edit, Queues Edit permissions.
#   CF_ACCOUNT_ID     — Cloudflare Account ID (32 hex chars).
#
#   + Per-Worker runtime secrets (pushed by each matrix job via
#     `wrangler secret put` — set once, survives re-deploys):
#     JWT_SECRET        — HMAC signing key.  **Gateway + User only.**
#     NEO4J_PASSWORD    — AuraDB password (graph/cleanup only).
#     B2_KEY_ID         — Backblaze B2 Application Key keyID
#                         (ingestion/cleanup only).
#     B2_KEY            — Backblaze B2 Application Key secret
#                         (ingestion/cleanup only).
#     OPENAI_API_KEY    — (optional) Third-party LLM (ai only).
#     ANTHROPIC_API_KEY — (optional) Third-party LLM (ai only).
#     GOOGLE_API_KEY    — (optional) Third-party LLM (ai only).
#     OPENROUTER_API_KEY — (optional) Third-party LLM (ai only).
#     AI_GATEWAY_TOKEN  — (optional) AI Gateway auth (ai only).
#
# NOTE: secrets context is NOT available inside strategy.matrix,
# so we inject all secrets at the JOB level (env:), then read
# them from env inside the prepare_secrets step.
# ============================================================

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    # Map ALL GitHub Secrets → env vars (secrets context is NOT available
    # inside strategy.matrix, so we inject them at the job level and read
    # them from env in the step).
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_KEY: ${{ secrets.B2_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: 'gateway'
            config: 'apps/api/gateway/wrangler.toml'
            package: '@ontodecide/gateway'
          - name: 'user'
            config: 'apps/api/user/wrangler.toml'
            package: '@ontodecide/user'
          - name: 'graph'
            config: 'apps/api/graph/wrangler.toml'
            package: '@ontodecide/graph'
          - name: 'ingestion'
            config: 'apps/api/ingestion/wrangler.toml'
            package: '@ontodecide/ingestion'
          - name: 'ai'
            config: 'apps/api/ai/wrangler.toml'
            package: '@ontodecide/ai'
          - name: 'cleanup'
            config: 'apps/api/cleanup/wrangler.toml'
            package: '@ontodecide/cleanup'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Lock pnpm to the exact version declared in package.json
      # ("packageManager" field — Node.js corepack standard).
      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Build the target Worker + its transitive workspace deps
      # (in practice: @ontodecide/shared).  `turbo run build`
      # typechecks + emits shared/dist, which wrangler's esbuild
      # resolver picks up via @ontodecide/shared → package.json
      # exports.
      - name: Build ${{ matrix.service.name }}
        run: pnpm turbo run build --filter=${{ matrix.service.package }}

      # Ensure Cloudflare resources referenced by wrangler.toml exist
      # before deploy.
      #
      # IMPORTANT: wrangler CLI reads CLOUDFLARE_API_TOKEN /
      # CLOUDFLARE_ACCOUNT_ID (NOT CF_API_TOKEN / CF_ACCOUNT_ID).
      # We export the mapped names so direct `wrangler` shell commands
      # (queues create, d1 create) are authenticated.
      - name: Ensure Cloudflare resources for ${{ matrix.service.name }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          W="pnpm --filter=@ontodecide/${{ matrix.service.name }} exec wrangler"
          #
          # Ensure D1 database exists (shared by user + ai + cleanup)
          # Best-effort: D1 is auto-created on first deploy, so we
          # don't fail if the pre-create step errors.
          #
          DB_NAME="ontodecide-decision-db-production"
          case "${{ matrix.service.name }}" in
            user|ai|cleanup)
              set +e
              if ! $W d1 list --remote 2>/dev/null | grep -q "$DB_NAME"; then
                echo "Creating D1 database: $DB_NAME"
                $W d1 create "$DB_NAME" --remote
              else
                echo "D1 database $DB_NAME already exists"
              fi
              set -e
              ;;
          esac
          #
          # Ensure Queues exist (ingestion + cleanup)
          # MUST succeed: wrangler deploy fails if referenced queues
          # don't exist.  We use set -e so queue creation errors are
          # surfaced immediately, not silently swallowed.
          #
          case "${{ matrix.service.name }}" in
            ingestion)
              for q in ontodecide-ingestion-production ontodecide-ingestion-dlq-production; do
                set +e
                if ! $W queues list 2>/dev/null | grep -q "$q"; then
                  set -e
                  echo "Creating Queue: $q"
                  $W queues create "$q"
                else
                  set -e
                  echo "Queue $q already exists"
                fi
              done
              ;;
            cleanup)
              for q in ontodecide-cleanup-production ontodecide-cleanup-dlq-production; do
                set +e
                if ! $W queues list 2>/dev/null | grep -q "$q"; then
                  set -e
                  echo "Creating Queue: $q"
                  $W queues create "$q"
                else
                  set -e
                  echo "Queue $q already exists"
                fi
              done
              ;;
          esac
          #
          # KV namespaces are created automatically on first deploy
          # (wrangler detects [[kv_namespaces]] blocks and provisions
          # them). No explicit create needed here.
          #
          # Service Bindings are auto-resolved at deploy time.
          # Cron triggers in cleanup/wrangler.toml are auto-provisioned.
          echo "Resource check complete for ${{ matrix.service.name }}"

      # Build the secrets list for the current service.
      # wrangler-action expects secret NAMES (one per line), not
      # NAME=VALUE pairs. It reads values from process.env, which
      # we populate via the job-level env: mapping above.
      #
      # IMPORTANT: We skip secrets whose env var is empty/unset so
      # that deploys succeed even when optional secrets (e.g. LLM
      # API keys) are not yet configured.  The Worker itself will
      # log warnings at startup for missing required configs.
      - name: Prepare secrets for ${{ matrix.service.name }}
        id: prepare_secrets
        shell: bash
        run: |
          all_names=()
          case "${{ matrix.service.name }}" in
            gateway)
              all_names=("JWT_SECRET") ;;
            user)
              all_names=("JWT_SECRET" "EMAIL_API_KEY") ;;
            graph)
              all_names=("NEO4J_PASSWORD") ;;
            ingestion)
              all_names=("B2_KEY_ID" "B2_KEY") ;;
            ai)
              all_names=("OPENAI_API_KEY" "ANTHROPIC_API_KEY" "GOOGLE_API_KEY" "OPENROUTER_API_KEY" "AI_GATEWAY_TOKEN") ;;
            cleanup)
              all_names=("NEO4J_PASSWORD" "B2_KEY_ID" "B2_KEY") ;;
          esac
          # Filter: only include secrets that have a non-empty env value.
          names=()
          for name in "${all_names[@]}"; do
            val="${!name}"
            if [ -n "$val" ]; then
              names+=("$name")
            else
              echo "WARNING: $name is not set — skipping. Worker will validate at runtime."
            fi
          done
          {
            echo "secrets<<EOF"
            if [ ${#names[@]} -gt 0 ]; then
              printf '%s\n' "${names[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Deploy Worker code AND push runtime secrets in one step.
      # `secrets` input is written by wrangler-action@v3 via
      # `wrangler secret put <NAME>` — values come from the
      # job-level env (mapped from GitHub Secrets above).
      # Resource IDs (D1 / KV / Queue names / Service Bindings)
      # come from either wrangler.toml defaults or (preferred)
      # Dashboard Variables overrides — NOT managed by this CI.
      - name: Deploy ${{ matrix.service.name }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config ${{ matrix.service.config }}
          secrets: ${{ steps.prepare_secrets.outputs.secrets }}

  # ---------------------------------------------------------------
  # Post-deploy: apply D1 migrations to the shared decision-db.
  # Runs ONCE after all 6 Workers have successfully deployed.
  # ---------------------------------------------------------------
  migrate-d1:
    name: Apply D1 Migrations
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Apply D1 migrations (remote)
        run: ./scripts/migrate.sh --remote
