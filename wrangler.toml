# Root-level shared Wrangler configuration.
#
# Each Worker under apps/api/<name>/wrangler.toml inherits common settings via
# `inherit = true` and overrides only service-specific bindings and routes.
name = "ontodecide-root"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm install --frozen-lockfile && pnpm turbo run build"
