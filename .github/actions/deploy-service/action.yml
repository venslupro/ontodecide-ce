# ============================================================
# Composite action — Deploy a single Cloudflare Worker service.
#
# Encapsulates the per-service quality gates + wrangler deploy so
# that the 3 ordered deploy layers in deploy-service.yml stay thin
# and free of step-body duplication.
#
# Caller MUST provide (via job-level `env:`):
#   CF_API_TOKEN   — Cloudflare API token (Workers Scripts Edit + D1 Edit)
#   CF_ACCOUNT_ID  — Cloudflare Account ID
#   + per-service runtime secrets (JWT_SECRET / NEO4J_PASSWORD /
#     EMAIL_API_KEY / B2_KEY_ID / B2_KEY / OPENAI_API_KEY /
#     ANTHROPIC_API_KEY / GOOGLE_API_KEY / OPENROUTER_API_KEY /
#     AI_GATEWAY_TOKEN) so `prepare_secrets` can read them via bash
#     indirect expansion. Secrets are masked automatically by Actions.
#
# Caller passes the matrix entry via `with:` inputs below.
#
# `secrets` context is NOT available inside composite actions, so
# CF_API_TOKEN / CF_ACCOUNT_ID are read from `env` (mapped by the
# calling job from `secrets`).
# ============================================================

name: Deploy Worker Service
description: Quality gates (typecheck/lint/test/wrangler types/build) + wrangler deploy for one Cloudflare Worker service.

inputs:
  service_name:
    description: Service key (gateway | user | graph | ingestion | ai | cleanup). Drives the secret allow-list.
    required: true
  service_config:
    description: Path to the service's wrangler.toml.
    required: true
  service_package:
    description: pnpm package name (e.g. @ontodecide/gateway) used by turbo --filter.
    required: true

runs:
  using: composite
  steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    # ---- Toolchain (byte-equivalent to workers-builds image) ----
    - name: Setup pnpm (corepack)
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@9.12.0 --activate

    - name: Setup Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    # =============================================================
    # QUALITY GATES — per-service, runs BEFORE deploy.
    # All gates use `turbo run --filter=<pkg>` so shared/ is
    # typechecked / linted / tested as a transitive dependency
    # exactly once per cache key.
    # =============================================================

    # Gate 1: TypeScript typecheck (tsc --noEmit)
    - name: Gate 1 · Typecheck ${{ inputs.service_name }}
      shell: bash
      run: pnpm turbo run typecheck --filter=${{ inputs.service_package }}

    # Gate 2: ESLint (source + tests)
    - name: Gate 2 · Lint ${{ inputs.service_name }}
      shell: bash
      run: pnpm turbo run lint --filter=${{ inputs.service_package }}

    # Gate 3: Unit tests (vitest)
    - name: Gate 3 · Test ${{ inputs.service_name }}
      shell: bash
      run: pnpm turbo run test --filter=${{ inputs.service_package }}

    # Gate 4: `wrangler types` — compiles wrangler.toml bindings
    #         into worker-configuration.d.ts, then runs a tsc pass
    #         over the service again. Catches:
    #           • binding names that drift between Terraform +
    #             wrangler.toml + TypeScript code
    #           • missing D1 / KV / Queue IDs referenced from code
    #           • [vars] declared in wrangler.toml but not read via
    #             Env interface (or vice versa)
    - name: Gate 4 · wrangler types + re-typecheck ${{ inputs.service_name }}
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="${{ inputs.service_config }}"
        # Regenerate binding typings from wrangler.toml →
        # worker-configuration.d.ts (the "Environment contract").
        npx wrangler types --config "$CONFIG"
        # Re-run typecheck so tsc validates the freshly-generated
        # binding types against the service's code.
        pnpm turbo run typecheck --filter=${{ inputs.service_package }}

    # Gate 5: Build the worker bundle (shared/ transitive dist
    #         emitted by turbo, picked up by wrangler's esbuild)
    - name: Gate 5 · Build ${{ inputs.service_name }}
      shell: bash
      run: pnpm turbo run build --filter=${{ inputs.service_package }}

    # ------------------------------------------------------------
    # NOTE: long-lived Cloudflare resources (D1 / KV / Queues /
    # Service Bindings / Cron / Domains) are NOT created here.
    # They are the exclusive responsibility of Terraform
    # (terraform.yml). If a resource binding is missing at deploy
    # time, wrangler deploy FAILS LOUDLY — that is the intended
    # signal to run `terraform apply` first.
    # ------------------------------------------------------------

    # ---- Build secrets list for wrangler-action ----
    # wrangler-action@v3 expects NAMES (one per line). Values are
    # read from process.env (job-level `env:` of the caller).
    # Optional third-party LLM keys are skipped if empty.
    - name: Prepare secrets for ${{ inputs.service_name }}
      id: prepare_secrets
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service_name }}
      run: |
        all_names=()
        case "$SERVICE_NAME" in
          gateway)
            all_names=("JWT_SECRET") ;;
          user)
            all_names=("JWT_SECRET" "EMAIL_API_KEY") ;;
          graph)
            all_names=("NEO4J_PASSWORD") ;;
          ingestion)
            all_names=("B2_KEY_ID" "B2_KEY") ;;
          ai)
            all_names=("OPENAI_API_KEY" "ANTHROPIC_API_KEY" "GOOGLE_API_KEY" "OPENROUTER_API_KEY" "AI_GATEWAY_TOKEN") ;;
          cleanup)
            all_names=("NEO4J_PASSWORD" "B2_KEY_ID" "B2_KEY") ;;
        esac
        names=()
        for name in "${all_names[@]}"; do
          val="${!name}"
          if [ -n "$val" ]; then
            names+=("$name")
          else
            echo "WARNING: $name is not set — skipping. Worker will validate at runtime."
          fi
        done
        {
          echo "secrets<<EOF"
          if [ ${#names[@]} -gt 0 ]; then
            printf '%s\n' "${names[@]}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # ---- DEPLOY: wrangler deploy via official action ----
    # Resource bindings (D1 / KV / Queue / Service / Cron) are
    # READ FROM wrangler.toml AND Terraform-created Dashboard
    # overrides — Wrangler does NOT (re)create resources here.
    - name: Deploy ${{ inputs.service_name }} (code + secrets only)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ env.CF_API_TOKEN }}
        accountId: ${{ env.CF_ACCOUNT_ID }}
        command: deploy --config ${{ inputs.service_config }}
        secrets: ${{ steps.prepare_secrets.outputs.secrets }}
