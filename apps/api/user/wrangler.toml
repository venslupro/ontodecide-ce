# User Service Worker — authentication and account management.
#
# ============================================================
# HYBRID ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS:
#       - Worker skeleton + 4D tags
#       - D1 binding "DB" → cloudflare_d1_database.decision_db.id
#       - KV namespace "CACHE"
#   • Wrangler deploys: script code · [vars] · JWT_SECRET + EMAIL_API_KEY
# ============================================================
#
# Identity model:
#   • This Worker **signs** JWTs (login/refresh) so it holds JWT_SECRET.
#     It is one of only two services (Gateway + User) that know the secret.
#   • All other routes (profile, admin users) accept identity from the
#     Gateway via x-tenant-id / x-user-role / x-internal-call headers —
#     enforced by `internalOnlyMiddleware(['/auth/'])`.
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "ontodecide-prd-user"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/user exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
cwd = "apps/api/user"

# ----- D1: shared decision-db (Terraform-managed) -------------------------
# database_name MUST match "${project_name}-${env_short}-decision-db" (e.g. ontodecide-prd-decision-db)
# from main.tf → cloudflare_d1_database.decision_db.name.
#
# Use `database_name` here (not `database_id`) so the same wrangler.toml
# works across environments with different project/env names — Terraform
# provisions the D1 under the computed name, and Wrangler resolves the
# name → ID at deploy time.
#
# Migration SQL lives in src/migrations/*.sql and runs via
# scripts/migrate.sh --remote in the post-deploy migrate-d1 CI job.
[[d1_databases]]
binding        = "DB"
database_name  = "ontodecide-prd-decision-db"
migrations_dir = "src/migrations"

# ----- KV: session / user lookup cache (Terraform-managed) ----------------
# binding MUST match local.kv_binding_map entry for svc="user".
# DO NOT OMIT `id` — otherwise wrangler auto-creates a duplicate namespace.
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_CACHE_USER_ID"

[vars]
AI_DEFAULT_PROVIDER = "workers-ai"
EMAIL_FROM = "venslu.pro@gmail.com"

# Secrets (Dashboard → Secrets, CI, or `wrangler secret put`):
#   JWT_SECRET     — HMAC signing secret.
#                    **Required** here (signs tokens) and in the Gateway
#                    (verifies tokens); NOT required in downstream workers.
#   EMAIL_API_KEY  — Resend (or compatible) API key for sending
#                    transactional emails (account credentials).
#                    Optional: when unset, emails are skipped and the
#                    temporary password is returned in the API response.
#
# NOTE: This service no longer needs Neo4j credentials. Tenant data
# isolation is handled by the Graph Service via property isolation
# (tenant_id on every node), using a single shared Neo4j database.
