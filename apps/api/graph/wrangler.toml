# Graph Service Worker — ontology, entity, situation, and graph exploration.
#
# ============================================================
# ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS LONG-LIVED RESOURCES ONLY:
#       - D1 shared-db (cloudflare_d1_database.shared_db)
#       - 4 KV namespaces (USER_CACHE / INGESTION_JOBS /
#         AI_CACHE / CLEANUP_JOBS) — for cross-service cache invalidation
#   • Wrangler OWNS EVERYTHING WORKER-RELATED:
#       - Worker itself (created / updated by `wrangler deploy`)
#       - [observability] block — Workers Observability enabled here
#       - script code · [vars] · NEO4J_PASSWORD secret
#   • Neo4j Aura is managed OUTSIDE Terraform — connection config lives
#     in [vars] below, password is a CI-injected secret.
# ============================================================
#
# Exports:
#   * `fetch` — ontology, entity, situation, explore, cypher endpoints
#
# Identity model:
#   • This Worker trusts Gateway-injected headers (enforced by
#     `internalOnlyMiddleware()`). The `x-tenant-id` header is used as
#     the `organization` property for Neo4j multi-tenant isolation.

name = "ontodecide-prd-graph"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# ----- Workers Observability ------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
destinations = ["cloudflare"]
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/graph exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"

# ----- Neo4j Aura connection (non-sensitive) -------------------------------
# NEO4J_PASSWORD is injected as a secret via wrangler-action in CI.
[vars]
NEO4J_URI      = "neo4j+s://c757868d.databases.neo4j.io"
NEO4J_USERNAME = "c757868d"
NEO4J_DATABASE = "c757868d"
