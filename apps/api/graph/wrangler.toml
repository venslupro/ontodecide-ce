# Graph Service Worker — Neo4j AuraDB-backed knowledge graph.
#
# Deployed via Cloudflare Workers Builds (Git-connected). Neo4j HTTP
# Transaction API is used (Workers cannot open raw TCP sockets).
#
# Ownership split:
#   HERE: Worker code + runtime vars/secrets.
#   THERE (terraform): KV graph-cache namespace itself.
name = "decision-graph-service"
main = "dist/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm turbo run build --filter=@ontodecide/graph"
cwd = "apps/api/graph"

[build.upload]
format = "modules"
dir = "dist"
main = "./index.js"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"   # From: `terraform output kv_namespaces.graph-cache`

[vars]
NEO4J_URL  = "https://REPLACE_WITH_AURADB_HOST.databases.neo4j.io"
NEO4J_USER = "neo4j"

# Secrets:
#   JWT_SECRET    — shared across token-validating workers.
#   NEO4J_PASSWORD — password for NEO4J_USER.
