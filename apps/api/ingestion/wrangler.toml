# Ingestion Service Worker — multi-source data fusion.
#
# ============================================================
# ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS LONG-LIVED RESOURCES ONLY:
#       - Queue resources: ingestion + ingestion-dlq (raw queue entities)
#       - KV namespace "JOBS"
#       - Naming convention + shared-db / shared queues metadata
#   • Wrangler OWNS EVERYTHING WORKER-RELATED:
#       - Worker itself (created / updated by `wrangler deploy`)
#       - Service Binding → GRAPH_SERVICE (Ingestion → Graph)
#       - [[queues.producers]] / [[queues.consumers]] wiring + DLQ
#       - [[kv_namespaces]] JOBS binding (id injected by resolve-kv-ids.sh)
#       - [observability] block — Workers Observability enabled here
#       - script code · [vars] · B2_KEY_ID + B2_KEY secrets
#   • EXTERNAL IaC: Backblaze B2 bucket (ingestion staging)
#     — Terraform outputs required bucket tags schema in
#       external_backblaze_b2; bucket created via B2 console.
# ============================================================
#
# Two paths:
#   * sync  : ≤10 entities → inline call to Graph via Service Binding.
#   * async : larger files or webhooks → B2 staging → queue → consumer
#             → Graph via the same Service Binding.
#
# Identity model:
#   • This Worker does NOT hold JWT_SECRET. It trusts Gateway-injected
#     headers (enforced by `internalOnlyMiddleware`; /ingest/webhook is
#     exempt and uses its own signature scheme instead).
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "ontodecide-prd-ingestion"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# ----- Workers Observability ------------------------------------------------
# Enabled at the Worker by this wrangler.toml; every `wrangler deploy`
# re-applies the full block. Dashboard shows "Observability: Enabled".
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
destinations = ["cloudflare"]
head_sampling_rate = 1
persist = true

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/ingestion exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
# No `cwd` — see graph/wrangler.toml. A repo-root-relative path doubles and
# causes spawn /bin/sh ENOENT; the default (process cwd = service dir) is correct.

# ----- Service Binding: Ingestion → Graph ---------------------------------
#
# The loader (sync path) and queue consumer (async path) push entity batches
# directly to Graph over this binding — no Gateway round-trip, zero cost.
# `service` name matches local.workers["graph"].worker_name in main.tf.
[[services]]
binding = "GRAPH_SERVICE"
service = "ontodecide-prd-graph"

# ----- Async queue (Terraform CREATES queues; Wrangler maps consumers) ----
# Queue names MUST match cloudflare_queue.ingestion.name and
# cloudflare_queue.ingestion_dlq.name in main.tf:
#   main = "${project_name}-${env_short}-ingestion"
#   dlq  = "${project_name}-${env_short}-ingestion-dlq"
[[queues.producers]]
binding = "INGEST_QUEUE"
queue   = "ontodecide-prd-ingestion"

# Consumer + dead_letter_queue are CODE-LEVEL declarations.
# Terraform creates the raw Queue resources; wrangler wires the
# consumer function + DLQ redirection onto them at deploy time.
[[queues.consumers]]
queue             = "ontodecide-prd-ingestion"
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "ontodecide-prd-ingestion-dlq"

# ----- KV: async ingestion job tracking (Terraform-managed) ---------------
[[kv_namespaces]]
binding = "JOBS"
id = "REPLACE_WITH_TERRAFORM_CREATED_KV_JOBS_INGESTION_ID"

[vars]
# Backblaze B2 S3-compatible access: region + staging bucket name.
# Bucket names MUST match Terraform output external_backblaze_b2
# (tags: Environment / Project / Service=shared / Lifecycle=long-lived).
B2_REGION           = "us-west-004"
B2_INGESTION_BUCKET = "ontodecide-prd-ingestion-staging"

# Secrets (Dashboard → Secrets, CI, or `wrangler secret put`):
#   B2_KEY_ID   — B2 Application Key keyID with R/W on the staging bucket.
#   B2_KEY      — B2 Application Key secret paired with B2_KEY_ID.
#   (JWT_SECRET is NOT required here. Identity is read from headers.)
