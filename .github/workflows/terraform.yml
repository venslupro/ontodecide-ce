# ============================================================================
# Terraform · Infrastructure — manages Cloudflare resources (D1 / KV / Queues /
# Worker Bindings / Cron / Domains) via Terraform declarative model.
#
# TRIGGERS:
#   push/main          → fmt · validate · plan (READ-ONLY, apply skipped)
#   pull_request/main  → fmt · validate · plan (READ-ONLY, apply skipped)
#   workflow_dispatch  → fmt · validate · plan; apply runs ONLY on main branch
#                        and requires production Environment approval.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   CF_API_TOKEN      Cloudflare admin token (shared with deploy-service.yml)
#   CF_ACCOUNT_ID     Cloudflare Account ID (32 hex chars)
#   B2_KEY_ID / B2_KEY B2 credentials for Terraform state backend
# OPTIONAL VARS:
#   TF_ZONE_ID        DNS Zone ID for custom domains
# ============================================================================

name: Terraform · Infrastructure

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/terraform/**/*.tf'
      - 'infrastructure/terraform/**/*.tfvars'
      - '.github/workflows/terraform.yml'
      - 'infrastructure/terraform/.terraform.lock.hcl'
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/terraform/**/*.tf'
      - 'infrastructure/terraform/**/*.tfvars'
      - '.github/workflows/terraform.yml'
      - 'infrastructure/terraform/.terraform.lock.hcl'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infrastructure/terraform

env:
  # GitHub Actions Node 20 deprecation: force legacy actions to Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Provider / backend auth
  CLOUDFLARE_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
  AWS_ACCESS_KEY_ID:       ${{ secrets.B2_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:   ${{ secrets.B2_KEY }}
  # Terraform input variables (TF_VAR_* convention)
  TF_VAR_account_id:       ${{ secrets.CF_ACCOUNT_ID }}
  TF_VAR_zone_id:          ${{ vars.TF_ZONE_ID }}
  TF_VAR_project_name:     ${{ github.event.repository.name }}
  TF_VAR_environment:      'production'

jobs:
  # ── Phase 1: fmt + validate ────────────────────────────────────────────
  validate:
    name: Fmt · Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true
      - name: Purge stale cached providers (safety wipe before upgrade)
        # Ensures no cached v4.x binaries survive the v5 major-version bump.
        run: rm -rf infrastructure/terraform/.terraform/providers
      - name: Init without backend
        # v5 constraint (~> 5.19) resolved fresh from the registry.
        run: terraform init -backend=false -input=false -upgrade
      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive -list=false
      - name: Validate schema
        id: validate
        run: terraform validate

  # ── Phase 2: plan (read-only, runs against real CF state) ──────────────
  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      plan_exit: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true
      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: infrastructure/terraform/.terraform/providers
          # Bumped salt (v3-) for the v4→v5 major-version upgrade so we
          # intentionally miss any cached v4.x binaries.
          key: v3-tf-providers-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
      - name: Purge stale cached providers (safety wipe before upgrade)
        run: rm -rf infrastructure/terraform/.terraform/providers
      - name: Init
        # Re-resolve providers — cache key is lock-file based, so a fresh
        # lock entry from -upgrade is persisted for subsequent steps.
        run: terraform init -input=false -upgrade

      # One-off: remove stale entries from remote state before plan.
      # Safe no-op when keys are absent.
      # - D1 databases: stale UUIDs from v4 state
      # - Cron trigger: v4→v5 schedules schema mismatch (string[] → object[])
      - name: Clean stale state entries
        if: always()
        run: |
          set -u -o pipefail
          STATE_KEYS="$(terraform state list 2>/dev/null || true)"

          for KEY in cloudflare_d1_database.decision_db cloudflare_d1_database.shared_db; do
            if echo "${STATE_KEYS}" | grep -Fxq "${KEY}"; then
              terraform state rm "${KEY}"
            fi
          done

          if echo "${STATE_KEYS}" | grep -Fq 'cloudflare_workers_cron_trigger.cleanup_daily'; then
            if ! terraform state rm 'cloudflare_workers_cron_trigger.cleanup_daily["cleanup"]' 2>/dev/null; then
              terraform state pull > /tmp/tfstate.json
              jq '.resources |= map(select(.type != "cloudflare_workers_cron_trigger" or .name != "cleanup_daily"))' \
                /tmp/tfstate.json > /tmp/tfstate-clean.json
              terraform state push /tmp/tfstate-clean.json
              rm -f /tmp/tfstate.json /tmp/tfstate-clean.json
            fi
          fi

      - name: Plan
        id: plan
        run: |
          if [ -f terraform.tfvars ]; then
            terraform plan -input=false -out=tfplan.binary -var-file=terraform.tfvars
          else
            terraform plan -input=false -out=tfplan.binary
          fi
      - run: terraform show -json tfplan.binary > tfplan.json
      - run: terraform show tfplan.binary | tee tfplan-summary.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.sha }}
          path: |
            infrastructure/terraform/tfplan.json
            infrastructure/terraform/tfplan-summary.txt
            infrastructure/terraform/tfplan.binary
          retention-days: 30

  # ── Phase 3: apply — ONLY via workflow_dispatch/push on main + approval ─
  # Code-level gate: PR events can never reach this job (if: below).
  # Human gate: production Environment required reviewers pauses the job
  # before Terraform refreshes state and applies the change.
  apply:
    name: Apply (dispatch/push · main · env approval)
    needs: plan
    if: ( github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~> 1.9'
          terraform_wrapper: true
      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: infrastructure/terraform/.terraform/providers
          # Bumped salt (v3-) for the v4→v5 major-version upgrade.
          key: v3-tf-providers-${{ runner.os }}-${{ hashFiles('infrastructure/terraform/.terraform.lock.hcl') }}
      - name: Purge stale cached providers (safety wipe before upgrade)
        run: rm -rf infrastructure/terraform/.terraform/providers
      - name: Init
        # Apply runner may be different from plan runner; re-resolve so the
        # correct provider binary is available before applying the plan.
        run: terraform init -input=false -upgrade
      - name: Apply (fresh plan after approval)
        run: |
          if [ -f terraform.tfvars ]; then
            terraform apply -input=false -auto-approve -var-file=terraform.tfvars
          else
            terraform apply -input=false -auto-approve
          fi
      - name: Show outputs
        run: terraform output -json || true
