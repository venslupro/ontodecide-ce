# AI Service Worker — multi-LLM decision intelligence.
#
# ============================================================
# ARCHITECTURE OWNERSHIP (Terraform ↔ Wrangler split):
#   • Terraform CREATES & GOVERNS LONG-LIVED RESOURCES ONLY:
#       - D1 shared-db (cloudflare_d1_database.shared_db)
#       - Naming convention + Durable Object class audit metadata
#   • Wrangler OWNS EVERYTHING WORKER-RELATED:
#       - Worker itself (created / updated by `wrangler deploy`)
#       - Gateway → AI Service Binding (declared in gateway wrangler.toml)
#       - [ai] AI binding · [[durable_objects.bindings]] · [[migrations]]
#       - [[d1_databases]] DB binding (database_id injected by resolve-d1-ids.sh)
#       - [observability] block — Workers Observability enabled here
#       - [vars] plain-text · optional LLM provider secrets
# ============================================================
#
# Architecture:
#   • All LLM access routes through Cloudflare AI Gateway (cache + budget).
#   • Providers: Google AI Studio, Groq (priority) + Workers AI (fallback).
#   • Caching and budget management are handled at the gateway level;
#     no client-side KV cache or neuron-budget logic.
#
# Identity model:
#   • This Worker does NOT hold JWT_SECRET. It trusts Gateway-injected
#     headers (enforced by `internalOnlyMiddleware()` — every route is
#     Gateway-only; no public carve-outs).
#
# Build & deploy: see gateway wrangler.toml; identical model.

name = "ontodecide-prd-ai"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# ----- Workers Observability ------------------------------------------------
# Enabled at the Worker by this wrangler.toml; every `wrangler deploy`
# re-applies the full block. Dashboard shows "Observability: Enabled".
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
destinations = ["cloudflare"]
head_sampling_rate = 1
persist = true

# ----- Workers Traces (distributed tracing) --------------------------------
[observability.traces]
enabled = true
head_sampling_rate = 1

# LOCAL-ONLY [build] block.
[build]
command = "pnpm --filter=@ontodecide/ai exec tsc -p tsconfig.json --noEmit && pnpm --filter=@ontodecide/shared run build"
# No `cwd` — see graph/wrangler.toml. A repo-root-relative path doubles and
# causes spawn /bin/sh ENOENT; the default (process cwd = service dir) is correct.

# Workers AI binding (Wrangler-only — Terraform Provider v4 has no
# ai_binding block on cloudflare_workers_script).
[ai]
binding = "AI"

# ----- D1: shared-db (Terraform-managed) ---------------------------------
# database_name matches cloudflare_d1_database.shared_db.name pattern.
[[d1_databases]]
binding        = "DB"
database_name  = "ontodecide-prd-shared-db"
migrations_dir = "src/migrations"

# Durable Object: planning agent.
# Terraform knows the CLASS NAME (outputs as durable_object_classes) but
# the actual class CODE + binding is uploaded via Wrangler [[migrations]].
# NOTE: new_sqlite_classes is required on Cloudflare Free Plan
# (error code 10097 — legacy new_classes is paid-only).
[[durable_objects.bindings]]
name       = "AGENT"
class_name = "PlanningAgent"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["PlanningAgent"]

[vars]
AI_DEFAULT_PROVIDER = "workers-ai"
WORKERS_AI_MODEL    = "@cf/meta/llama-3-8b-instruct"
AI_GATEWAY_ID       = "ontodecide-prd-gateway"
GOOGLE_MODEL        = "gemini-1.5-flash"
GROQ_MODEL           = "llama-3.1-8b-instant"

# Secrets (Dashboard → Secrets, CI, or `wrangler secret put`):
#   (JWT_SECRET is NOT required here. Identity is read from headers.)
#   GOOGLE_API_KEY         — Google AI Studio (optional, enables google provider).
#   GROQ_API_KEY           — Groq (optional, enables groq provider).
#   Workers AI needs no key — uses Cloudflare account entitlement.
