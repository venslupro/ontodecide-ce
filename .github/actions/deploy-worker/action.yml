# Deploys one production Worker: install → render wrangler.jsonc from
# Terraform outputs → D1 migrations → deploy (secrets included in the
# deployed version).
# The caller's job env provides the Cloudflare, Terraform-state and secret
# values (see deploy.yml). Secrets that come from Terraform (Turnstile, B2
# archive keys) are read from its sensitive outputs and masked.
name: Deploy Worker
description: Deploy one production Worker.

inputs:
  worker:
    description: Worker directory under apps/.
    required: true
  admin-email:
    description: BOOTSTRAP_ADMIN_EMAIL (identity-access secret).
    required: true
  secrets:
    description: >-
      Space-separated env var names to upload as Worker secrets (empty
      values are skipped, so optional secrets keep their current value).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Fail fast: independent services deploy in parallel, but once any job
    # of this run has failed no further service starts. Jobs already running
    # finish, so no migration or deploy is interrupted halfway.
    # Exclude the current job so a re-run of a previously failed job is not
    # blocked by its own stale conclusion from an earlier attempt.
    - name: Stop if another service failed
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        failed="$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
          --jq '.jobs[] | select(.conclusion == "failure") | .name' \
          | grep -vxF "${GITHUB_JOB}")"
        if [[ -n "${failed}" ]]; then
          echo "::error::Not deploying: failed earlier in this run: ${failed//$'\n'/, }"
          exit 1
        fi
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22
        package-manager-cache: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.10.5
        terraform_wrapper: false
    - name: Install dependencies
      shell: bash
      run: |
        corepack enable && corepack prepare pnpm@9.12.0 --activate
        pnpm install --frozen-lockfile
    - name: Render Wrangler configs
      shell: bash
      run: |
        terraform -chdir=infra init -input=false > /dev/null
        terraform -chdir=infra output -json > tf-output.json
        # Sensitive outputs → masked env for the secret upload.
        node -e '
          const fs = require("fs");
          const o = require("./tf-output.json");
          const put = (k, v) => {
            if (!v) return;
            console.log(`::add-mask::${v}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${k}<<__EOF__\n${v}\n__EOF__\n`);
          };
          const b2 = o.b2_archive_keys?.value ?? {};
          put("B2_WRITE_KEY_ID", b2.write_key_id);
          put("B2_WRITE_APP_KEY", b2.write_key);
          put("B2_SIGN_KEY_ID", b2.sign_key_id);
          put("B2_SIGN_APP_KEY", b2.sign_key);
          put("TURNSTILE_SECRET", o.turnstile_secret?.value);
        '
        node scripts/gen_wrangler.mjs --env prod --tf-output tf-output.json
        rm tf-output.json
    - name: Migrate D1
      shell: bash
      env:
        CONFIG: apps/${{ inputs.worker }}/wrangler.jsonc
      run: |
        # D1_RESET_LEGACY=true (GitHub variable, one deploy only) drops a
        # V1.3 schema before the V2.4 migrations; see scripts/d1_migrate.mjs.
        flags=()
        [[ "${D1_RESET_LEGACY:-}" != 'true' ]] || flags+=(--reset-legacy)
        node scripts/d1_migrate.mjs -c "${CONFIG}" "${flags[@]}"
    # Secrets ship with the deployed version itself (`wrangler deploy
    # --secrets-file`, additive: omitted secrets keep their value), so a
    # freshly created Worker — e.g. identity-access with its */2 cron —
    # never runs a version without them. `wrangler secret bulk` would only
    # work once the Worker exists, i.e. after its first deploy.
    - name: Deploy (with secrets)
      shell: bash
      env:
        CONFIG: apps/${{ inputs.worker }}/wrangler.jsonc
        NAMES: ${{ inputs.secrets }}
        BOOTSTRAP_ADMIN_EMAIL: ${{ inputs.admin-email }}
      run: |
        flags=()
        if [[ -n "${NAMES}" ]]; then
          secrets_file="$(mktemp "${RUNNER_TEMP:-/tmp}/secrets.XXXXXX.json")"
          chmod 600 "${secrets_file}"
          trap 'rm -f "${secrets_file}"' EXIT
          # shellcheck disable=SC2086  # NAMES is a word list.
          node -e '
            const out = {};
            const skipped = [];
            for (const k of process.argv.slice(2)) {
              if (process.env[k]) out[k] = process.env[k];
              else skipped.push(k);
            }
            if (skipped.length) console.error(`Not set (kept as is): ${skipped.join(" ")}`);
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
            console.error(`Secrets in this version: ${Object.keys(out).join(" ") || "(none)"}`);
          ' "${secrets_file}" ${NAMES}
          if [[ "$(cat "${secrets_file}")" != '{}' ]]; then
            flags+=(--secrets-file "${secrets_file}")
          fi
        fi
        # First deploy of a new (or reset) Worker: right after the upload,
        # Wrangler reads /workers/workers/<name> to reconcile workers.dev /
        # preview URLs, and that API can lag behind the script API with
        # "This Worker does not exist" [code: 10007] — non-retryable to
        # Wrangler. The script itself is uploaded, so redeploying is safe.
        log="$(mktemp "${RUNNER_TEMP:-/tmp}/deploy.XXXXXX.log")"
        for attempt in 1 2 3 4; do
          if npx wrangler deploy -c "${CONFIG}" "${flags[@]}" 2>&1 | tee "${log}"; then
            exit 0
          fi
          grep -q 'code: 10007' "${log}" && (( attempt < 4 )) || exit 1
          echo "::warning::Worker not yet visible to the Workers API (10007); redeploying (attempt $((attempt + 1)))"
          sleep $((attempt * 10))
        done
